<script type="module">

import {
    auth,
    db
} from "./js/firebase-config.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs,
    getDoc,
    doc,
    updateDoc,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* =========================
   ELEMENTS
========================= */

const loading =
    document.getElementById("loading");

const requestList =
    document.getElementById("requestList");

const incomingTab =
    document.getElementById("incomingTab");

const sentTab =
    document.getElementById("sentTab");

const profileModal =
    document.getElementById("profileModal");

const modalContent =
    document.getElementById("modalContent");

let currentUser = null;

let currentMode = "incoming";


/* =========================
   DEFAULT AVATAR
========================= */

function defaultAvatar(){

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             width="300"
             height="300"
             viewBox="0 0 300 300">

            <rect
                width="300"
                height="300"
                fill="#11111a"
            />

            <circle
                cx="150"
                cy="110"
                r="55"
                fill="#29243a"
            />

            <path
                d="M50 285
                   C60 205 105 170 150 170
                   C195 170 240 205 250 285"
                fill="#29243a"
            />

        </svg>
        `);

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================
   NORMALIZE SKILLS
========================= */

function normalizeSkills(value){

    if(Array.isArray(value)){
        return value.filter(Boolean);
    }

    if(typeof value === "string"){

        return value
            .split(",")
            .map(x => x.trim())
            .filter(Boolean);

    }

    return [];

}


/* =========================
   LOAD REQUESTS
========================= */

async function loadRequests(){

    requestList.innerHTML = `
        <div class="empty">
            <h3>Loading requests...</h3>
            <p>Checking your Talent Exchange activity.</p>
        </div>
    `;


    try{

        let requestQuery;


        if(currentMode === "incoming"){

            requestQuery =
                query(
                    collection(db,"Requests"),
                    where(
                        "receiverId",
                        "==",
                        currentUser.uid
                    )
                );

        }else{

            requestQuery =
                query(
                    collection(db,"Requests"),
                    where(
                        "senderId",
                        "==",
                        currentUser.uid
                    )
                );

        }


        const snapshot =
            await getDocs(requestQuery);


        const requests =
            snapshot.docs
                .map(item => ({
                    id:item.id,
                    ...item.data()
                }))
                .sort((a,b) => {

                    const aTime =
                        a.createdAt?.seconds || 0;

                    const bTime =
                        b.createdAt?.seconds || 0;

                    return bTime - aTime;

                });


        /*
         Incoming tab:
         show pending requests first.

         Sent tab:
         show all sent requests.
        */

        const filtered =
            currentMode === "incoming"

                ? requests.filter(
                    item =>
                        item.status === "pending"
                )

                : requests;


        renderRequests(filtered);


    }catch(error){

        console.error(
            "REQUEST LOAD ERROR:",
            error
        );

        requestList.innerHTML = `
            <div class="empty">
                <h3>Unable to load requests</h3>
                <p>
                    ${escapeHtml(error.message)}
                </p>
            </div>
        `;

    }finally{

        setTimeout(() => {

            loading.classList.add("hide");

        },300);

    }

}


/* =========================
   RENDER REQUESTS
========================= */

async function renderRequests(requests){

    requestList.innerHTML = "";


    if(requests.length === 0){

        requestList.innerHTML = `

            <div class="empty">

                <h3>
                    ${
                        currentMode === "incoming"
                            ? "No incoming requests"
                            : "No sent requests"
                    }
                </h3>

                <p>
                    ${
                        currentMode === "incoming"
                            ? "When someone wants to exchange skills with you, it will appear here."
                            : "Requests you send will appear here."
                    }
                </p>

            </div>

        `;

        return;
    }


    for(const request of requests){

        const otherId =
            currentMode === "incoming"
                ? request.senderId
                : request.receiverId;


        let person = null;


        try{

            const userSnap =
                await getDoc(
                    doc(
                        db,
                        "users",
                        otherId
                    )
                );

            if(userSnap.exists()){

                person = {
                    id:userSnap.id,
                    ...userSnap.data()
                };

            }

        }catch(error){

            console.error(
                "USER LOAD ERROR:",
                error
            );

        }


        const name =
            person?.name ||
            (
                currentMode === "incoming"
                    ? request.senderName
                    : request.receiverName
            ) ||
            "Talent Exchange Member";


        const email =
            person?.email || "";


        const photo =
            person?.profilePhoto ||
            defaultAvatar();


        const skill =
            request.skill ||
            person?.offeredSkills?.[0] ||
            "";


        const card =
            document.createElement("div");

        card.className = "request-card";


        let actionHTML = "";


        if(currentMode === "incoming"){

            actionHTML = `

                <div class="actions">

                    <button
                        class="profile"
                        data-profile
                    >
                        Profile
                    </button>

                    <button
                        class="accept"
                        data-accept
                    >
                        Accept
                    </button>

                    <button
                        class="decline"
                        data-decline
                    >
                        Decline
                    </button>

                </div>

            `;

        }else{

            const status =
                request.status || "pending";


            if(status === "pending"){

                actionHTML = `

                    <div class="actions">

                        <button
                            class="profile"
                            data-profile
                        >
                            Profile
                        </button>

                        <button
                            class="cancel"
                            data-cancel
                        >
                            Cancel
                        </button>

                    </div>

                `;

            }else if(status === "accepted"){

                actionHTML = `

                    <div class="actions">

                        <button
                            class="accept"
                            disabled
                        >
                            Accepted
                        </button>

                    </div>

                `;

            }else{

                actionHTML = `

                    <div class="actions">

                        <button
                            class="decline"
                            disabled
                        >
                            ${escapeHtml(status)}
                        </button>

                    </div>

                `;

            }

        }


        card.innerHTML = `

            <div class="person">

                <img
                    class="avatar"
                    src="${escapeHtml(photo)}"
                    alt="Profile"
                >

                <div class="person-info">

                    <div class="person-name">
                        ${escapeHtml(name)}
                    </div>

                    <div class="person-email">
                        ${escapeHtml(email)}
                    </div>

                    ${
                        skill
                        ? `
                            <span class="skill">
                                ${escapeHtml(skill)}
                            </span>
                        `
                        : ""
                    }

                    <div class="meta">

                        ${
                            currentMode === "incoming"
                                ? "Wants to connect with you"
                                : "Request sent by you"
                        }

                        ${
                            request.status &&
                            currentMode === "sent"
                                ? " • " +
                                  escapeHtml(request.status)
                                : ""
                        }

                    </div>

                </div>

            </div>

            ${actionHTML}

        `;


        const profileBtn =
            card.querySelector("[data-profile]");


        if(profileBtn){

            profileBtn.addEventListener(
                "click",
                () => {

                    if(person){
                        showProfile(person);
                    }

                }
            );

        }


        const acceptBtn =
            card.querySelector("[data-accept]");


        if(acceptBtn){

            acceptBtn.addEventListener(
                "click",
                () =>
                    acceptRequest(
                        request,
                        acceptBtn
                    )
            );

        }


        const declineBtn =
            card.querySelector("[data-decline]");


        if(declineBtn){

            declineBtn.addEventListener(
                "click",
                () =>
                    declineRequest(
                        request,
                        declineBtn
                    )
            );

        }


        const cancelBtn =
            card.querySelector("[data-cancel]");


        if(cancelBtn){

            cancelBtn.addEventListener(
                "click",
                () =>
                    cancelRequest(
                        request,
                        cancelBtn
                    )
            );

        }


        requestList.appendChild(card);

    }

}


/* =========================
   ACCEPT REQUEST
========================= */

async function acceptRequest(
    request,
    button
){

    button.disabled = true;

    button.textContent = "Accepting...";


    try{

        /*
         Update request.
        */

        await updateDoc(
            doc(
                db,
                "Requests",
                request.id
            ),
            {
                status:"accepted",
                acceptedAt:serverTimestamp()
            }
        );


        /*
         Create one connection document.

         We use:
         userIds: [senderId, receiverId]

         This matches the new connections page.
        */

        const userIds = [
            request.senderId,
            request.receiverId
        ];


        /*
         Check for existing connection
         before creating another one.
        */

        const connectionQuery =
            query(
                collection(db,"Connections"),
                where(
                    "userIds",
                    "array-contains",
                    currentUser.uid
                )
            );


        const connectionSnapshot =
            await getDocs(
                connectionQuery
            );


        let exists = false;


        connectionSnapshot.forEach(item => {

            const data = item.data();

            if(
                Array.isArray(data.userIds) &&
                data.userIds.includes(
                    request.senderId
                ) &&
                data.userIds.includes(
                    request.receiverId
                )
            ){

                exists = true;

            }

        });


        if(!exists){

            await addDoc(
                collection(db,"Connections"),
                {

                    userIds:userIds,

                    user1Id:
                        request.senderId,

                    user2Id:
                        request.receiverId,

                    createdAt:
                        serverTimestamp()

                }
            );

        }


        button.textContent = "Accepted";


        setTimeout(
            loadRequests,
            500
        );


    }catch(error){

        console.error(
            "ACCEPT REQUEST ERROR:",
            error
        );

        button.disabled = false;

        button.textContent = "Accept";

        alert(
            "Unable to accept request.\n\n" +
            error.message
        );

    }

}


/* =========================
   DECLINE REQUEST
========================= */

async function declineRequest(
    request,
    button
){

    button.disabled = true;

    button.textContent = "Declining...";


    try{

        await updateDoc(
            doc(
                db,
                "Requests",
                request.id
            ),
            {
                status:"declined",
                declinedAt:serverTimestamp()
            }
        );


        loadRequests();


    }catch(error){

        console.error(
            "DECLINE REQUEST ERROR:",
            error
        );

        button.disabled = false;

        button.textContent = "Decline";

        alert(
            "Unable to decline request.\n\n" +
            error.message
        );

    }

}


/* =========================
   CANCEL REQUEST
========================= */

async function cancelRequest(

/* =========================
   PROFILE MODAL
========================= */

function showProfile(user){

    const photo =
        user.profilePhoto ||
        defaultAvatar();


    const offered =
        normalizeSkills(
            user.offeredSkills
        );


    const learning =
        normalizeSkills(
            user.learningSkills ||
            user.learningSkill
        );


    modalContent.innerHTML = `

        <div class="modal-profile">

            <img
                src="${escapeHtml(photo)}"
                class="modal-avatar"
                alt="Profile"
            >

            <h2>
                ${escapeHtml(
                    user.name ||
                    "Talent Exchange Member"
                )}
            </h2>

            <p>
                ${escapeHtml(
                    user.email || ""
                )}
            </p>

        </div>


        <div class="modal-section">

            <h4>About</h4>

            <div class="modal-bio">

                ${escapeHtml(
                    user.bio ||
                    "No bio added yet."
                )}

            </div>

        </div>


        <div class="modal-section">

            <h4>Skills Offered</h4>

            <div class="tags">

                ${
                    offered.length

                    ? offered.map(skill => `
                        <span class="tag">
                            ${escapeHtml(skill)}
                        </span>
                    `).join("")

                    : `
                        <span class="tag">
                            None added
                        </span>
                    `
                }

            </div>

        </div>


        <div class="modal-section">

            <h4>Skills Wanted</h4>

            <div class="tags">

                ${
                    learning.length

                    ? learning.map(skill => `
                        <span class="tag">
                            ${escapeHtml(skill)}
                        </span>
                    `).join("")

                    : `
                        <span class="tag">
                            None added
                        </span>
                    `
                }

            </div>

        </div>

    `;


    profileModal.classList.add("show");

}


/* =========================
   CLOSE MODAL
========================= */

document
    .getElementById("closeModal")
    .addEventListener(
        "click",
        () => {

            profileModal.classList.remove(
                "show"
            );

        }
    );


profileModal.addEventListener(
    "click",
    event => {

        if(
            event.target === profileModal
        ){

            profileModal.classList.remove(
                "show"
            );

        }

    }
);


/* =========================
   TABS
========================= */

incomingTab.addEventListener(
    "click",
    () => {

        currentMode = "incoming";

        incomingTab.classList.add("active");

        sentTab.classList.remove("active");

        loadRequests();

    }
);


sentTab.addEventListener(
    "click",
    () => {

        currentMode = "sent";

        sentTab.classList.add("active");

        incomingTab.classList.remove("active");

        loadRequests();

    }
);


/* =========================
   AUTH
========================= */

onAuthStateChanged(
    auth,
    user => {

        if(!user){

            window.location.href =
                "login.html";

            return;

        }

        currentUser = user;

        loadRequests();

    }
);


/* =========================
   LOGOUT
========================= */

document
    .getElementById("logoutBtn")
    .addEventListener(
        "click",
        async () => {

            try{

                await signOut(auth);

                localStorage.removeItem(
                    "userProfile"
                );

                localStorage.removeItem(
                    "isLoggedIn"
                );

                window.location.href =
                    "login.html";

            }catch(error){

                console.error(
                    "LOGOUT ERROR:",
                    error
                );

            }

        }
    );
