
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talent Exchange — Requests</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Inter, Arial, sans-serif;
    }

    body {
        background: #09090f;
        color: #f5f5f7;
        min-height: 100vh;
    }

    :root {
        --purple: #8b5cf6;
        --purple2: #a78bfa;
        --bg2: #11111a;
        --border: rgba(255,255,255,0.08);
        --muted: #9696a8;
        --green: #34d399;
        --red: #f87171;
    }

    .app {
        display: flex;
        min-height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
        width: 250px;
        background: #0d0d15;
        border-right: 1px solid var(--border);
        padding: 25px 16px;
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 20;
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 0 10px 28px;
        font-size: 20px;
        font-weight: 800;
    }

    .logo-icon {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: linear-gradient(135deg, #7c3aed, #a855f7);
        display: grid;
        place-items: center;
        font-size: 18px;
    }

    .nav-title {
        color: #626273;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        padding: 0 12px 10px;
    }

    .nav a {
        display: flex;
        align-items: center;
        gap: 13px;
        color: #9999aa;
        text-decoration: none;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 4px;
        font-size: 14px;
        transition: .2s;
    }

    .nav a:hover {
        background: rgba(139,92,246,.08);
        color: white;
    }

    .nav a.active {
        background: rgba(139,92,246,.16);
        color: #c4b5fd;
    }

    .nav-icon {
        width: 20px;
        text-align: center;
    }

    .logout {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 22px;
    }

    /* MAIN */
    .main {
        margin-left: 250px;
        width: calc(100% - 250px);
        padding: 34px 40px;
    }

    .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
    }

    .topbar h1 {
        font-size: 30px;
        margin-bottom: 6px;
    }

    .topbar p {
        color: var(--muted);
        font-size: 14px;
    }

    .profile-mini {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .mini-avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: linear-gradient(135deg,#7c3aed,#ec4899);
        display: grid;
        place-items: center;
        font-weight: bold;
    }

    /* TABS */
    .tabs {
        display: flex;
        gap: 6px;
        background: #11111a;
        border: 1px solid var(--border);
        padding: 5px;
        border-radius: 12px;
        width: fit-content;
        margin-bottom: 24px;
    }

    .tab {
        border: none;
        background: transparent;
        color: #9292a5;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
    }

    .tab.active {
        background: var(--purple);
        color: white;
    }

    /* REQUEST CARDS */
    .requests-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill,minmax(360px,1fr));
        gap: 18px;
    }

    .request-card {
        background: linear-gradient(145deg,#12121c,#0f0f17);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 21px;
        transition: .2s;
    }

    .request-card:hover {
        border-color: rgba(139,92,246,.35);
        transform: translateY(-2px);
    }

    .person {
        display: flex;
        align-items: center;
        gap: 13px;
        margin-bottom: 17px;
    }

    .avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 17px;
        background: linear-gradient(135deg,#4f46e5,#9333ea);
    }

    .person h3 {
        font-size: 16px;
        margin-bottom: 4px;
    }

    .person span {
        color: var(--muted);
        font-size: 12px;
    }

    .online {
        margin-left: auto;
        font-size: 11px !important;
        color: var(--green) !important;
    }

    .section-label {
        color: #77778a;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .8px;
        margin: 14px 0 7px;
    }

    .skills {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
    }

    .skill {
        padding: 6px 9px;
        border-radius: 7px;
        background: rgba(139,92,246,.1);
        border: 1px solid rgba(139,92,246,.18);
        color: #c4b5fd;
        font-size: 11px;
    }

    .skill.learn {
        background: rgba(52,211,153,.07);
        border-color: rgba(52,211,153,.16);
        color: #86efac;
    }

    .bio {
        color: #9999aa;
        font-size: 13px;
        line-height: 1.55;
        margin: 14px 0;
    }

    .evidence {
        display: flex;
        gap: 15px;
        color: #858596;
        font-size: 12px;
        padding: 11px 0;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
    }

    .actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
    }

    button {
        font-family: inherit;
    }

    .btn {
        flex: 1;
        border: none;
        border-radius: 9px;
        padding: 10px 12px;
        cursor: pointer;
        font-weight: 700;
        font-size: 12px;
        transition: .2s;
    }

    .btn:hover {
        transform: translateY(-1px);
    }

    .accept {
        background: var(--purple);
        color: white;
    }

    .decline {
        background: rgba(248,113,113,.08);
        color: #fca5a5;
        border: 1px solid rgba(248,113,113,.16);
    }

    .profile-btn {
        background: #191923;
        color: #d5d5df;
        border: 1px solid var(--border);
    }

    /* SENT */
    .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 9px;
        border-radius: 7px;
        font-size: 11px;
        font-weight: 700;
        margin-top: 5px;
    }

    .pending {
        color: #fbbf24;
        background: rgba(251,191,36,.08);
    }

    .accepted {
        color: #6ee7b7;
        background: rgba(52,211,153,.08);
    }

    .rejected {
        color: #fca5a5;
        background: rgba(248,113,113,.08);
    }

    .cancel {
        background: #191923;
        color: #aaaabb;
        border: 1px solid var(--border);
    }

    .chat {
        background: rgba(139,92,246,.12);
        color: #c4b5fd;
        border: 1px solid rgba(139,92,246,.2);
    }

    /* EMPTY */
    .empty {
        border: 1px dashed rgba(255,255,255,.1);
        border-radius: 18px;
        padding: 70px 20px;
        text-align: center;
        color: #77778a;
    }

    .empty-icon {
        font-size: 42px;
        margin-bottom: 15px;
    }

    .empty h3 {
        color: #dddde7;
        margin-bottom: 8px;
    }

    /* TOAST */
    .toast {
        position: fixed;
        right: 25px;
        bottom: 25px;
        background: #181821;
        border: 1px solid rgba(139,92,246,.3);
        box-shadow: 0 15px 40px rgba(0,0,0,.35);
        padding: 14px 18px;
        border-radius: 11px;
        display: none;
        z-index: 100;
        font-size: 13px;
    }

    /* MODAL */
    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.72);
        z-index: 80;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .modal-box {
        width: min(520px,100%);
        background: #11111a;
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 26px;
        max-height: 90vh;
        overflow-y: auto;
    }

    .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 22px;
    }

    .close {
        border: none;
        background: #1b1b26;
        color: #aaa;
        width: 34px;
        height: 34px;
        border-radius: 9px;
        cursor: pointer;
    }

    .modal-box p {
        color: #9999aa;
        line-height: 1.6;
        font-size: 14px;
    }

    /* MOBILE */
    .mobile-header {
        display: none;
    }

    @media(max-width:800px) {
        .sidebar {
            display: none;
        }

        .mobile-header {
            display: flex;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            justify-content: space-between;
            align-items: center;
        }

        .main {
            margin-left: 0;
            width: 100%;
            padding: 25px 18px;
        }

        .topbar {
            align-items: flex-start;
        }

        .profile-mini {
            display: none;
        }

        .requests-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

<div class="mobile-header">
    <div class="logo">
        <div class="logo-icon">TE</div>
        Talent Exchange
    </div>
    <a href="dashboard.html" style="color:#aaa;text-decoration:none;">Dashboard</a>
</div>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">TE</div>
            Talent Exchange
        </div>

        <div class="nav-title">Workspace</div>

        <nav class="nav">

            <a href="dashboard.html">
                <span class="nav-icon">⌂</span>
                Dashboard
            </a>

            <a href="find-skills.html">
                <span class="nav-icon">⌕</span>
                Find Skills
            </a>

            <a href="requests.html" class="active">
                <span class="nav-icon">♢</span>
                Requests
            </a>

            <a href="connections.html">
                <span class="nav-icon">◎</span>
                Connections
            </a>

            <a href="chat.html">
                <span class="nav-icon">◌</span>
                Chat
            </a>

            <a href="profile.html">
                <span class="nav-icon">⚙</span>
                Edit Profile
            </a>

        </nav>

        <div class="logout">
            <a href="login.html" class="nav" style="text-decoration:none;">
                <span class="nav-icon">↪</span>
                Logout
            </a>
        </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <div class="topbar">
            <div>
                <h1>Requests</h1>
                <p>Manage your skill exchange requests and connections.</p>
            </div>

            <div class="profile-mini">
                <div>
                    <strong id="topName">User</strong>
                </div>
                <div class="mini-avatar" id="topAvatar">U</div>
            </div>
        </div>

        <!-- TABS -->
        <div class="tabs">
            <button class="tab active" onclick="showTab('incoming', this)">
                Incoming
                <span id="incomingCount"></span>
            </button>

            <button class="tab" onclick="showTab('sent', this)">
                Sent
                <span id="sentCount"></span>
            </button>
        </div>

        <!-- INCOMING -->
        <section id="incomingSection">

            <div class="requests-grid" id="incomingList"></div>

        </section>

        <!-- SENT -->
        <section id="sentSection" style="display:none;">

            <div class="requests-grid" id="sentList"></div>

        </section>

    </main>

</div>

<!-- PROFILE MODAL -->
<div class="modal" id="profileModal">

    <div class="modal-box">

        <div class="modal-head">
            <h2 id="modalName">Profile</h2>
            <button class="close" onclick="closeModal()">✕</button>
        </div>

        <div id="modalContent"></div>

    </div>

</div>

<div class="toast" id="toast"></div>


<script>

/* =========================================================
   CURRENT USER
========================================================= */

let currentUser = JSON.parse(localStorage.getItem("userProfile")) || {
    id: "current-user",
    name: "Mahadev",
    email: "mahadev@example.com",
    skill: "Python",
    learningSkill: "Guitar",
    bio: "Interested in learning and sharing practical skills."
};

document.getElementById("topName").textContent = currentUser.name;
document.getElementById("topAvatar").textContent =
    currentUser.name.charAt(0).toUpperCase();


/* =========================================================
   DEMO INCOMING REQUESTS
   Only created if no requests exist yet.
========================================================= */

let incomingRequests =
    JSON.parse(localStorage.getItem("incomingExchangeRequests"));

if (!incomingRequests) {

    incomingRequests = [

        {
            id: "REQ001",
            userId: "rahul001",
            name: "Rahul",
            role: "Web Developer",
            avatar: "R",
            online: true,
            offered: ["JavaScript", "React"],
            learning: ["Python", "Cybersecurity"],
            bio: "I enjoy building modern web applications and would like to exchange practical development skills.",
            evidence: 2,
            videos: 1,
            status: "pending"
        },

        {
            id: "REQ002",
            userId: "ananya001",
            name: "Ananya",
            role: "UI/UX Designer",
            avatar: "A",
            online: false,
            offered: ["UI/UX Design", "Figma"],
            learning: ["HTML", "JavaScript"],
            bio: "Designer interested in collaborating with developers and learning frontend development.",
            evidence: 3,
            videos: 2,
            status: "pending"
        }

    ];

    localStorage.setItem(
        "incomingExchangeRequests",
        JSON.stringify(incomingRequests)
    );
}


/* =========================================================
   SENT REQUESTS
========================================================= */

let sentRequests =
    JSON.parse(localStorage.getItem("sentExchangeRequests")) || [];


/*
   Demo sent requests.
   IDs from Find Skills page can also be stored here.
*/

if (sentRequests.length === 0) {

    sentRequests = [

        {
            id: "REQ003",
            userId: "kiran001",
            name: "Kiran",
            role: "Python Developer",
            avatar: "K",
            offered: ["Python", "Flask"],
            learning: ["Cybersecurity"],
            bio: "Backend developer interested in cybersecurity and API development.",
            status: "pending"
        }

    ];

    localStorage.setItem(
        "sentExchangeRequests",
        JSON.stringify(sentRequests)
    );
}


/* =========================================================
   CONNECTIONS
========================================================= */

let connections =
    JSON.parse(localStorage.getItem("connections")) || [];


/* =========================================================
   RENDER INCOMING
========================================================= */

function renderIncoming() {

    const container = document.getElementById("incomingList");

    document.getElementById("incomingCount").textContent =
        incomingRequests.length
        ? ` (${incomingRequests.length})`
        : "";

    if (incomingRequests.length === 0) {

        container.innerHTML = `
            <div class="empty" style="grid-column:1/-1;">
                <div class="empty-icon">📨</div>
                <h3>No incoming requests</h3>
                <p>When someone wants to exchange skills with you, their request will appear here.</p>
            </div>
        `;

        return;
    }

    container.innerHTML = incomingRequests.map(request => `

        <div class="request-card">

            <div class="person">

                <div class="avatar">
                    ${request.avatar}
                </div>

                <div>
                    <h3>${escapeHTML(request.name)}</h3>
                    <span>${escapeHTML(request.role)}</span>
                </div>

                ${
                    request.online
                    ? `<span class="online">● Online</span>`
                    : ""
                }

            </div>


            <div class="section-label">
                They offer
            </div>

            <div class="skills">
                ${request.offered.map(skill =>
                    `<span class="skill">${escapeHTML(skill)}</span>`
                ).join("")}
            </div>


            <div class="section-label">
                They want to learn
            </div>

            <div class="skills">
                ${request.learning.map(skill =>
                    `<span class="skill learn">${escapeHTML(skill)}</span>`
                ).join("")}
            </div>


            <div class="bio">
                ${escapeHTML(request.bio)}
            </div>


            <div class="evidence">
                <span>📄 ${request.evidence} Evidence</span>
                <span>🎥 ${request.videos} Videos</span>
            </div>


            <div class="actions">

                <button
                    class="btn profile-btn"
                    onclick="viewProfile('${request.id}')">
                    View Profile
                </button>

                <button
                    class="btn decline"
                    onclick="declineRequest('${request.id}')">
                    Decline
                </button>

                <button
                    class="btn accept"
                    onclick="acceptRequest('${request.id}')">
                    Accept
                </button>

            </div>

        </div>

    `).join("");
}


/* =========================================================
   RENDER SENT
========================================================= */

function renderSent() {

    const container = document.getElementById("sentList");

    document.getElementById("sentCount").textContent =
        sentRequests.length
        ? ` (${sentRequests.length})`
        : "";

    if (sentRequests.length === 0) {

        container.innerHTML = `
            <div class="empty" style="grid-column:1/-1;">
                <div class="empty-icon">📤</div>
                <h3>No sent requests</h3>
                <p>Find someone with a skill you want to learn and send them an exchange request.</p>
            </div>
        `;

        return;
    }


    container.innerHTML = sentRequests.map(request => {

        let statusClass = "pending";

        if (request.status === "accepted") {
            statusClass = "accepted";
        }

        if (request.status === "declined") {
            statusClass = "rejected";
        }

        let statusText =
            request.status.charAt(0).toUpperCase() +
            request.status.slice(1);

        return `

        <div class="request-card">

            <div class="person">

                <div class="avatar">
                    ${request.avatar}
                </div>

                <div>
                    <h3>${escapeHTML(request.name)}</h3>
                    <span>${escapeHTML(request.role)}</span>
                </div>

            </div>


            <div class="section-label">
                They offer
            </div>

            <div class="skills">
                ${request.offered.map(skill =>
                    `<span class="skill">${escapeHTML(skill)}</span>`
                ).join("")}
            </div>


            <div class="section-label">
                They want to learn
            </div>

            <div class="skills">
                ${request.learning.map(skill =>
                    `<span class="skill learn">${escapeHTML(skill)}</span>`
                ).join("")}
            </div>


            <div class="status ${statusClass}">
                ● ${statusText}
            </div>


            <div class="actions">

                <button
                    class="btn profile-btn"
                    onclick="viewSentProfile('${request.id}')">
                    View Profile
                </button>

                ${
                    request.status === "pending"
                    ? `
                        <button
                            class="btn cancel"
                            onclick="cancelRequest('${request.id}')">
                            Cancel Request
                        </button>
                    `
                    : ""
                }

                ${
                    request.status === "accepted"
                    ? `
                        <button
                            class="btn chat"
                            onclick="openChat('${request.userId}','${escapeAttribute(request.name)}')">
                            Open Chat
                        </button>
                    `
                    : ""
                }

            </div>

        </div>

        `;

    }).join("");
}


/* =========================================================
   ACCEPT REQUEST
========================================================= */

function acceptRequest(id) {

    const index =
        incomingRequests.findIndex(req => req.id === id);

    if (index === -1) return;

    const request = incomingRequests[index];


    /*
       Create connection.
       Later this will be handled by backend:
       PUT /api/requests/:id/accept
       GET /api/connections
    */

    const connection = {
        id: "CON-" + Date.now(),
        userId: request.userId,
        name: request.name,
        role: request.role,
        avatar: request.avatar,
        skills: request.offered,
        learning: request.learning,
        connectedAt: new Date().toISOString()
    };

    connections.push(connection);

    localStorage.setItem(
        "connections",
        JSON.stringify(connections)
    );


    incomingRequests.splice(index, 1);

    localStorage.setItem(
        "incomingExchangeRequests",
        JSON.stringify(incomingRequests)
    );


    showToast(
        `${request.name} is now your connection.`
    );

    renderIncoming();
}


/* =========================================================
   DECLINE
========================================================= */

function declineRequest(id) {

    const request =
        incomingRequests.find(req => req.id === id);

    incomingRequests =
        incomingRequests.filter(req => req.id !== id);

    localStorage.setItem(
        "incomingExchangeRequests",
        JSON.stringify(incomingRequests)
    );

    if (request) {
        showToast(`Request from ${request.name} declined.`);
    }

    renderIncoming();
}


/* =========================================================
   CANCEL SENT REQUEST
========================================================= */

function cancelRequest(id) {

    const request =
        sentRequests.find(req => req.id === id);

    sentRequests =
        sentRequests.filter(req => req.id !== id);

    localStorage.setItem(
        "sentExchangeRequests",
        JSON.stringify(sentRequests)
    );

    if (request) {
        showToast("Exchange request cancelled.");
    }

    renderSent();
}


/* =========================================================
   TABS
========================================================= */

function showTab(tab, button) {

    document.querySelectorAll(".tab").forEach(btn => {
        btn.classList.remove("active");
    });

    button.classList.add("active");

    if (tab === "incoming") {

        document.getElementById("incomingSection").style.display = "block";
        document.getElementById("sentSection").style.display = "none";

    } else {

        document.getElementById("incomingSection").style.display = "none";
        document.getElementById("sentSection").style.display = "block";

    }
}


/* =========================================================
   VIEW PROFILE
========================================================= */

function viewProfile(id) {

    const request =
        incomingRequests.find(req => req.id === id);

    if (!request) return;

    document.getElementById("modalName").textContent =
        request.name;

    document.getElementById("modalContent").innerHTML = `

        <div class="person">

            <div class="avatar">
                ${request.avatar}
            </div>

            <div>
                <h3>${escapeHTML(request.name)}</h3>
                <span>${escapeHTML(request.role)}</span>
            </div>

        </div>

        <div class="section-label">About</div>

        <p>${escapeHTML(request.bio)}</p>

        <div class="section-label">Skills Offered</div>

        <div class="skills">
            ${request.offered.map(skill =>
                `<span class="skill">${escapeHTML(skill)}</span>`
            ).join("")}
        </div>

        <div class="section-label">Skills Wanted</div>

        <div class="skills">
            ${request.learning.map(skill =>
                `<span class="skill learn">${escapeHTML(skill)}</span>`
            ).join("")}
        </div>

        <div class="section-label">Skill Evidence</div>

        <p>
            📄 ${request.evidence} certificate/document items<br>
            🎥 ${request.videos} skill demonstration videos
        </p>

    `;

    document.getElementById("profileModal").style.display = "flex";
}


/* =========================================================
   SENT PROFILE
========================================================= */

function viewSentProfile(id) {

    const request =
        sentRequests.find(req => req.id === id);

    if (!request) return;

    document.getElementById("modalName").textContent =
        request.name;

    document.getElementById("modalContent").innerHTML = `

        <div class="person">

            <div class="avatar">
                ${request.avatar}
            </div>

            <div>
                <h3>${escapeHTML(request.name)}</h3>
                <span>${escapeHTML(request.role)}</span>
            </div>

        </div>

        <div class="section-label">About</div>

        <p>${escapeHTML(request.bio)}</p>

        <div class="section-label">Skills Offered</div>

        <div class="skills">
            ${request.offered.map(skill =>
                `<span class="skill">${escapeHTML(skill)}</span>`
            ).join("")}
        </div>

        <div class="section-label">Skills Wanted</div>

        <div class="skills">
            ${request.learning.map(skill =>
                `<span class="skill learn">${escapeHTML(skill)}</span>`
            ).join("")}
        </div>

    `;

    document.getElementById("profileModal").style.display = "flex";
}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal() {
    document.getElementById("profileModal").style.display = "none";
}

window.addEventListener("click", function(event) {

    const modal =
        document.getElementById("profileModal");

    if (event.target === modal) {
        closeModal();
    }

});


/* =========================================================
   OPEN CHAT
========================================================= */

function openChat(id, name) {

    localStorage.setItem("activeChatId", id);
    localStorage.setItem("activeChatName", name);

    window.location.href = "chat.html";
}


/* =========================================================
   TOAST
========================================================= */

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent = message;
    toast.style.display = "block";

    setTimeout(() => {
        toast.style.display = "none";
    }, 2800);
}


/* =========================================================
   SECURITY HELPERS
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {
    return String(value)
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;");
}


/* =========================================================
   INITIAL LOAD
========================================================= */

renderIncoming();
renderSent();

</script>
