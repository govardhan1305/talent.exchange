<!DOCTYPE html>

  <style>
    * {

  </style>

  <script type="module">

    import {
      auth,
      db
    } from "./js/firebase-config.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      doc,
      getDoc,
      addDoc,
      collection,
      query,
      where,
      orderBy,
      onSnapshot,
      serverTimestamp,
      updateDoc,
      deleteDoc
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    /* =====================================================
       BASIC ELEMENTS
    ===================================================== */

    const messagesBox =
      document.getElementById("messages");

    const messageForm =
      document.getElementById("messageForm");

    const messageInput =
      document.getElementById("messageInput");


    const sideName =
      document.getElementById("sideName");

    const sideSkill =
      document.getElementById("sideSkill");

    const sideAvatar =
      document.getElementById("sideAvatar");

    const headerName =
      document.getElementById("headerName");

    const headerAvatar =
      document.getElementById("headerAvatar");


    const callOverlay =
      document.getElementById("callOverlay");

    const callTitle =
      document.getElementById("callTitle");

    const localVideo =
      document.getElementById("localVideo");

    const remoteVideo =
      document.getElementById("remoteVideo");

    const incomingCard =
      document.getElementById("incomingCard");

    const incomingTitle =
      document.getElementById("incomingTitle");

    const incomingText =
      document.getElementById("incomingText");


    let currentUser = null;
    let targetUser = null;

    let chatId = null;

    let unsubscribeMessages = null;
    let unsubscribeCalls = null;

    let localStream = null;
    let peerConnection = null;

    let currentCallId = null;
    let currentCallType = null;

    let incomingCallData = null;

    let isCaller = false;


    /* =====================================================
       WEBRTC CONFIG
    ===================================================== */

    const rtcConfig = {

      iceServers: [

        {
          urls: "stun:stun.l.google.com:19302"
        },

        {
          urls: "stun:stun1.l.google.com:19302"
        }

      ]

    };


    /* =====================================================
       TOAST
    ===================================================== */

    function showToast(message) {

      const toast =
        document.getElementById("toast");

      toast.textContent = message;

      toast.classList.add("show");

      setTimeout(() => {

        toast.classList.remove("show");

      }, 3000);

    }


    /* =====================================================
       GET CHAT USER
    ===================================================== */

    function getTargetId() {

      return (
        localStorage.getItem("activeChatId") ||
        localStorage.getItem("activeChatUserId")
      );

    }


    /* =====================================================
       AUTH
    ===================================================== */

    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        window.location.href =
          "login.html";

        return;
      }


      currentUser = user;


      const targetId =
        getTargetId();


      if (!targetId) {

        showToast(
          "No connection selected."
        );

        setTimeout(() => {

          window.location.href =
            "connections.html";

        }, 1200);

        return;
      }


      try {

        const targetSnap =
          await getDoc(
            doc(db, "users", targetId)
          );


        if (!targetSnap.exists()) {

          showToast(
            "Connection profile not found."
          );

          return;
        }


        targetUser = {

          id: targetSnap.id,

          ...targetSnap.data()

        };


        setupUserUI();

        setupChat();

        setupIncomingCalls();

      }
      catch (error) {

        console.error(error);

        showToast(
          "Unable to load chat."
        );

      }

    });


    /* =====================================================
       USER UI
    ===================================================== */

    function setupUserUI() {

      const name =
        targetUser.name ||
        targetUser.email ||
        "Connection";


      const skills =
        targetUser.offeredSkills ||
        targetUser.skill ||
        [];


      let skillText = "";


      if (Array.isArray(skills)) {

        skillText =
          skills.join(", ");

      }
      else {

        skillText =
          skills || "Talent Exchange";

      }


      const photo =
        targetUser.profilePhoto ||
        "";


      sideName.textContent =
        name;

      headerName.textContent =
        name;

      sideSkill.textContent =
        skillText || "Talent Exchange";


      if (photo) {

        sideAvatar.src =
          photo;

        headerAvatar.src =
          photo;

      }
      else {

        sideAvatar.style.display =
          "none";

        headerAvatar.style.display =
          "none";

      }

    }


    /* =====================================================
       CHAT
    ===================================================== */

    function setupChat() {

      chatId =
        [currentUser.uid, targetUser.id]
          .sort()
          .join("_");


      if (unsubscribeMessages) {

        unsubscribeMessages();

      }


      const messagesQuery =
        query(

          collection(db, "messages"),

          where(
            "chatId",
            "==",
            chatId
          ),

          orderBy(
            "createdAt",
            "asc"
          )

        );


      unsubscribeMessages =
        onSnapshot(
          messagesQuery,
          (snapshot) => {

            messagesBox.innerHTML = "";


            if (snapshot.empty) {

              messagesBox.innerHTML = `
                <div class="empty">
                  Start your conversation.
                </div>
              `;

              return;
            }


            snapshot.forEach(
              (messageDoc) => {

                const data =
                  messageDoc.data();


                const bubble =
                  document.createElement("div");


                bubble.className =
                  "message " +
                  (
                    data.senderId ===
                    currentUser.uid
                      ? "mine"
                      : "theirs"
                  );


                const text =
                  document.createElement("div");

                text.textContent =
                  data.message || "";


                const time =
                  document.createElement("span");

                time.className =
                  "message-time";


                if (
                  data.createdAt &&
                  data.createdAt.toDate
                ) {

                  time.textContent =
                    data.createdAt
                      .toDate()
                      .toLocaleTimeString(
                        [],
                        {
                          hour: "2-digit",
                          minute: "2-digit"
                        }
                      );

                }


                bubble.appendChild(text);

                bubble.appendChild(time);

                messagesBox.appendChild(bubble);

              }
            );


            messagesBox.scrollTop =
              messagesBox.scrollHeight;

          },

          (error) => {

            console.error(
              "Message listener error:",
              error
            );

            showToast(
              "Unable to load messages."
            );

          }

        );

    }


    /* =====================================================
       SEND MESSAGE
    ===================================================== */

    messageForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const text =
          messageInput.value.trim();


        if (!text) return;


        if (!currentUser || !targetUser) {

          showToast(
            "Chat is not ready."
          );

          return;
        }


        messageInput.disabled = true;


        try {

          await addDoc(
            collection(db, "messages"),
            {

              chatId,

              senderId:
                currentUser.uid,

              receiverId:
                targetUser.id,

              message:
                text,

              createdAt:
                serverTimestamp()

            }
          );


          messageInput.value = "";

        }
        catch (error) {

          console.error(
            "Send message error:",
            error
          );

          showToast(
            "Message could not be sent."
          );

        }
        finally {

          messageInput.disabled =
            false;

          messageInput.focus();

        }

      }
    );


    /* =====================================================
       START CALL
    ===================================================== */

    async function startCall(type) {

      if (!currentUser || !targetUser) {

        showToast(
          "Chat is not ready."
        );

        return;
      }


      try {

        currentCallType =
          type;

        isCaller =
          true;


        const constraints =
          type === "video"

            ? {
                audio: true,
                video: true
              }

            : {
                audio: true,
                video: false
              };


        localStream =
          await navigator.mediaDevices
            .getUserMedia(
              constraints
            );


        localVideo.srcObject =
          localStream;


        peerConnection =
          createPeerConnection();


        localStream
          .getTracks()
          .forEach(
            track => {

              peerConnection.addTrack(
                track,
                localStream
              );

            }
          );


        const callRef =
          await addDoc(
            collection(db, "calls"),
            {

              callerId:
                currentUser.uid,

              receiverId:
                targetUser.id,

              callerName:
                currentUser.displayName ||
                localStorage.getItem(
                  "userName"
                ) ||
                "Talent Exchange User",

              callType:
                type,

              status:
                "ringing",

              offer:
                null,

              answer:
                null,

              createdAt:
                serverTimestamp()

            }
          );


        currentCallId =
          callRef.id;


        const offer =
          await peerConnection
            .createOffer();


        await peerConnection
          .setLocalDescription(
            offer
          );


        await updateDoc(
          doc(
            db,
            "calls",
            currentCallId
          ),
          {

            offer: {

              type:
                offer.type,

              sdp:
                offer.sdp

            }

          }
        );


        showCallWindow(
          type,
          "Calling " +
          (
            targetUser.name ||
            "user"
          )
        );


        listenToCurrentCall();

      }
      catch (error) {

        console.error(
          "Start call error:",
          error
        );

        cleanupCall();

        showToast(
          "Camera/microphone permission is required."
        );

      }

    }


    /* =====================================================
       CREATE PEER CONNECTION
    ===================================================== */

    function createPeerConnection() {

      const pc =
        new RTCPeerConnection(
          rtcConfig
        );


      pc.onicecandidate =
        async (event) => {

          if (
            event.candidate &&
            currentCallId
          ) {

            try {

              await addDoc(

                collection(
                  db,
                  "calls",
                  currentCallId,
                  "callerCandidates"
                ),

                event.candidate.toJSON()

              );

            }
            catch (error) {

              console.error(
                "ICE error:",
                error
              );

            }

          }

        };


      pc.ontrack =
        (event) => {

          if (
            event.streams &&
            event.streams[0]
          ) {

            remoteVideo.srcObject =
              event.streams[0];

          }

        };


      pc.onconnectionstatechange =
        () => {

          console.log(
            "Connection:",
            pc.connectionState
          );


          if (
            pc.connectionState ===
            "connected"
          ) {

            callTitle.textContent =
              "Connected";

          }


          if (
            pc.connectionState ===
            "failed" ||
            pc.connectionState ===
            "disconnected"
          ) {

            showToast(
              "Call connection lost."
            );

          }

        };


      return pc;

    }


    /* =====================================================
       LISTEN TO CALL
    ===================================================== */

    function listenToCurrentCall() {

      if (unsubscribeCalls) {

        unsubscribeCalls();

      }


      const callQuery =
        query(

          collection(db, "calls"),

          where(
            "__name__",
            "==",
            currentCallId
          )

        );


      unsubscribeCalls =
        onSnapshot(
          callQuery,
          async (snapshot) => {

            if (snapshot.empty)
              return;


            const call =
              snapshot.docs[0].data();


            if (
              isCaller &&
              call.answer &&
              peerConnection &&
              !peerConnection.currentRemoteDescription
            ) {

              try {

                await peerConnection
                  .setRemoteDescription(
                    new RTCSessionDescription(
                      call.answer
                    )
                  );

                callTitle.textContent =
                  "Connected";

              }
              catch (error) {

                console.error(
                  "Remote answer error:",
                  error
                );

              }

            }

          }

        );

    }


    /* =====================================================
       INCOMING CALL LISTENER
    ===================================================== */

    function setupIncomingCalls() {

      if (unsubscribeCalls) {

        unsubscribeCalls();

      }


      const incomingQuery =
        query(

          collection(db, "calls"),

          where(
            "receiverId",
            "==",
            currentUser.uid
          ),

          where(
            "status",
            "==",
            "ringing"
          )

        );


      unsubscribeCalls =
        onSnapshot(
          incomingQuery,
          (snapshot) => {

            if (snapshot.empty) {

              incomingCard
                .classList
                .remove("show");

              return;
            }


            const latest =
              snapshot.docs[
                snapshot.docs.length - 1
              ];


            incomingCallData = {

              id:
                latest.id,

              ...latest.data()

            };


            incomingTitle.textContent =
              incomingCallData.callType ===
              "video"
                ? "Incoming Video Call"
                : "Incoming Audio Call";


            incomingText.textContent =
              (
                incomingCallData.callerName ||
                "Someone"
              ) +
              " is calling you";


            incomingCard
              .classList
              .add("show");

          },

          (error) => {

            console.error(
              "Incoming call listener:",
              error
            );

          }

        );

    }


    /* =====================================================
       ACCEPT CALL
    ===================================================== */

    async function acceptCall() {

      if (!incomingCallData)
        return;


      const call =
        incomingCallData;


      incomingCard
        .classList
        .remove("show");


      try {

        currentCallId =
          call.id;

        currentCallType =
          call.callType;

        isCaller =
          false;


        const constraints =
          call.callType === "video"

            ? {
                audio: true,
                video: true
              }

            : {
                audio: true,
                video: false
              };


        localStream =
          await navigator.mediaDevices
            .getUserMedia(
              constraints
            );


        localVideo.srcObject =
          localStream;


        peerConnection =
          createPeerConnection();


        localStream
          .getTracks()
          .forEach(
            track => {

              peerConnection.addTrack(
                track,
                localStream
              );

            }
          );


        if (!call.offer) {

          throw new Error(
            "Call offer missing."
          );

        }


        await peerConnection
          .setRemoteDescription(
            new RTCSessionDescription(
              call.offer
            )
          );


        const answer =
          await peerConnection
            .createAnswer();


        await peerConnection
          .setLocalDescription(
            answer
          );


        await updateDoc(
          doc(
            db,
            "calls",
            currentCallId
          ),
          {

            answer: {

              type:
                answer.type,

              sdp:
                answer.sdp

            },

            status:
              "accepted"

          }
        );


        showCallWindow(
          call.callType,
          "Connected"
        );


      }
      catch (error) {

        console.error(
          "Accept call error:",
          error
        );

        await rejectCall();

        showToast(
          "Unable to accept call."
        );

      }

    }


    /* =====================================================
       REJECT CALL
    ===================================================== */

    async function rejectCall() {

      if (!incomingCallData)
        return;


      try {

        await updateDoc(
          doc(
            db,
            "calls",
            incomingCallData.id
          ),
          {

            status:
              "rejected"

          }
        );

      }
      catch (error) {

        console.error(error);

      }


      incomingCallData =
        null;


      incomingCard
        .classList
        .remove("show");

    }


    /* =====================================================
       CALL WINDOW
    ===================================================== */

    function showCallWindow(
      type,
      title
    ) {

      callOverlay
        .classList
        .add("show");


      callTitle.textContent =
        title;


      if (type === "audio") {

        remoteVideo.style.display =
          "none";

        localVideo.style.display =
          "none";

      }
      else {

        remoteVideo.style.display =
          "block";

        localVideo.style.display =
          "block";

      }

    }


    /* =====================================================
       END CALL
    ===================================================== */

    async function endCall() {

      try {

        if (currentCallId) {

          await updateDoc(
            doc(
              db,
              "calls",
              currentCallId
            ),
            {

              status:
                "ended"

            }
          );

        }

      }
      catch (error) {

        console.error(
          error
        );

      }


      cleanupCall();

    }


    /* =====================================================
       CLEANUP
    ===================================================== */

    function cleanupCall() {

      if (localStream) {

        localStream
          .getTracks()
          .forEach(
            track => track.stop()
          );

        localStream =
          null;

      }


      if (peerConnection) {

        peerConnection.close();

        peerConnection =
          null;

      }


      localVideo.srcObject =
        null;

      remoteVideo.srcObject =
        null;


      callOverlay
        .classList
        .remove("show");


      currentCallId =
        null;

      currentCallType =
        null;

      isCaller =
        false;

    }


    /* =====================================================
       MUTE
    ===================================================== */

    document
      .getElementById("muteBtn")
      .addEventListener(
        "click",
        () => {

          if (!localStream)
            return;


          const audioTracks =
            localStream.getAudioTracks();


          audioTracks.forEach(
            track => {

              track.enabled =
                !track.enabled;

            }
          );


          const enabled =
            audioTracks.some(
              track => track.enabled
            );


          document
            .getElementById("muteBtn")
            .textContent =
              enabled
                ? "🎤"
                : "🔇";

        }
      );


    /* =====================================================
       CAMERA TOGGLE
    ===================================================== */

    document
      .getElementById("cameraBtn")
      .addEventListener(
        "click",
        () => {

          if (!localStream)
            return;


          const videoTracks =
            localStream.getVideoTracks();


          if (!videoTracks.length)
            return;


          videoTracks.forEach(
            track => {

              track.enabled =
                !track.enabled;

            }
          );


          const enabled =
            videoTracks.some(
              track => track.enabled
            );


          document
            .getElementById("cameraBtn")
            .textContent =
              enabled
                ? "▣"
                : "▢";

        }
      );


    /* =====================================================
       BUTTONS
    ===================================================== */

    document
      .getElementById("audioCallBtn")
      .addEventListener(
        "click",
        () => startCall("audio")
      );


    document
      .getElementById("videoCallBtn")
      .addEventListener(
        "click",
        () => startCall("video")
      );


    document
      .getElementById("acceptCallBtn")
      .addEventListener(
        "click",
        acceptCall
      );


    document
      .getElementById("rejectCallBtn")
      .addEventListener(
        "click",
        rejectCall
      );


    document
      .getElementById("endCallBtn")
      .addEventListener(
        "click",
        endCall
      );


    /* =====================================================
       CLEANUP ON PAGE CLOSE
    ===================================================== */

    window.addEventListener(
      "beforeunload",
      () => {

        if (localStream) {

          localStream
            .getTracks()
            .forEach(
              track => track.stop()
            );

        }

      }
    );

  </script>

</body>
