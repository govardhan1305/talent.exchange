<script type="module">

import {
  auth,
  db
} from "./js/firebase-config.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  doc,
  getDoc,
  addDoc,
  setDoc,
  collection,
  query,
  where,
  orderBy,
  onSnapshot,
  serverTimestamp,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* ================================
   ELEMENTS
================================ */

const messagesBox =
  document.getElementById("messages");

const messageForm =
  document.getElementById("messageForm");

const messageInput =
  document.getElementById("messageInput");

const sideName =
  document.getElementById("sideName");

const sideSkill =
  document.getElementById("sideSkill");

const sideAvatar =
  document.getElementById("sideAvatar");

const headerName =
  document.getElementById("headerName");

const headerAvatar =
  document.getElementById("headerAvatar");

const callOverlay =
  document.getElementById("callOverlay");

const callTitle =
  document.getElementById("callTitle");

const localVideo =
  document.getElementById("localVideo");

const remoteVideo =
  document.getElementById("remoteVideo");

const incomingCard =
  document.getElementById("incomingCard");

const incomingTitle =
  document.getElementById("incomingTitle");

const incomingText =
  document.getElementById("incomingText");


/* ================================
   STATE
================================ */

let currentUser = null;
let targetUser = null;

let chatId = null;

let unsubscribeMessages = null;
let unsubscribeIncomingCalls = null;
let unsubscribeCurrentCall = null;

let unsubscribeCallerCandidates = null;
let unsubscribeReceiverCandidates = null;

let localStream = null;
let peerConnection = null;

let currentCallId = null;
let currentCallType = null;

let incomingCallData = null;

let isCaller = false;


/* ================================
   WEBRTC
================================ */

const rtcConfig = {

  iceServers: [

    {
      urls: "stun:stun.l.google.com:19302"
    },

    {
      urls: "stun:stun1.l.google.com:19302"
    }

  ]

};


/* ================================
   TOAST
================================ */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent =
    message;

  toast.classList.add("show");

  setTimeout(() => {

    toast.classList.remove("show");

  },3000);

}


/* ================================
   TARGET USER
================================ */

function getTargetId(){

  return (
    localStorage.getItem("activeChatId") ||
    localStorage.getItem("activeChatUserId")
  );

}


/* ================================
   AUTH
================================ */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      window.location.href =
        "login.html";

      return;

    }

    currentUser =
      user;

    const targetId =
      getTargetId();

    if(!targetId){

      showToast(
        "No connection selected."
      );

      setTimeout(() => {

        window.location.href =
          "connections.html";

      },1200);

      return;

    }

    try{

      const targetSnap =
        await getDoc(
          doc(
            db,
            "users",
            targetId
          )
        );


      if(!targetSnap.exists()){

        showToast(
          "Connection profile not found."
        );

        return;

      }


      targetUser = {

        id:
          targetSnap.id,

        ...targetSnap.data()

      };


      setupUserUI();

      setupChat();

      setupIncomingCalls();

    }
    catch(error){

      console.error(error);

      showToast(
        "Unable to load chat."
      );

    }

  }
);


/* ================================
   USER UI
================================ */

function setupUserUI(){

  const name =
    targetUser.name ||
    targetUser.email ||
    "Connection";


  const skills =
    targetUser.offeredSkills ||
    targetUser.skill ||
    [];


  const skillText =
    Array.isArray(skills)
      ? skills.join(", ")
      : skills || "Talent Exchange";


  sideName.textContent =
    name;

  headerName.textContent =
    name;

  sideSkill.textContent =
    skillText;


  if(targetUser.profilePhoto){

    sideAvatar.src =
      targetUser.profilePhoto;

    headerAvatar.src =
      targetUser.profilePhoto;

  }
  else{

    sideAvatar.style.display =
      "none";

    headerAvatar.style.display =
      "none";

  }

}


/* ================================
   CHAT
================================ */

function setupChat(){

  chatId =
    [
      currentUser.uid,
      targetUser.id
    ]
    .sort()
    .join("_");


  if(unsubscribeMessages)
    unsubscribeMessages();


  const messagesQuery =
    query(

      collection(
        db,
        "messages"
      ),

      where(
        "chatId",
        "==",
        chatId
      ),

      orderBy(
        "createdAt",
        "asc"
      )

    );


  unsubscribeMessages =
    onSnapshot(
      messagesQuery,

      snapshot => {

        messagesBox.innerHTML =
          "";


        if(snapshot.empty){

          messagesBox.innerHTML = `
            <div class="empty">
              Start your conversation.
            </div>
          `;

          return;

        }


        snapshot.forEach(
          messageDoc => {

            const data =
              messageDoc.data();


            const bubble =
              document.createElement(
                "div"
              );


            bubble.className =
              "message " +
              (
                data.senderId ===
                currentUser.uid
                  ? "mine"
                  : "theirs"
              );


            const text =
              document.createElement(
                "div"
              );


            text.textContent =
              data.message || "";


            const time =
              document.createElement(
                "span"
              );


            time.className =
              "message-time";


            if(
              data.createdAt &&
              data.createdAt.toDate
            ){

              time.textContent =
                data.createdAt
                  .toDate()
                  .toLocaleTimeString(
                    [],
                    {
                      hour:"2-digit",
                      minute:"2-digit"
                    }
                  );

            }


            bubble.appendChild(
              text
            );

            bubble.appendChild(
              time
            );

            messagesBox.appendChild(
              bubble
            );

          }
        );


        messagesBox.scrollTop =
          messagesBox.scrollHeight;

      },

      error => {

        console.error(
          "Message listener:",
          error
        );

        showToast(
          "Unable to load messages."
        );

      }

    );

}


/* ================================
   SEND MESSAGE
================================ */

messageForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const text =
      messageInput.value.trim();

    if(!text)
      return;

    if(!currentUser || !targetUser){

      showToast(
        "Chat is not ready."
      );

      return;

    }


    messageInput.disabled =
      true;


    try{

      await addDoc(
        collection(
          db,
          "messages"
        ),
        {

          chatId,

          senderId:
            currentUser.uid,

          receiverId:
            targetUser.id,

          message:
            text,

          createdAt:
            serverTimestamp()

        }
      );


      messageInput.value =
        "";

    }
    catch(error){

      console.error(
        "Send message:",
        error
      );

      showToast(
        "Message could not be sent."
      );

    }
    finally{

      messageInput.disabled =
        false;

      messageInput.focus();

    }

  }
);


/* ================================
   CREATE PEER CONNECTION
================================ */

function createPeerConnection(){

  const pc =
    new RTCPeerConnection(
      rtcConfig
    );


  pc.ontrack =
    event => {

      if(
        event.streams &&
        event.streams[0]
      ){

        remoteVideo.srcObject =
          event.streams[0];

      }

    };


  pc.onconnectionstatechange =
    () => {

      console.log(
        "WebRTC:",
        pc.connectionState
      );


      if(
        pc.connectionState ===
        "connected"
      ){

        callTitle.textContent =
          "Connected";

      }

    };


  return pc;

}


/* ================================
   START CALL
================================ */

async function startCall(type){

  if(!currentUser || !targetUser)
    return;


  try{

    currentCallType =
      type;

    isCaller =
      true;


    const constraints =
      type === "video"

        ? {
            audio:true,
            video:true
          }

        : {
            audio:true,
            video:false
          };


    localStream =
      await navigator.mediaDevices
        .getUserMedia(
          constraints
        );


    localVideo.srcObject =
      localStream;


    peerConnection =
      createPeerConnection();


    localStream
      .getTracks()
      .forEach(track => {

        peerConnection.addTrack(
          track,
          localStream
        );

      });


    const callRef =
      await addDoc(
        collection(
          db,
          "calls"
        ),
        {

          callerId:
            currentUser.uid,

          receiverId:
            targetUser.id,

          callerName:
            currentUser.displayName ||
            localStorage.getItem(
              "userName"
            ) ||
            currentUser.email ||
            "Talent Exchange User",

          callType:
            type,

          status:
            "ringing",

          offer:
            null,

          answer:
            null,

          createdAt:
            serverTimestamp()

        }
      );


    currentCallId =
      callRef.id;


    /* CALLER ICE */

    unsubscribeCallerCandidates =
      peerConnection.onicecandidate =
      event => {

        if(
          event.candidate &&
          currentCallId
        ){

          addDoc(

            collection(
              db,
              "calls",
              currentCallId,
              "callerCandidates"
            ),

            event.candidate.toJSON()

          ).catch(
            console.error
          );

        }

      };


    const offer =
      await peerConnection
        .createOffer();


    await peerConnection
      .setLocalDescription(
        offer
      );


    await updateDoc(
      doc(
        db,
        "calls",
        currentCallId
      ),
      {

        offer:{
          type:
            offer.type,

          sdp:
            offer.sdp
        }

      }
    );


    showCallWindow(
      type,
      "Calling " +
      (
        targetUser.name ||
        "user"
      )
    );


    listenToCurrentCall();

  }
  catch(error){

    console.error(
      "Start call:",
      error
    );

    cleanupCall();

    showToast(
      "Camera or microphone permission is required."
    );

  }

}


/* ================================
   CURRENT CALL LISTENER
================================ */

function listenToCurrentCall(){

  if(unsubscribeCurrentCall)
    unsubscribeCurrentCall();


  const callRef =
    doc(
      db,
      "calls",
      currentCallId
    );


  unsubscribeCurrentCall =
    onSnapshot(
      callRef,

      async snapshot => {

        if(!snapshot.exists())
          return;


        const call =
          snapshot.data();


        /* CALLER RECEIVES ANSWER */

        if(
          isCaller &&
          call.answer &&
          peerConnection &&
          !peerConnection.currentRemoteDescription
        ){

          try{

            await peerConnection
              .setRemoteDescription(
                new RTCSessionDescription(
                  call.answer
                )
              );


            listenToReceiverCandidates();

          }
          catch(error){

            console.error(
              "Answer error:",
              error
            );

          }

        }


        if(
          call.status ===
          "rejected"
        ){

          showToast(
            "Call rejected."
          );

          cleanupCall();

        }


        if(
          call.status ===
          "ended"
        ){

          cleanupCall();

        }

      }

    );

}


/* ================================
   RECEIVER CALL LISTENER
================================ */

function setupIncomingCalls(){

  if(unsubscribeIncomingCalls)
    unsubscribeIncomingCalls();


  const incomingQuery =
    query(

      collection(
        db,
        "calls"
      ),

      where(
        "receiverId",
        "==",
        currentUser.uid
      ),

      where(
        "status",
        "==",
        "ringing"
      )

    );


  unsubscribeIncomingCalls =
    onSnapshot(
      incomingQuery,

      snapshot => {

        if(snapshot.empty){

          incomingCard
            .classList
            .remove("show");

          return;

        }


        const latest =
          snapshot.docs[
            snapshot.docs.length - 1
          ];


        incomingCallData = {

          id:
            latest.id,

          ...latest.data()

        };


        incomingTitle.textContent =
          incomingCallData.callType ===
          "video"
            ? "Incoming Video Call"
            : "Incoming Audio Call";


        incomingText.textContent =
          (
            incomingCallData.callerName ||
            "Someone"
          ) +
          " is calling you";


        incomingCard
          .classList
          .add("show");

      },

      error => {

        console.error(
          "Incoming calls:",
          error
        );

      }

    );

}


/* ================================
   ACCEPT CALL
================================ */

async function acceptCall(){

  if(!incomingCallData)
    return;


  const call =
    incomingCallData;


  incomingCard
    .classList
    .remove("show");


  try{

    currentCallId =
      call.id;

    currentCallType =
      call.callType;

    isCaller =
      false;


    const constraints =
      call.callType === "video"

        ? {
            audio:true,
            video:true
          }

        : {
            audio:true,
            video:false
          };


    localStream =
      await navigator.mediaDevices
        .getUserMedia(
          constraints
        );


    localVideo.srcObject =
      localStream;


    peerConnection =
      createPeerConnection();


    localStream
      .getTracks()
      .forEach(track => {

        peerConnection.addTrack(
          track,
          localStream
        );

      });


    /* RECEIVER ICE */

    peerConnection.onicecandidate =
      event => {

        if(
          event.candidate &&
          currentCallId
        ){

          addDoc(

            collection(
              db,
              "calls",
              currentCallId,
              "receiverCandidates"
            ),

            event.candidate.toJSON()

          ).catch(
            console.error
          );

        }

      };


    if(!call.offer){

      throw new Error(
        "Call offer missing."
      );

    }


    await peerConnection
      .setRemoteDescription(
        new RTCSessionDescription(
          call.offer
        )
      );


    listenToCallerCandidates();


    const answer =
      await peerConnection
        .createAnswer();


    await peerConnection
      .setLocalDescription(
        answer
      );


    await updateDoc(
      doc(
        db,
        "calls",
        currentCallId
      ),
      {

        answer:{
          type:
            answer.type,

          sdp:
            answer.sdp
        },

        status:
          "accepted"

      }
    );


    showCallWindow(
      call.callType,
      "Connected"
    );

  }
  catch(error){

    console.error(
      "Accept call:",
      error
    );

    cleanupCall();

    showToast(
      "Unable to accept call."
    );

  }

}


/* ================================
   LISTEN CALLER ICE
================================ */

function listenToCallerCandidates(){

  if(unsubscribeCallerCandidates)
    unsubscribeCallerCandidates();


  const candidatesQuery =
    query(

      collection(
        db,
        "calls",
        currentCallId,
        "callerCandidates"
      )

    );


  unsubscribeCallerCandidates =
    onSnapshot(
      candidatesQuery,

      snapshot => {

        snapshot.docChanges()
          .forEach(
            async change => {

              if(
                change.type !==
                "added"
              )
                return;


              try{

                await peerConnection
                  .addIceCandidate(
                    new RTCIceCandidate(
                      change.doc.data()
                    )
                  );

              }
              catch(error){

                console.error(
                  "Caller ICE:",
                  error
                );

              }

            }
          );

      }

    );

}


/* ================================
   LISTEN RECEIVER ICE
================================ */

function listenToReceiverCandidates(){

  if(unsubscribeReceiverCandidates)
    unsubscribeReceiverCandidates();


  const candidatesQuery =
    query(

      collection(
        db,
        "calls",
        currentCallId,
        "receiverCandidates"
      )

    );


  unsubscribeReceiverCandidates =
    onSnapshot(
      candidatesQuery,

      snapshot => {

        snapshot.docChanges()
          .forEach(
            async change => {

              if(
                change.type !==
                "added"
              )
                return;


              try{

                await peerConnection
                  .addIceCandidate(
                    new RTCIceCandidate(
                      change.doc.data()
                    )
                  );

              }
              catch(error){

                console.error(
                  "Receiver ICE:",
                  error
                );

              }

            }
          );

      }

    );

}


/* ================================
   REJECT CALL
================================ */

async function rejectCall(){

  if(!incomingCallData)
    return;


  try{

    await updateDoc(
      doc(
        db,
        "calls",
        incomingCallData.id
      ),
      {
        status:"rejected"
      }
    );

  }
  catch(error){

    console.error(error);

  }


  incomingCallData =
    null;

  incomingCard
    .classList
    .remove("show");

}


/* ================================
   SHOW CALL
================================ */

function showCallWindow(
  type,
  title
){

  callOverlay
    .classList
    .add("show");


  callTitle.textContent =
    title;


  if(type === "audio"){

    remoteVideo.style.display =
      "none";

    localVideo.style.display =
      "none";

  }
  else{

    remoteVideo.style.display =
      "block";

    localVideo.style.display =
      "block";

  }

}


/* ================================
   END CALL
================================ */

async function endCall(){

  try{

    if(currentCallId){

      await updateDoc(
        doc(
          db,
          "calls",
          currentCallId
        ),
        {
          status:"ended"
        }
      );

    }

  }
  catch(error){

    console.error(error);

  }


  cleanupCall();

}


/* ================================
   CLEANUP
================================ */

function cleanupCall(){

  if(unsubscribeCurrentCall){

    unsubscribeCurrentCall();

    unsubscribeCurrentCall =
      null;

  }


  if(unsubscribeCallerCandidates){

    unsubscribeCallerCandidates();

    unsubscribeCallerCandidates =
      null;

  }


  if(unsubscribeReceiverCandidates){

    unsubscribeReceiverCandidates();

    unsubscribeReceiverCandidates =
      null;

  }


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    localStream =
      null;

  }


  if(peerConnection){

    peerConnection.close();

    peerConnection =
      null;

  }


  localVideo.srcObject =
    null;

  remoteVideo.srcObject =
    null;


  callOverlay
    .classList
    .remove("show");


  currentCallId =
    null;

  currentCallType =
    null;

  isCaller =
    false;

}
