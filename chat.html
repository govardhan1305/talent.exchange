<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talent Exchange — Chat</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  font-family:Inter,Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 15% 10%,rgba(125,75,255,.18),transparent 35%),
    radial-gradient(circle at 85% 90%,rgba(45,80,255,.15),transparent 35%),
    #050509;
}

.app{
  width:min(1200px,94%);
  height:92vh;
  margin:4vh auto;
  display:flex;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.1);
  border-radius:24px;
  background:rgba(15,15,23,.78);
  backdrop-filter:blur(25px);
  box-shadow:0 30px 100px rgba(0,0,0,.55);
}

.sidebar{
  width:280px;
  padding:25px;
  border-right:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.025);
}

.brand{
  font-size:22px;
  font-weight:800;
  margin-bottom:30px;
}

.brand span{color:#9b6cff}

.connection-info{
  padding:20px;
  border-radius:18px;
  background:linear-gradient(145deg,rgba(140,90,255,.15),rgba(255,255,255,.025));
  border:1px solid rgba(160,120,255,.18);
}

.avatar{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
  margin-bottom:15px;
  background:#181820;
  border:2px solid #8d62ff;
}

.connection-name{
  font-size:18px;
  font-weight:700;
}

.connection-skill{
  margin-top:6px;
  color:#aaa;
  font-size:13px;
}

.chat-area{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.chat-header{
  height:82px;
  padding:0 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.header-user{
  display:flex;
  align-items:center;
  gap:13px;
}

.small-avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  background:#181820;
}

.header-name{font-weight:700}

.header-status{
  margin-top:3px;
  color:#8e8e9d;
  font-size:12px;
}

.call-buttons{
  display:flex;
  gap:10px;
}

button{
  border:0;
  cursor:pointer;
  color:#fff;
  font-weight:700;
}

.call-btn{
  width:45px;
  height:45px;
  border-radius:14px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  transition:.25s;
  font-size:17px;
}

.call-btn:hover{
  transform:translateY(-3px);
  background:rgba(130,85,255,.25);
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:28px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.message{
  max-width:min(65%,520px);
  padding:12px 16px;
  border-radius:17px;
  line-height:1.45;
  font-size:14px;
  word-break:break-word;
}

.message.mine{
  align-self:flex-end;
  background:linear-gradient(135deg,#7446df,#5431aa);
  border-bottom-right-radius:5px;
}

.message.theirs{
  align-self:flex-start;
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.07);
  border-bottom-left-radius:5px;
}

.message-time{
  display:block;
  margin-top:5px;
  font-size:10px;
  opacity:.6;
}

.empty{
  margin:auto;
  text-align:center;
  color:#777;
}

.input-area{
  display:flex;
  gap:10px;
  padding:18px;
  border-top:1px solid rgba(255,255,255,.08);
}

.input-area input{
  flex:1;
  height:50px;
  padding:0 18px;
  color:#fff;
  outline:none;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);
}

.send-btn{
  padding:0 25px;
  border-radius:15px;
  background:linear-gradient(135deg,#8958ff,#5834c7);
}

.call-overlay{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.84);
  backdrop-filter:blur(15px);
}

.call-overlay.show{display:flex}

.call-window{
  width:min(900px,92%);
  padding:20px;
  border-radius:25px;
  background:#0d0d14;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 40px 100px rgba(0,0,0,.7);
}

.call-title{
  text-align:center;
  margin-bottom:15px;
  font-size:18px;
  font-weight:700;
}

.video-area{
  height:410px;
  position:relative;
  overflow:hidden;
  border-radius:20px;
  background:#030305;
}

#remoteVideo{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#030305;
}

#localVideo{
  position:absolute;
  right:18px;
  bottom:18px;
  width:190px;
  height:130px;
  object-fit:cover;
  border-radius:15px;
  border:2px solid rgba(255,255,255,.35);
  background:#111;
  z-index:3;
}

.call-controls{
  display:flex;
  justify-content:center;
  gap:14px;
  margin-top:18px;
}

.control{
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);
}

.control.end{background:#c7374a}

.incoming-card{
  position:fixed;
  top:25px;
  right:25px;
  z-index:2000;
  width:330px;
  display:none;
  padding:22px;
  border-radius:20px;
  background:rgba(20,20,30,.95);
  border:1px solid rgba(150,100,255,.35);
  box-shadow:0 20px 60px rgba(0,0,0,.55);
}

.incoming-card.show{display:block}

.incoming-card h3{margin-bottom:7px}

.incoming-card p{
  color:#999;
  font-size:13px;
}

.incoming-actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.accept,.reject{
  flex:1;
  padding:12px;
  border-radius:12px;
}

.accept{background:#3cbd72}
.reject{background:#b73446}

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  padding:13px 20px;
  border-radius:12px;
  background:rgba(20,20,28,.95);
  border:1px solid rgba(255,255,255,.1);
  display:none;
  z-index:3000;
}

.toast.show{display:block}

@media(max-width:760px){

  .app{
    width:100%;
    height:100vh;
    margin:0;
    border-radius:0;
  }

  .sidebar{display:none}

  .message{max-width:82%}

  .video-area{height:350px}

  #localVideo{
    width:130px;
    height:95px;
  }

  .incoming-card{
    left:15px;
    right:15px;
    width:auto;
  }
}

/* ====== ADVANCED 3D CHAT UPGRADE ====== */
.message-row{position:relative;display:flex;align-items:flex-end;gap:7px;max-width:min(78%,620px);animation:msgIn .22s ease}
.message-row.mine{align-self:flex-end;flex-direction:row-reverse}
.message-row.theirs{align-self:flex-start}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.message{position:relative;max-width:100%;padding:12px 15px;border-radius:18px;line-height:1.45;font-size:14px;word-break:break-word;box-shadow:0 10px 28px rgba(0,0,0,.18)}
.message.mine{background:linear-gradient(135deg,#7548e5,#5130aa);border:1px solid rgba(190,160,255,.18);border-bottom-right-radius:5px}
.message.theirs{background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.08);border-bottom-left-radius:5px}
.message.deleted{color:#9696a4;font-style:italic;background:rgba(255,255,255,.035)!important;border:1px dashed rgba(255,255,255,.10)!important}
.message-text{white-space:pre-wrap}
.message-meta{display:flex;justify-content:flex-end;align-items:center;gap:5px;margin-top:6px}
.message-time{font-size:10px;opacity:.58}
.edited-label{font-size:9px;opacity:.5}
.seen-label{font-size:10px;color:#cfc4ff}
.message-menu-trigger{width:28px;height:28px;border-radius:9px;opacity:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.07);transition:.2s;font-size:16px}
.message-row:hover .message-menu-trigger,.message-menu-trigger:focus{opacity:1}
.message-menu{position:absolute;z-index:30;min-width:180px;padding:7px;border-radius:15px;background:rgba(17,17,27,.97);border:1px solid rgba(255,255,255,.12);box-shadow:0 22px 55px rgba(0,0,0,.55);backdrop-filter:blur(20px)}
.message-row.mine .message-menu{right:0;top:calc(100% + 6px)}
.message-row.theirs .message-menu{left:0;top:calc(100% + 6px)}
.message-menu button{width:100%;padding:10px 11px;text-align:left;border-radius:10px;background:transparent;color:#eee;font-size:13px}
.message-menu button:hover{background:rgba(139,92,246,.14)}
.message-menu button.danger:hover{background:rgba(217,65,89,.14);color:#ff8b9b}
.attach-btn{width:50px;height:50px;flex:0 0 50px;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);font-size:19px}
.attach-btn:hover{background:rgba(139,92,246,.16)}
.input-wrap{position:relative;flex:1}
.char-count{position:absolute;right:13px;bottom:-18px;font-size:9px;color:#686875}
.edit-modal{position:fixed;inset:0;z-index:2500;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.72);backdrop-filter:blur(12px)}
.edit-modal.show{display:flex}
.edit-card{width:min(500px,95%);padding:22px;border-radius:22px;background:#11111a;border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 90px rgba(0,0,0,.7)}
.edit-card h3{margin-bottom:15px}
#editInput{width:100%;min-height:110px;resize:vertical;padding:13px;border-radius:13px;outline:none;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.05);color:#fff}
.edit-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:15px}
.edit-actions button{padding:10px 16px;border-radius:11px;background:rgba(255,255,255,.07)}
.edit-actions .save{background:linear-gradient(135deg,#8958ff,#5834c7)}
@media(max-width:760px){
  .message-row{max-width:88%}
  .message-menu-trigger{opacity:1}
  .attach-btn{width:45px;height:45px;flex-basis:45px}
  .input-wrap input{padding-right:50px}
}

</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="brand">
      Talent <span>Exchange</span>
    </div>

    <div class="connection-info">

      <img id="sideAvatar" class="avatar" alt="Profile">

      <div id="sideName" class="connection-name">
        Loading...
      </div>

      <div id="sideSkill" class="connection-skill">
        Connection
      </div>

    </div>

  </aside>


  <main class="chat-area">

    <header class="chat-header">

      <div class="header-user">

        <img id="headerAvatar" class="small-avatar" alt="Profile">

        <div>
          <div id="headerName" class="header-name">

          <div class="header-status">

          </div>
        </div>

      <div class="call-buttons">

        <button

          class="call-btn"

          class="call-btn"

</div>


<!-- INCOMING CALL -->

<div id="incomingCard" class="incoming-card">

  <h3 id="incomingTitle">
    Incoming Call
  </h3>

  <p id="incomingText">
    Someone is calling you.
  </p>

  <div class="incoming-actions">

    <button id="acceptCallBtn" class="accept">
      Accept
    </button>

    <button id="rejectCallBtn" class="reject">
      Reject
    </button>

  </div>

</div>


<!-- CALL WINDOW -->

<div id="callOverlay" class="call-overlay">

  <div class="call-window">

    <div id="callTitle" class="call-title">
      Connecting...
    </div>

    <div class="video-area">

      <video
        id="remoteVideo"
        autoplay
        playsinline>
      </video>

      <video
        id="localVideo"
        autoplay
        muted
        playsinline>
      </video>

    </div>

    <div class="call-controls">

      <button id="muteBtn" class="control" title="Mute">
        🎤
      </button>

      <button id="cameraBtn" class="control" title="Camera">
        ▣
      </button>

      <button id="endCallBtn" class="control end" title="End Call">
        ✕
      </button>

    </div>

  </div>

</div>


<div id="editModal" class="edit-modal">
  <div class="edit-card">
    <h3>Edit message</h3>
    <textarea id="editInput" maxlength="2000"></textarea>
    <div class="edit-actions">
      <button type="button" id="cancelEditBtn">Cancel</button>
      <button type="button" id="saveEditBtn" class="save">Save changes</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>


<script type="module">

import {
  auth,
  db
} from "./js/firebase-config.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  doc,
  getDoc,
  addDoc,
  setDoc,
  collection,
  query,
  where,
  orderBy,
  onSnapshot,
  serverTimestamp,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* ================================
   ELEMENTS
================================ */

const messagesBox =
  document.getElementById("messages");

const messageForm =
  document.getElementById("messageForm");

const messageInput =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const charCount =
  document.getElementById("charCount");

const editModal =
  document.getElementById("editModal");

const editInput =
  document.getElementById("editInput");

let editingMessageId = null;

const sideName =
  document.getElementById("sideName");

const sideSkill =
  document.getElementById("sideSkill");

const sideAvatar =
  document.getElementById("sideAvatar");

const headerName =
  document.getElementById("headerName");

const headerAvatar =
  document.getElementById("headerAvatar");

const callOverlay =
  document.getElementById("callOverlay");

const callTitle =
  document.getElementById("callTitle");

const localVideo =
  document.getElementById("localVideo");

const remoteVideo =
  document.getElementById("remoteVideo");

const incomingCard =
  document.getElementById("incomingCard");

const incomingTitle =
  document.getElementById("incomingTitle");

const incomingText =
  document.getElementById("incomingText");


/* ================================
   STATE
================================ */

let currentUser = null;
let targetUser = null;

let chatId = null;

let unsubscribeMessages = null;
let unsubscribeIncomingCalls = null;
let unsubscribeCurrentCall = null;

let unsubscribeCallerCandidates = null;
let unsubscribeReceiverCandidates = null;

let localStream = null;
let peerConnection = null;

let currentCallId = null;
let currentCallType = null;

let incomingCallData = null;

let isCaller = false;


/* ================================
   WEBRTC
================================ */

const rtcConfig = {

  iceServers: [

    {
      urls: "stun:stun.l.google.com:19302"
    },

    {
      urls: "stun:stun1.l.google.com:19302"
    }

  ]

};


/* ================================
   TOAST
================================ */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent =
    message;

  toast.classList.add("show");

  setTimeout(() => {

    toast.classList.remove("show");

  },3000);

}


/* ================================
   TARGET USER
================================ */

function getTargetId(){

  return (
    localStorage.getItem("activeChatId") ||
    localStorage.getItem("activeChatUserId")
  );

}


/* ================================
   AUTH
================================ */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      window.location.href =
        "login.html";

      return;

    }

    currentUser =
      user;

    const targetId =
      getTargetId();

    if(!targetId){

      showToast(
        "No connection selected."
      );

      setTimeout(() => {

        window.location.href =
          "connections.html";

      },1200);

      return;

    }

    try{

      const targetSnap =
        await getDoc(
          doc(
            db,
            "users",
            targetId
          )
        );


      if(!targetSnap.exists()){

        showToast(
          "Connection profile not found."
        );

        return;

      }


      targetUser = {

        id:
          targetSnap.id,

        ...targetSnap.data()

      };


      setupUserUI();

      setupChat();

      setupIncomingCalls();

    }
    catch(error){

      console.error(error);

      showToast(
        "Unable to load chat."
      );

    }

  }
);


/* ================================
   USER UI
================================ */

function setupUserUI(){

  const name =
    targetUser.name ||
    targetUser.email ||
    "Connection";


  const skills =
    targetUser.offeredSkills ||
    targetUser.skill ||
    [];


  const skillText =
    Array.isArray(skills)
      ? skills.join(", ")
      : skills || "Talent Exchange";


  sideName.textContent =
    name;

  headerName.textContent =
    name;

  sideSkill.textContent =
    skillText;


  if(targetUser.profilePhoto){

    sideAvatar.src =
      targetUser.profilePhoto;

    headerAvatar.src =
      targetUser.profilePhoto;

  }
  else{

    sideAvatar.style.display =
      "none";

    headerAvatar.style.display =
      "none";

  }

}


/* ================================
   CHAT
================================ */

function setupChat(){

  chatId =
    [
      currentUser.uid,
      targetUser.id
    ]
    .sort()
    .join("_");

  if(unsubscribeMessages)
    unsubscribeMessages();

  const messagesQuery =
    query(
      collection(db,"messages"),
      where("chatId","==",chatId),
      orderBy("createdAt","asc")
    );

  unsubscribeMessages =
    onSnapshot(
      messagesQuery,

      snapshot => {

        messagesBox.innerHTML = "";

        if(snapshot.empty){

          messagesBox.innerHTML = `
            <div class="empty">
              <strong>Start your conversation.</strong>
              <span>Exchange knowledge, skills and ideas.</span>
            </div>
          `;

          return;
        }

        let visibleCount = 0;

        snapshot.forEach(messageDoc => {

          const data = messageDoc.data();

          /*
            Delete for me:
            hidden only for the current user.
          */
          if(
            data.deletedFor &&
            data.deletedFor[currentUser.uid] === true
          ){
            return;
          }

          const mine =
            data.senderId === currentUser.uid;

          const deleted =
            data.deletedForEveryone === true;

          const row =
            document.createElement("div");

          row.className =
            "message-row " +
            (mine ? "mine" : "theirs");

          const bubble =
            document.createElement("div");

          bubble.className =
            "message " +
            (mine ? "mine" : "theirs");

          if(deleted)
            bubble.classList.add("deleted");

          const text =
            document.createElement("div");

          text.className =
            "message-text";

          text.textContent =
            deleted
              ? "This message was deleted"
              : (data.message || "");

          bubble.appendChild(text);

          const meta =
            document.createElement("div");

          meta.className =
            "message-meta";

          const time =
            document.createElement("span");

          time.className =
            "message-time";

          if(
            data.createdAt &&
            data.createdAt.toDate
          ){
            time.textContent =
              data.createdAt
                .toDate()
                .toLocaleTimeString(
                  [],
                  {
                    hour:"2-digit",
                    minute:"2-digit"
                  }
                );
          }

          meta.appendChild(time);

          if(data.edited && !deleted){

            const edited =
              document.createElement("span");

            edited.className =
              "edited-label";

            edited.textContent =
              "edited";

            meta.appendChild(edited);

          }

          if(
            mine &&
            data.seen === true &&
            !deleted
          ){

            const seen =
              document.createElement("span");

            seen.className =
              "seen-label";

            seen.textContent =
              "✓✓";

            meta.appendChild(seen);

          }

          bubble.appendChild(meta);
          row.appendChild(bubble);

          /*
            Message options.
          */
          if(!deleted){

            const menuButton =
              document.createElement("button");

            menuButton.className =
              "message-menu-trigger";

            menuButton.textContent =
              "⋮";

            menuButton.title =
              "Message options";

            menuButton.addEventListener(
              "click",
              event => {

                event.stopPropagation();

                closeMessageMenus();

                const menu =
                  document.createElement("div");

                menu.className =
                  "message-menu";

                addMenuButton(
                  menu,
                  "Copy message",
                  async () => {

                    try{
                      await navigator.clipboard.writeText(
                        data.message || ""
                      );
                      showToast("Message copied.");
                    }
                    catch{
                      showToast("Unable to copy message.");
                    }

                    menu.remove();

                  }
                );

                if(mine){

                  addMenuButton(
                    menu,
                    "Edit message",
                    () => {

                      openEditModal(
                        messageDoc.id,
                        data.message || ""
                      );

                      menu.remove();

                    }
                  );

                }

                addMenuButton(
                  menu,
                  "Delete for me",
                  async () => {

                    await deleteForMe(
                      messageDoc.id
                    );

                    menu.remove();

                  }
                );

                if(mine){

                  addMenuButton(
                    menu,
                    "Delete for everyone",
                    async () => {

                      if(
                        !confirm(
                          "Delete this message for everyone?"
                        )
                      )
                        return;

                      await deleteForEveryone(
                        messageDoc.id
                      );

                      menu.remove();

                    },
                    true
                  );

                }

                row.appendChild(menu);

              }
            );

            row.appendChild(menuButton);

          }

          messagesBox.appendChild(row);
          visibleCount++;

          /*
            Seen status using the existing message document.
          */
          if(
            !mine &&
            data.seen !== true
          ){

            updateDoc(
              doc(
                db,
                "messages",
                messageDoc.id
              ),
              {
                seen:true
              }
            ).catch(error => {
              console.warn("Seen update:",error);
            });

          }

        });

        if(visibleCount === 0){

          messagesBox.innerHTML = `
            <div class="empty">
              <strong>No visible messages.</strong>
              <span>Deleted messages are hidden for you.</span>
            </div>
          `;

        }

        messagesBox.scrollTop =
          messagesBox.scrollHeight;

      },

      error => {

        console.error(
          "Message listener:",
          error
        );

        showToast(
          "Unable to load messages."
        );

      }
    );

}

function addMenuButton(

  label,
  action,

    label;

    button.classList.add("danger");

  );

}

          receiverId:targetUser.id,

          createdAt:serverTimestamp(),

      );

/* ================================
   CREATE PEER CONNECTION
================================ */

function createPeerConnection(){

  const pc =
    new RTCPeerConnection(
      rtcConfig
    );


  pc.ontrack =
    event => {

      if(
        event.streams &&
        event.streams[0]
      ){

        remoteVideo.srcObject =
          event.streams[0];

      }

    };


  pc.onconnectionstatechange =
    () => {

      console.log(
        "WebRTC:",
        pc.connectionState
      );


      if(
        pc.connectionState ===
        "connected"
      ){

        callTitle.textContent =
          "Connected";

      }

    };


  return pc;

}


/* ================================
   START CALL
================================ */

async function startCall(type){

  if(!currentUser || !targetUser)
    return;


  try{

    currentCallType =
      type;

    isCaller =
      true;


    const constraints =
      type === "video"

        ? {
            audio:true,
            video:true
          }

        : {
            audio:true,
            video:false
          };


    localStream =
      await navigator.mediaDevices
        .getUserMedia(
          constraints
        );


    localVideo.srcObject =
      localStream;


    peerConnection =
      createPeerConnection();


    localStream
      .getTracks()
      .forEach(track => {

        peerConnection.addTrack(
          track,
          localStream
        );

      });


    const callRef =
      await addDoc(
        collection(
          db,
          "calls"
        ),
        {

          callerId:
            currentUser.uid,

          receiverId:
            targetUser.id,

          callerName:
            currentUser.displayName ||
            localStorage.getItem(
              "userName"
            ) ||
            currentUser.email ||
            "Talent Exchange User",

          callType:
            type,

          status:
            "ringing",

          offer:
            null,

          answer:
            null,

          createdAt:
            serverTimestamp()

        }
      );


    currentCallId =
      callRef.id;


    /* CALLER ICE */

    unsubscribeCallerCandidates =
      peerConnection.onicecandidate =
      event => {

        if(
          event.candidate &&
          currentCallId
        ){

          addDoc(

            collection(
              db,
              "calls",
              currentCallId,
              "callerCandidates"
            ),

            event.candidate.toJSON()

          ).catch(
            console.error
          );

        }

      };


    const offer =
      await peerConnection
        .createOffer();


    await peerConnection
      .setLocalDescription(
        offer
      );


    await updateDoc(
      doc(
        db,
        "calls",
        currentCallId
      ),
      {

        offer:{
          type:
            offer.type,

          sdp:
            offer.sdp
        }

      }
    );


    showCallWindow(
      type,
      "Calling " +
      (
        targetUser.name ||
        "user"
      )
    );


    listenToCurrentCall();

  }
  catch(error){

    console.error(
      "Start call:",
      error
    );

    cleanupCall();

    showToast(
      "Camera or microphone permission is required."
    );

  }

}


/* ================================
   CURRENT CALL LISTENER
================================ */

function listenToCurrentCall(){

  if(unsubscribeCurrentCall)
    unsubscribeCurrentCall();


  const callRef =
    doc(
      db,
      "calls",
      currentCallId
    );


  unsubscribeCurrentCall =
    onSnapshot(
      callRef,

      async snapshot => {

        if(!snapshot.exists())
          return;


        const call =
          snapshot.data();


        /* CALLER RECEIVES ANSWER */

        if(
          isCaller &&
          call.answer &&
          peerConnection &&
          !peerConnection.currentRemoteDescription
        ){

          try{

            await peerConnection
              .setRemoteDescription(
                new RTCSessionDescription(
                  call.answer
                )
              );


            listenToReceiverCandidates();

          }
          catch(error){

            console.error(
              "Answer error:",
              error
            );

          }

        }


        if(
          call.status ===
          "rejected"
        ){

          showToast(
            "Call rejected."
          );

          cleanupCall();

        }


        if(
          call.status ===
          "ended"
        ){

          cleanupCall();

        }

      }

    );

}


/* ================================
   RECEIVER CALL LISTENER
================================ */

function setupIncomingCalls(){

  if(unsubscribeIncomingCalls)
    unsubscribeIncomingCalls();


  const incomingQuery =
    query(

      collection(
        db,
        "calls"
      ),

      where(
        "receiverId",
        "==",
        currentUser.uid
      ),

      where(
        "status",
        "==",
        "ringing"
      )

    );


  unsubscribeIncomingCalls =
    onSnapshot(
      incomingQuery,

      snapshot => {

        if(snapshot.empty){

          incomingCard
            .classList
            .remove("show");

          return;

        }


        const latest =
          snapshot.docs[
            snapshot.docs.length - 1
          ];


        incomingCallData = {

          id:
            latest.id,

          ...latest.data()

        };


        incomingTitle.textContent =
          incomingCallData.callType ===
          "video"
            ? "Incoming Video Call"
            : "Incoming Audio Call";


        incomingText.textContent =
          (
            incomingCallData.callerName ||
            "Someone"
          ) +
          " is calling you";


        incomingCard
          .classList
          .add("show");

      },

      error => {

        console.error(
          "Incoming calls:",
          error
        );

      }

    );

}


/* ================================
   ACCEPT CALL
================================ */

async function acceptCall(){

  if(!incomingCallData)
    return;


  const call =
    incomingCallData;


  incomingCard
    .classList
    .remove("show");


  try{

    currentCallId =
      call.id;

    currentCallType =
      call.callType;

    isCaller =
      false;


    const constraints =
      call.callType === "video"

        ? {
            audio:true,
            video:true
          }

        : {
            audio:true,
            video:false
          };


    localStream =
      await navigator.mediaDevices
        .getUserMedia(
          constraints
        );


    localVideo.srcObject =
      localStream;


    peerConnection =
      createPeerConnection();


    localStream
      .getTracks()
      .forEach(track => {

        peerConnection.addTrack(
          track,
          localStream
        );

      });


    /* RECEIVER ICE */

    peerConnection.onicecandidate =
      event => {

        if(
          event.candidate &&
          currentCallId
        ){

          addDoc(

            collection(
              db,
              "calls",
              currentCallId,
              "receiverCandidates"
            ),

            event.candidate.toJSON()

          ).catch(
            console.error
          );

        }

      };


    if(!call.offer){

      throw new Error(
        "Call offer missing."
      );

    }


    await peerConnection
      .setRemoteDescription(
        new RTCSessionDescription(
          call.offer
        )
      );


    listenToCallerCandidates();


    const answer =
      await peerConnection
        .createAnswer();


    await peerConnection
      .setLocalDescription(
        answer
      );


    await updateDoc(
      doc(
        db,
        "calls",
        currentCallId
      ),
      {

        answer:{
          type:
            answer.type,

          sdp:
            answer.sdp
        },

        status:
          "accepted"

      }
    );


    showCallWindow(
      call.callType,
      "Connected"
    );

  }
  catch(error){

    console.error(
      "Accept call:",
      error
    );

    cleanupCall();

    showToast(
      "Unable to accept call."
    );

  }

}


/* ================================
   LISTEN CALLER ICE
================================ */

function listenToCallerCandidates(){

  if(unsubscribeCallerCandidates)
    unsubscribeCallerCandidates();


  const candidatesQuery =
    query(

      collection(
        db,
        "calls",
        currentCallId,
        "callerCandidates"
      )

    );


  unsubscribeCallerCandidates =
    onSnapshot(
      candidatesQuery,

      snapshot => {

        snapshot.docChanges()
          .forEach(
            async change => {

              if(
                change.type !==
                "added"
              )
                return;


              try{

                await peerConnection
                  .addIceCandidate(
                    new RTCIceCandidate(
                      change.doc.data()
                    )
                  );

              }
              catch(error){

                console.error(
                  "Caller ICE:",
                  error
                );

              }

            }
          );

      }

    );

}


/* ================================
   LISTEN RECEIVER ICE
================================ */

function listenToReceiverCandidates(){

  if(unsubscribeReceiverCandidates)
    unsubscribeReceiverCandidates();


  const candidatesQuery =
    query(

      collection(
        db,
        "calls",
        currentCallId,
        "receiverCandidates"
      )

    );


  unsubscribeReceiverCandidates =
    onSnapshot(
      candidatesQuery,

      snapshot => {

        snapshot.docChanges()
          .forEach(
            async change => {

              if(
                change.type !==
                "added"
              )
                return;


              try{

                await peerConnection
                  .addIceCandidate(
                    new RTCIceCandidate(
                      change.doc.data()
                    )
                  );

              }
              catch(error){

                console.error(
                  "Receiver ICE:",
                  error
                );

              }

            }
          );

      }

    );

}


/* ================================
   REJECT CALL
================================ */

async function rejectCall(){

  if(!incomingCallData)
    return;


  try{

    await updateDoc(
      doc(
        db,
        "calls",
        incomingCallData.id
      ),
      {
        status:"rejected"
      }
    );

  }
  catch(error){

    console.error(error);

  }


  incomingCallData =
    null;

  incomingCard
    .classList
    .remove("show");

}


/* ================================
   SHOW CALL
================================ */

function showCallWindow(
  type,
  title
){

  callOverlay
    .classList
    .add("show");


  callTitle.textContent =
    title;


  if(type === "audio"){

    remoteVideo.style.display =
      "none";

    localVideo.style.display =
      "none";

  }
  else{

    remoteVideo.style.display =
      "block";

    localVideo.style.display =
      "block";

  }

}


/* ================================
   END CALL
================================ */

async function endCall(){

  try{

    if(currentCallId){

      await updateDoc(
        doc(
          db,
          "calls",
          currentCallId
        ),
        {
          status:"ended"
        }
      );

    }

  }
  catch(error){

    console.error(error);

  }


  cleanupCall();

}


/* ================================
   CLEANUP
================================ */

function cleanupCall(){

  if(unsubscribeCurrentCall){

    unsubscribeCurrentCall();

    unsubscribeCurrentCall =
      null;

  }


  if(unsubscribeCallerCandidates){

    unsubscribeCallerCandidates();

    unsubscribeCallerCandidates =
      null;

  }


  if(unsubscribeReceiverCandidates){

    unsubscribeReceiverCandidates();

    unsubscribeReceiverCandidates =
      null;

  }


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    localStream =
      null;

  }


  if(peerConnection){

    peerConnection.close();

    peerConnection =
      null;

  }


  localVideo.srcObject =
    null;

  remoteVideo.srcObject =
    null;


  callOverlay
    .classList
    .remove("show");


  currentCallId =
    null;

  currentCallType =
    null;

  isCaller =
    false;

}


/* ================================
   MUTE
================================ */

document
  .getElementById("muteBtn")
  .addEventListener(
    "click",
    () => {

      if(!localStream)
        return;


      const tracks =
        localStream.getAudioTracks();


      tracks.forEach(track => {

        track.enabled =
          !track.enabled;

      });


      const enabled =
        tracks.some(
          track => track.enabled
        );


      document
        .getElementById("muteBtn")
        .textContent =
          enabled
            ? "🎤"
            : "🔇";

    }
  );

================================ */

  .getElementById("cameraBtn")
  .addEventListener(

      if(!localStream)

      const tracks =
        localStream.getVideoTracks();


      if(!tracks.length)
        return;


      tracks.forEach(track => {

        track.enabled =
          !track.enabled;

      });


      const enabled =
        tracks.some(
          track => track.enabled
        );


      document
        .getElementById("cameraBtn")
        .textContent =
          enabled
            ? "▣"
            : "▢";

    }
  );
