<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Talent Exchange</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 20% 20%,rgba(124,58,237,.18),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(79,70,229,.14),transparent 30%),
        #070711;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
}

.container{
    width:100%;
    max-width:420px;
    padding:20px;
}

.card{
    background:rgba(15,15,28,.94);
    border:1px solid rgba(255,255,255,.09);
    border-radius:22px;
    padding:38px 32px;
    box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.brand{
    text-align:center;
    margin-bottom:30px;
}

.brand h1{
    font-size:28px;
    font-weight:800;
}

.brand h1 span{
    color:#8b5cf6;
}

.brand p{
    color:#777789;
    font-size:12px;
    margin-top:8px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    color:#aaaabd;
    font-size:12px;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:13px 14px;
    border-radius:10px;
    border:1px solid #29293b;
    background:#0b0b15;
    color:white;
    outline:none;
    font-size:13px;
}

input:focus{
    border-color:#7c3aed;
    box-shadow:0 0 0 3px rgba(124,58,237,.1);
}

.password-row{
    position:relative;
}

.password-row input{
    padding-right:75px;
}

.show-password{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:#9b9baa;
    cursor:pointer;
    font-size:11px;
}

.forgot{
    text-align:right;
    margin-top:-8px;
    margin-bottom:20px;
}

.forgot button{
    background:none;
    border:none;
    color:#a78bfa;
    cursor:pointer;
    font-size:11px;
}

.login-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#7c3aed,#6d28d9);
    color:white;
    font-weight:700;
    cursor:pointer;
    font-size:13px;
    transition:.2s;
}

.login-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 25px rgba(124,58,237,.25);
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.message{
    display:none;
    padding:11px 13px;
    border-radius:9px;
    margin-bottom:17px;
    font-size:11px;
    line-height:1.5;
}

.message.error{
    background:rgba(239,68,68,.1);
    border:1px solid rgba(239,68,68,.2);
    color:#fca5a5;
}

.message.success{
    background:rgba(34,197,94,.1);
    border:1px solid rgba(34,197,94,.2);
    color:#86efac;
}

.divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:25px 0;
    color:#555566;
    font-size:10px;
}

.divider::before,
.divider::after{
    content:"";
    height:1px;
    flex:1;
    background:#252536;
}

.register{
    text-align:center;
    color:#777789;
    font-size:12px;
}

.register a{
    color:#a78bfa;
    text-decoration:none;
    font-weight:600;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    color:#666677;
    text-decoration:none;
    font-size:11px;
}

.loading{
    display:none;
    text-align:center;
    margin-top:12px;
    color:#8b5cf6;
    font-size:11px;
}

.footer{
    text-align:center;
    margin-top:18px;
    color:#4f4f5d;
    font-size:9px;
}

@media(max-width:480px){
    .card{
        padding:30px 22px;
    }

    .brand h1{
        font-size:24px;
    }
}
</style>

</head>

<body>

<div class="container">

```
<div class="card">

    <div class="brand">

        <h1>
            Talent<span>Exchange</span>
        </h1>

        <p>
            Exchange knowledge. Build connections.
        </p>

    </div>


    <div
        id="message"
        class="message">
    </div>


    <form id="loginForm">

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required>

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="password-row">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>

                <button
                    type="button"
                    class="show-password"
                    id="showPassword">

                    Show

                </button>

            </div>

        </div>


        <div class="forgot">

            <button
                type="button"
                id="forgotPassword">

                Forgot password?

            </button>

        </div>


        <button
            type="submit"
            class="login-btn"
            id="loginBtn">

            Sign In

        </button>


        <div
            class="loading"
            id="loading">

            Signing in...

        </div>

    </form>


    <div class="divider">
        <span>NEW TO TALENT EXCHANGE?</span>
    </div>


    <div class="register">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </div>


    <div class="back">

        <a href="index.html">
            ← Back to home
        </a>

    </div>

</div>


<div class="footer">
    Talent Exchange · Made by Govardhan
</div>
```

</div>

<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    auth,
    db
} from "./js/firebase-config.js";

import {
    signInWithEmailAndPassword,
    setPersistence,
    browserLocalPersistence,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const loading =
    document.getElementById("loading");

const message =
    document.getElementById("message");

const showPassword =
    document.getElementById("showPassword");

const forgotPassword =
    document.getElementById("forgotPassword");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type = "error"
){

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}


/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

showPassword.addEventListener(
    "click",
    () => {

        if(
            passwordInput.type === "password"
        ){

            passwordInput.type =
                "text";

            showPassword.textContent =
                "Hide";

        }else{

            passwordInput.type =
                "password";

            showPassword.textContent =
                "Show";

        }

    }
);


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        message.style.display =
            "none";


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        if(!email || !password){

            showMessage(
                "Please enter your email and password."
            );

            return;

        }


        loginBtn.disabled =
            true;

        loading.style.display =
            "block";


        try{

            /* =========================================
               FORCE LOCAL FIREBASE SESSION
            ========================================= */

            await setPersistence(
                auth,
                browserLocalPersistence
            );


            /* =========================================
               FIREBASE LOGIN
            ========================================= */

            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const firebaseUser =
                credential.user;


            console.log(
                "LOGIN SUCCESS"
            );

            console.log(
                "Firebase UID:",
                firebaseUser.uid
            );

            console.log(
                "Firebase email:",
                firebaseUser.email
            );

            console.log(
                "Current Firebase user:",
                auth.currentUser
            );


            /* =========================================
               GET FIRESTORE USER PROFILE
            ========================================= */

            const userRef =
                doc(
                    db,
                    "users",
                    firebaseUser.uid
                );


            const userSnap =
                await getDoc(userRef);


            if(!userSnap.exists()){

                await auth.signOut();

                showMessage(
                    "Your Firebase account exists, but your Talent Exchange profile was not found."
                );

                loginBtn.disabled =
                    false;

                loading.style.display =
                    "none";

                return;

            }


            const userData =
                userSnap.data();


            console.log(
                "Firestore user:",
                userData
            );


            /* =========================================
               ACCOUNT STATUS
            ========================================= */

            const status =
                userData.status ||
                "approved";


            if(status === "pending"){

                await auth.signOut();

                showMessage(
                    "Your account is waiting for admin approval."
                );

                loginBtn.disabled =
                    false;

                loading.style.display =
                    "none";

                return;

            }


            if(status === "rejected"){

                await auth.signOut();

                showMessage(
                    "Your account has been rejected by the administrator."
                );

                loginBtn.disabled =
                    false;

                loading.style.display =
                    "none";

                return;

            }


            if(status === "disabled"){

                await auth.signOut();

                showMessage(
                    "Your account has been disabled."
                );

                loginBtn.disabled =
                    false;

                loading.style.display =
                    "none";

                return;

            }


            /* =========================================
               SAVE LOCAL PROFILE
            ========================================= */

            const profile = {

                id:
                    firebaseUser.uid,

                uid:
                    firebaseUser.uid,

                name:
                    userData.name ||
                    "User",

                email:
                    userData.email ||
                    firebaseUser.email,

                bio:
                    userData.bio ||
                    "",

                offeredSkills:
                    Array.isArray(
                        userData.offeredSkills
                    )
                    ?
                    userData.offeredSkills
                    :
                    [],

                learningSkills:
                    Array.isArray(
                        userData.learningSkills
                    )
                    ?
                    userData.learningSkills
                    :
                    [],

                learningSkill:
                    Array.isArray(
                        userData.learningSkill
                    )
                    ?
                    userData.learningSkill
                    :
                    [],

                profilePhoto:
                    userData.profilePhoto ||
                    "",

                role:
                    userData.role ||
                    "user",

                status:
                    status

            };


            localStorage.setItem(
                "userProfile",
                JSON.stringify(profile)
            );


            localStorage.setItem(
                "isLoggedIn",
                "true"
            );


            /* =========================================
               VERIFY SESSION BEFORE REDIRECT
            ========================================= */

            const currentUser =
                auth.currentUser;


            if(!currentUser){

                throw new Error(
                    "Firebase session was lost immediately after login."
                );

            }


            console.log(
                "SESSION VERIFIED:",
                currentUser.uid
            );


            showMessage(
                "Login successful. Opening dashboard...",
                "success"
            );


            /*
               Small delay so Firebase has time to
               finish persistence before navigation.
            */

            setTimeout(
                () => {

                    window.location.href =
                        "dashboard.html";

                },
                800
            );

        }

        catch(error){

            console.error(
                "LOGIN ERROR:",
                error
            );


            let errorText =
                "Unable to sign in. Please try again.";


            if(
                error.code ===
                "auth/invalid-credential"
            ){

                errorText =
                    "Invalid email or password.";

            }

            else if(
                error.code ===
                "auth/user-not-found"
            ){

                errorText =
                    "No account exists with this email.";

            }

            else if(
                error.code ===
                "auth/wrong-password"
            ){

                errorText =
                    "Incorrect password.";

            }

            else if(
                error.code ===
                "auth/invalid-email"
            ){

                errorText =
                    "Please enter a valid email address.";

            }

            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                errorText =
                    "Too many login attempts. Please try again later.";

            }

            else if(
                error.code ===
                "auth/network-request-failed"
            ){

                errorText =
                    "Network error. Check your internet connection.";

            }

            else if(
                error.message
            ){

                errorText =
                    error.message;

            }


            showMessage(
                errorText
            );


            loginBtn.disabled =
                false;

            loading.style.display =
                "none";

        }

    }
);


/* =====================================================
   FORGOT PASSWORD
===================================================== */

forgotPassword.addEventListener(
    "click",
    async () => {

        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        if(!email){

            showMessage(
                "Enter your email address first."
            );

            emailInput.focus();

            return;

        }


        try{

            await sendPasswordResetEmail(
                auth,
                email
            );


            showMessage(
                "Password reset email sent. Check your inbox.",
                "success"
            );

        }

        catch(error){

            console.error(
                "PASSWORD RESET ERROR:",
                error
            );


            if(
                error.code ===
                "auth/user-not-found"
            ){

                showMessage(
                    "No account exists with this email."
                );

            }

            else{

                showMessage(
                    error.message ||
                    "Unable to send password reset email."
                );

            }

        }

    }
);

</script>

</body>
</html>
