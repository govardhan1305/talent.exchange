<script type="module">

import {
    auth,
    db
} from "./js/firebase-config.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs,
    getDoc,
    doc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


let currentUser = null;

let allConnections = [];

let userCache = {};


/* =========================
   DEFAULT AVATAR
========================= */

function defaultAvatar(){

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             width="300"
             height="300"
             viewBox="0 0 300 300">

            <rect
                width="300"
                height="300"
                fill="#11111a"
            />

            <circle
                cx="150"
                cy="110"
                r="55"
                fill="#29243a"
            />

            <path
                d="M50 285
                   C60 205 105 170 150 170
                   C195 170 240 205 250 285"
                fill="#29243a"
            />

        </svg>
        `);

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================
   SKILLS
========================= */

function normalizeSkills(value){

    if(Array.isArray(value)){
        return value.filter(Boolean);
    }

    if(typeof value === "string"){

        return value
            .split(",")
            .map(x => x.trim())
            .filter(Boolean);

    }

    return [];

}


/* =========================
   LOAD CONNECTIONS
========================= */

async function loadConnections(){

    const container =
        document.getElementById(
            "connections"
        );


    container.innerHTML = `

        <div class="empty">

            <h3>Loading connections...</h3>

            <p>
                Finding your accepted connections.
            </p>

        </div>

    `;


    try{

        const q =
            query(
                collection(db,"Connections"),
                where(
                    "userIds",
                    "array-contains",
                    currentUser.uid
                )
            );


        const snapshot =
            await getDocs(q);


        allConnections = [];


        for(const connectionDoc of snapshot.docs){

            const connection =
                {
                    id:connectionDoc.id,
                    ...connectionDoc.data()
                };


            let otherId = null;


            if(
                Array.isArray(
                    connection.userIds
                )
            ){

                otherId =
                    connection.userIds.find(
                        id =>
                            id !==
                            currentUser.uid
                    );

            }


            /*
             Fallback for older documents.
            */

            if(!otherId){

                if(
                    connection.user1Id ===
                    currentUser.uid
                ){

                    otherId =
                        connection.user2Id;

                }else{

                    otherId =
                        connection.user1Id;

                }

            }


            if(!otherId){
                continue;
            }


            let user;


            if(userCache[otherId]){

                user =
                    userCache[otherId];

            }else{

                const userSnap =
                    await getDoc(
                        doc(
                            db,
                            "users",
                            otherId
                        )
                    );


                if(!userSnap.exists()){
                    continue;
                }


                user = {
                    id:userSnap.id,
                    ...userSnap.data()
                };


                userCache[otherId] =
                    user;

            }


            allConnections.push({

                connection,
                user

            });

        }


        renderConnections(
            allConnections
        );


    }catch(error){

        console.error(
            "CONNECTION LOAD ERROR:",
            error
        );


        container.innerHTML = `

            <div class="empty">

                <h3>Unable to load connections</h3>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>

            </div>

        `;

    }

}


/* =========================
   RENDER
========================= */

function renderConnections(items){

    const container =
        document.getElementById(
            "connections"
        );


    container.innerHTML = "";


    if(items.length === 0){

        container.innerHTML = `

            <div class="empty">

                <h3>No connections yet</h3>

                <p>
                    Accept a skill exchange request
                    to create your first connection.
                </p>

            </div>

        `;

        return;

    }


    items.forEach(item => {

        const user =
            item.user;


        const skills =
            normalizeSkills(
                user.offeredSkills
            );


        const photo =
            user.profilePhoto ||
            defaultAvatar();


        const card =
            document.createElement("div");

        card.className =
            "connection-card";


        card.dataset.search =
            [
                user.name,
                user.email,
                user.bio,
                ...skills
            ]
            .join(" ")
            .toLowerCase();


        card.innerHTML = `

            <div class="card-top">

                <img
                    class="avatar"
                    src="${escapeHtml(photo)}"
                    alt="Profile"
                >

                <div>

                    <div class="name">
                        ${escapeHtml(
                            user.name ||
                            "Talent Exchange Member"
                        )}
                    </div>

                    <div class="email">
                        ${escapeHtml(
                            user.email || ""
                        )}
                    </div>

                </div>

            </div>


            <div class="skills">

                ${
                    skills.length

                    ? skills
                        .slice(0,5)
                        .map(skill => `
                            <span class="skill">
                                ${escapeHtml(skill)}
                            </span>
                        `)
                        .join("")

                    : `
                        <span class="skill">
                            Skill not added
                        </span>
                    `
                }

            </div>


            <div class="bio">

                ${escapeHtml(
                    user.bio ||
                    "Connected Talent Exchange member."
                )}

            </div>


            <div class="card-actions">

                <button
                    class="action"
                    data-profile
                >
                    Profile
                </button>

                <button
                    class="action primary"
                    data-chat
                >
                    Chat
                </button>

            </div>

        `;


        card
            .querySelector("[data-profile]")
            .addEventListener(
                "click",
                () => showProfile(user)
            );


        card
            .querySelector("[data-chat]")
            .addEventListener(
                "click",
                () => openChat(user)
            );


        container.appendChild(card);

    });

}


/* =========================
   SEARCH
========================= */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        event => {

            const search =
                event.target.value
                    .trim()
                    .toLowerCase();


            const filtered =
                allConnections.filter(
                    item => {

                        const user =
                            item.user;


                        const text =
                            [
                                user.name,
                                user.email,
                                user.bio,
                                ...normalizeSkills(
                                    user.offeredSkills
                                ),
                                ...normalizeSkills(
                                    user.learningSkills ||
                                    user.learningSkill
                                )
                            ]
                            .join(" ")
                            .toLowerCase();


                        return text.includes(
                            search
                        );

                    }
                );


            renderConnections(
                filtered
            );

        }
    );


/* =========================
   PROFILE
========================= */

function showProfile(user){

    const offered =
        normalizeSkills(
            user.offeredSkills
        );


    const learning =
        normalizeSkills(
            user.learningSkills ||
            user.learningSkill
        );


    const photo =
        user.profilePhoto ||
        defaultAvatar();


    document.getElementById(
        "profileContent"
    ).innerHTML = `

        <div class="modal-profile">

            <img
                class="modal-avatar"
                src="${escapeHtml(photo)}"
                alt="Profile"
            >

            <h2>
                ${escapeHtml(
                    user.name ||
                    "Talent Exchange Member"
                )}
            </h2>

            <p>
                ${escapeHtml(
                    user.email || ""
                )}
            </p>

        </div>


        <div class="modal-section">

            <h4>About</h4>

            <div class="modal-bio">

                ${escapeHtml(
                    user.bio ||
                    "No bio added yet."
                )}

            </div>

        </div>


        <div class="modal-section">

            <h4>Skills Offered</h4>

            <div class="tags">

                ${
                    offered.length

                    ? offered.map(skill => `
                        <span class="tag">
                            ${escapeHtml(skill)}
                        </span>
                    `).join("")

                    : `
                        <span class="tag">
                            None added
                        </span>
                    `
                }

            </div>

        </div>


        <div class="modal-section">

            <h4>Skills Wanted</h4>

            <div class="tags">

                ${
                    learning.length

                    ? learning.map(skill => `
                        <span class="tag">
                            ${escapeHtml(skill)}
                        </span>
                    `).join("")

                    : `
                        <span class="tag">
                            None added
                        </span>
                    `
                }

            </div>

        </div>

    `;


    document
        .getElementById("profileModal")
        .classList.add("show");

}


/* =========================
   CHAT
========================= */

function openChat(user){

    localStorage.setItem(
        "activeChatId",
        user.id
    );

    localStorage.setItem(
        "activeChatName",
        user.name || ""
    );

    localStorage.setItem(
        "activeChatSkill",
        normalizeSkills(
            user.offeredSkills
        )[0] || ""
    );


    window.location.href =
        "chat.html";

}


/* =========================
   CALL
========================= */

function openCall(user){

    document.getElementById(
        "callContent"
    ).innerHTML = `

        <div class="modal-profile">

            <h2>
                ${escapeHtml(
                    user.name ||
                    "Connection"
                )}
            </h2>

            <p>
                Choose how you want to connect.
            </p>

        </div>


        <div class="call-options">

            <button
                class="call-btn"
                id="audioCall"
            >
                Audio Call
            </button>

            <button
                class="call-btn"
                id="videoCall"
            >
                Video Call
            </button>

        </div>

    `;


    document
        .getElementById("callModal")
        .classList.add("show");


    document
        .getElementById("audioCall")
        .onclick = () => {

            alert(
                "Audio calling will be connected through WebRTC in the realtime communication step."
            );

        };


    document
        .getElementById("videoCall")
        .onclick = () => {

            alert(
                "Video calling will be connected through WebRTC in the realtime communication step."
            );

        };

}


/* =========================
   CLOSE MODALS
========================= */

document
    .getElementById("closeProfile")
    .onclick = () => {

        document
            .getElementById("profileModal")
            .classList.remove("show");

    };


document
    .getElementById("closeCall")
    .onclick = () => {

        document
            .getElementById("callModal")
            .classList.remove("show");

    };


document
    .getElementById("profileModal")
    .onclick = event => {

        if(
            event.target.id ===
            "profileModal"
        ){

            event.currentTarget
