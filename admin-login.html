<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Talent Exchange</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top left, rgba(124,58,237,.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(91,33,182,.16), transparent 35%),
        #07070b;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.brand{
    text-align:center;
    margin-bottom:28px;
}

.brand h1{
    font-size:30px;
    letter-spacing:.5px;
}

.brand p{
    margin-top:7px;
    color:#999;
    font-size:14px;
}

.card{
    background:rgba(18,18,25,.92);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:32px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    backdrop-filter:blur(15px);
}

.admin-badge{
    width:58px;
    height:58px;
    margin:0 auto 20px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(124,58,237,.15);
    border:1px solid rgba(124,58,237,.35);
    font-size:24px;
}

h2{
    text-align:center;
    font-size:24px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#8e8e98;
    font-size:14px;
    margin-bottom:28px;
}

.field{
    margin-bottom:18px;
}

label{
    display:block;
    font-size:13px;
    color:#c8c8d0;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:14px 15px;
    border-radius:11px;
    border:1px solid #292934;
    background:#101017;
    color:#fff;
    outline:none;
    font-size:14px;
    transition:.2s;
}

input:focus{
    border-color:#7c3aed;
    box-shadow:0 0 0 3px rgba(124,58,237,.12);
}

.password-wrap{
    position:relative;
}

.password-wrap input{
    padding-right:70px;
}

.show-btn{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:#9b7bea;
    cursor:pointer;
    font-size:12px;
}

.login-btn{
    width:100%;
    border:none;
    border-radius:11px;
    padding:14px;
    background:linear-gradient(135deg,#7c3aed,#5b21b6);
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    margin-top:5px;
    transition:.2s;
}

.login-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 25px rgba(124,58,237,.25);
}

.message{
    display:none;
    margin-top:16px;
    padding:12px;
    border-radius:10px;
    font-size:13px;
    text-align:center;
}

.message.error{
    display:block;
    background:rgba(220,38,38,.12);
    border:1px solid rgba(220,38,38,.25);
    color:#fca5a5;
}

.message.success{
    display:block;
    background:rgba(34,197,94,.12);
    border:1px solid rgba(34,197,94,.25);
    color:#86efac;
}

.back{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#8e8e98;
    text-decoration:none;
    font-size:13px;
}

.back:hover{
    color:#b18cff;
}

.security-note{
    margin-top:20px;
    padding:12px;
    border-radius:10px;
    background:#0d0d13;
    border:1px solid #20202a;
    color:#777783;
    font-size:11px;
    line-height:1.5;
    text-align:center;
}

@media(max-width:480px){
    .card{
        padding:25px 20px;
    }

    .brand h1{
        font-size:26px;
    }
}
</style>

</head>

<body>

<div class="container">


<div class="brand">
    <h1>Talent Exchange</h1>
    <p>Skill sharing platform</p>
</div>

<div class="card">

    <div class="admin-badge">A</div>

    <h2>Admin Login</h2>
    <p class="subtitle">Sign in to manage the Talent Exchange platform</p>

    <form id="adminLoginForm">

        <div class="field">
            <label for="email">Admin Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                required
            >
        </div>

        <div class="field">
            <label for="password">Password</label>

            <div class="password-wrap">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter admin password"
                    required
                >

                <button
                    type="button"
                    class="show-btn"
                    id="showPassword"
                >
                    Show
                </button>
            </div>
        </div>

        <button type="submit" class="login-btn">
            Sign In as Admin
        </button>

        <div id="message" class="message"></div>

    </form>

    <div class="security-note">
        Admin access is restricted to authorized administrators.
    </div>

    <a href="login.html" class="back">
        ← Back to User Login
    </a>

</div>


</div>

<script>

const form = document.getElementById("adminLoginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const showPassword = document.getElementById("showPassword");
const message = document.getElementById("message");

showPassword.addEventListener("click", () => {

    if(passwordInput.type === "password"){
        passwordInput.type = "text";
        showPassword.textContent = "Hide";
    }else{
        passwordInput.type = "password";
        showPassword.textContent = "Show";
    }

});

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    message.className = "message";
    message.textContent = "";

    if(!email || !password){
        message.className = "message error";
        message.textContent = "Please enter email and password.";
        return;
    }

    /*
      TEMPORARY FRONTEND TEST

      This is only for checking the Admin page.
      Later we will REMOVE this and connect it
      to the Flask backend.
    */

    const demoAdminEmail = "admin@talentexchange.com";
    const demoAdminPassword = "Admin@123";

    if(email === demoAdminEmail && password === demoAdminPassword){

        const adminProfile = {
            name: "Talent Exchange Admin",
            email: email,
            role: "admin"
        };

        localStorage.setItem(
            "adminProfile",
            JSON.stringify(adminProfile)
        );

        localStorage.setItem("adminLoggedIn", "true");

        message.className = "message success";
        message.textContent = "Login successful. Opening dashboard...";

        setTimeout(() => {
            window.location.href = "admin-dashboard.html";
        }, 700);

    }else{

        message.className = "message error";
        message.textContent = "Invalid admin credentials.";

    }

});

</script>

</body>
</html>
