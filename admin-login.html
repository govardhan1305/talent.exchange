<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talent Exchange — Admin Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#07070d;
    --card:rgba(18,16,31,.72);
    --border:rgba(167,139,250,.22);
    --purple:#8b5cf6;
    --purple2:#a78bfa;
    --text:#f5f3ff;
    --muted:#9b97ad;
    --danger:#fb7185;
    --success:#4ade80;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 15% 20%,rgba(139,92,246,.18),transparent 28%),
        radial-gradient(circle at 85% 80%,rgba(124,58,237,.15),transparent 30%),
        var(--bg);
}

/* Background */
.background{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(2px);
    opacity:.45;
    animation:float 10s ease-in-out infinite;
}

.orb.one{
    width:280px;
    height:280px;
    background:radial-gradient(circle,#7c3aed,transparent 70%);
    top:-100px;
    left:-80px;
}

.orb.two{
    width:330px;
    height:330px;
    background:radial-gradient(circle,#4c1d95,transparent 70%);
    right:-120px;
    bottom:-100px;
    animation-delay:2s;
}

.orb.three{
    width:180px;
    height:180px;
    background:radial-gradient(circle,#a78bfa,transparent 70%);
    left:50%;
    top:5%;
    opacity:.12;
    animation-delay:4s;
}

@keyframes float{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(20px,-25px) scale(1.08)}
}

/* Card */
.wrapper{
    width:100%;
    max-width:450px;
    padding:24px;
    perspective:1200px;
}

.card{
    position:relative;
    padding:42px 38px;
    border:1px solid var(--border);
    border-radius:28px;
    background:var(--card);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.06);
    transform-style:preserve-3d;
    transition:transform .18s ease;
}

/* Top shine */
.card::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:28px;
    background:linear-gradient(
        135deg,
        rgba(255,255,255,.08),
        transparent 35%,
        transparent 70%,
        rgba(139,92,246,.07)
    );
    pointer-events:none;
}

/* Logo */
.logo{
    width:72px;
    height:72px;
    margin:0 auto 22px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:22px;
    background:linear-gradient(
        145deg,
        rgba(139,92,246,.28),
        rgba(76,29,149,.18)
    );
    border:1px solid rgba(167,139,250,.3);
    box-shadow:
        0 15px 40px rgba(124,58,237,.25),
        inset 0 1px 0 rgba(255,255,255,.08);
    transform:translateZ(35px);
}

.logo span{
    font-size:30px;
    font-weight:800;
    color:var(--purple2);
}

/* Heading */
.heading{
    text-align:center;
    transform:translateZ(25px);
}

.heading h1{
    font-size:28px;
    letter-spacing:-.8px;
    margin-bottom:8px;
}

.heading p{
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
}

/* Form */
.form{
    margin-top:32px;
    transform:translateZ(20px);
}

.field{
    margin-bottom:20px;
}

.field label{
    display:block;
    margin-bottom:8px;
    font-size:13px;
    font-weight:600;
    color:#d8d4e6;
}

.input-wrap{
    position:relative;
}

.input{
    width:100%;
    height:52px;
    padding:0 15px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.09);
    outline:none;
    background:rgba(5,5,12,.58);
    color:white;
    font-size:14px;
    transition:.25s;
}

.input.password{
    padding-right:48px;
}

.input::placeholder{
    color:#696579;
}

.input:focus{
    border-color:rgba(139,92,246,.65);
    box-shadow:0 0 0 4px rgba(139,92,246,.09);
    background:rgba(8,7,17,.8);
}

.eye{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    color:#8c879d;
    cursor:pointer;
    font-size:13px;
    padding:5px;
}

.eye:hover{
    color:var(--purple2);
}

/* Login button */
.login-btn{
    width:100%;
    height:54px;
    margin-top:5px;
    border:0;
    border-radius:16px;
    cursor:pointer;
    color:white;
    font-size:15px;
    font-weight:700;
    letter-spacing:.2px;
    background:linear-gradient(135deg,#7c3aed,#9f67ff);
    box-shadow:
        0 15px 35px rgba(124,58,237,.3),
        inset 0 1px 0 rgba(255,255,255,.18);
    transition:.25s;
}

.login-btn:hover{
    transform:translateY(-2px);
    box-shadow:
        0 20px 40px rgba(124,58,237,.38),
        inset 0 1px 0 rgba(255,255,255,.2);
}

.login-btn:active{
    transform:translateY(0);
}

.login-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

/* Status */
.status{
    display:none;
    margin-top:18px;
    padding:13px 14px;
    border-radius:13px;
    font-size:13px;
    line-height:1.45;
    text-align:center;
}

.status.error{
    display:block;
    color:#fecdd3;
    background:rgba(244,63,94,.09);
    border:1px solid rgba(244,63,94,.2);
}

.status.success{
    display:block;
    color:#bbf7d0;
    background:rgba(34,197,94,.08);
    border:1px solid rgba(34,197,94,.2);
}

/* Footer */
.footer{
    text-align:center;
    margin-top:27px;
    color:#696579;
    font-size:12px;
}

.footer span{
    color:#9f8bd4;
}

/* Loading */
.spinner{
    width:18px;
    height:18px;
    margin:auto;
    border:2px solid rgba(255,255,255,.25);
    border-top-color:white;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* Mobile */
@media(max-width:500px){
    .wrapper{
        padding:16px;
    }

    .card{
        padding:34px 24px;
        border-radius:24px;
    }

    .heading h1{
        font-size:25px;
    }
}
</style>

</head>

<body>

<div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
</div>

<div class="wrapper">
    <div class="card" id="card">

```
    <div class="logo">
        <span>TX</span>
    </div>

    <div class="heading">
        <h1>Admin Login</h1>
        <p>
            Secure administrator access to<br>
            Talent Exchange
        </p>
    </div>

    <form class="form" id="adminForm">

        <div class="field">
            <label for="email">Admin Email</label>

            <div class="input-wrap">
                <input
                    class="input"
                    id="email"
                    type="email"
                    placeholder="Enter admin email"
                    autocomplete="username"
                    required
                >
            </div>
        </div>

        <div class="field">
            <label for="password">Password</label>

            <div class="input-wrap">
                <input
                    class="input password"
                    id="password"
                    type="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="eye"
                    id="togglePassword"
                >
                    Show
                </button>
            </div>
        </div>

        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >
            Sign in as Admin
        </button>

        <div id="status" class="status"></div>

    </form>

    <div class="footer">
        Talent Exchange · <span>Administrator Portal</span>
    </div>

</div>
```

</div>

<script type="module">

/*
    IMPORTANT:
    This file uses your existing Firebase configuration.

    DO NOT put another Firebase config here.
*/

import { auth, db } from "./js/firebase-config.js";

import {
    signInWithEmailAndPassword,
    setPersistence,
    browserLocalPersistence,
    signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const form = document.getElementById("adminForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const statusBox = document.getElementById("status");
const togglePassword = document.getElementById("togglePassword");
const card = document.getElementById("card");


/* =========================
   PASSWORD SHOW / HIDE
========================= */

togglePassword.addEventListener("click", () => {

    const isPassword =
        passwordInput.type === "password";

    passwordInput.type =
        isPassword ? "text" : "password";

    togglePassword.textContent =
        isPassword ? "Hide" : "Show";
});


/* =========================
   STATUS MESSAGE
========================= */

function showStatus(message, type = "error") {

    statusBox.textContent = message;

    statusBox.className =
        `status ${type}`;
}


function clearStatus() {

    statusBox.textContent = "";

    statusBox.className = "status";
}


/* =========================
   LOADING
========================= */

function setLoading(loading) {

    loginBtn.disabled = loading;

    if (loading) {

        loginBtn.innerHTML =
            `<div class="spinner"></div>`;

    } else {

        loginBtn.textContent =
            "Sign in as Admin";
    }
}


/* =========================
   ADMIN LOGIN
========================= */

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    clearStatus();

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if (!email || !password) {

        showStatus(
            "Please enter your admin email and password."
        );

        return;
    }


    setLoading(true);


    try {

        /*
            STEP 1
            Firebase Authentication
        */

        await setPersistence(
            auth,
            browserLocalPersistence
        );


        const credential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            credential.user;


        /*
            STEP 2
            Get the user's Firestore profile
        */

        const userRef =
            doc(db, "users", user.uid);

        const userSnap =
            await getDoc(userRef);


        /*
            No Firestore profile
        */

        if (!userSnap.exists()) {

            await signOut(auth);

            showStatus(
                "Your Firebase account does not have a Talent Exchange profile."
            );

            setLoading(false);

            return;
        }


        const profile =
            userSnap.data();


        /*
            STEP 3
            Check admin role
        */

        if (profile.role !== "admin") {

            await signOut(auth);

            showStatus(
                "Access denied. This account is not an administrator."
            );

            setLoading(false);

            return;
        }


        /*
            STEP 4
            Check account status
        */

        if (profile.status !== "approved") {

            await signOut(auth);

            showStatus(
                "Admin account is not approved."
            );

            setLoading(false);

            return;
        }


        /*
            STEP 5
            Check disabled account
        */

        if (profile.disabled === true) {

            await signOut(auth);

            showStatus(
                "This administrator account has been disabled."
            );

            setLoading(false);

            return;
        }


        /*
            EVERYTHING IS VALID
        */

        showStatus(
            "Admin authentication successful. Opening dashboard...",
            "success"
        );


        setTimeout(() => {

            window.location.href =
                "./admin-dashboard.html";

        }, 700);


    } catch (error) {

        console.error(
            "ADMIN LOGIN ERROR:",
            error
        );


        /*
            Firebase error handling
        */

        let message =
            "Unable to sign in. Please try again.";


        switch (error.code) {

            case "auth/invalid-credential":

                message =
                    "Invalid email or password. Also verify that Email/Password sign-in is enabled in Firebase Authentication.";

                break;


            case "auth/invalid-email":

                message =
                    "Please enter a valid email address.";

                break;


            case "auth/user-not-found":

                message =
                    "No Firebase Authentication account was found with this email.";

                break;


            case "auth/wrong-password":

                message =
                    "The password is incorrect.";

                break;


            case "auth/too-many-requests":

                message =
                    "Too many login attempts. Please wait and try again.";

                break;


            case "auth/network-request-failed":

                message =
                    "Network error. Please check your internet connection.";

                break;


            case "permission-denied":

                message =
                    "Firebase Firestore permission denied. Check your Firestore rules.";

                break;


            default:

                message =
                    error.message || message;
        }


        showStatus(message);

        setLoading(false);
    }

});


/* =========================
   3D MOUSE EFFECT
========================= */

document.addEventListener("mousemove", (event) => {

    const x =
        (window.innerWidth / 2 - event.clientX) / 45;

    const y =
        (window.innerHeight / 2 - event.clientY) / 45;


    card.style.transform =
        `rotateY(${-x}deg) rotateX(${y}deg)`;
});


document.addEventListener("mouseleave", () => {

    card.style.transform =
        "rotateY(0deg) rotateX(0deg)";
});

</script>

</body>
</html>
