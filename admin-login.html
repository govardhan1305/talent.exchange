<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Talent Exchange — Admin Access</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    overflow:hidden;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 20% 20%,rgba(123,63,255,.20),transparent 32%),
        radial-gradient(circle at 80% 75%,rgba(55,91,255,.15),transparent 30%),
        #040407;
}

/* =========================
   BACKGROUND
========================= */

.scene{
    position:fixed;
    inset:0;
    overflow:hidden;
    perspective:1000px;
}

.grid{
    position:absolute;
    width:160%;
    height:160%;
    left:-30%;
    top:35%;
    transform:rotateX(70deg);
    background-image:
        linear-gradient(rgba(145,90,255,.10) 1px,transparent 1px),
        linear-gradient(90deg,rgba(145,90,255,.10) 1px,transparent 1px);
    background-size:65px 65px;
    mask-image:linear-gradient(to top,transparent,#000 35%,transparent);
    opacity:.35;
}

/* FLOATING 3D OBJECTS */

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(.2px);
    transform-style:preserve-3d;
}

.orb.one{
    width:230px;
    height:230px;
    left:8%;
    top:12%;
    background:
        radial-gradient(circle at 30% 25%,#d6c4ff,transparent 8%),
        radial-gradient(circle at 40% 35%,#7b43ff,transparent 45%),
        #19083d;
    box-shadow:
        inset -35px -30px 60px rgba(0,0,0,.6),
        0 0 80px rgba(123,67,255,.25);
    animation:float1 7s ease-in-out infinite;
}

.orb.two{
    width:150px;
    height:150px;
    right:9%;
    top:17%;
    background:
        radial-gradient(circle at 35% 30%,#b9c6ff,transparent 8%),
        radial-gradient(circle at 45% 40%,#416dff,transparent 48%),
        #07143c;
    box-shadow:
        inset -30px -25px 45px rgba(0,0,0,.6),
        0 0 65px rgba(70,100,255,.22);
    animation:float2 8s ease-in-out infinite;
}

.orb.three{
    width:90px;
    height:90px;
    left:18%;
    bottom:10%;
    background:linear-gradient(135deg,#a06cff,#281052);
    box-shadow:0 0 45px rgba(150,80,255,.25);
    animation:float3 6s ease-in-out infinite;
}

@keyframes float1{
    0%,100%{transform:translate3d(0,0,0) rotateY(0)}
    50%{transform:translate3d(25px,-30px,80px) rotateY(25deg)}
}

@keyframes float2{
    0%,100%{transform:translate3d(0,0,0) rotateX(0)}
    50%{transform:translate3d(-25px,35px,60px) rotateX(25deg)}
}

@keyframes float3{
    0%,100%{transform:translateY(0) rotate(0)}
    50%{transform:translateY(-30px) rotate(180deg)}
}

/* PARTICLES */

.particles{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.particle{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#bda6ff;
    opacity:.5;
    animation:twinkle 4s infinite ease-in-out;
}

@keyframes twinkle{
    0%,100%{opacity:.15;transform:scale(.7)}
    50%{opacity:.8;transform:scale(1.5)}
}

/* =========================
   HEADER
========================= */

.header{
    position:absolute;
    top:30px;
    left:40px;
    z-index:10;
    letter-spacing:.5px;
}

.brand{
    font-size:20px;
    font-weight:800;
}

.brand span{
    color:#a478ff;
}

.admin-label{
    margin-top:5px;
    color:#777;
    font-size:10px;
    letter-spacing:3px;
}

/* =========================
   LOGIN
========================= */

.wrapper{
    position:relative;
    z-index:5;
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.card{
    width:min(430px,100%);
    padding:42px 38px;
    position:relative;
    border-radius:28px;
    border:1px solid rgba(255,255,255,.11);
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );
    backdrop-filter:blur(30px);
    box-shadow:
        0 35px 100px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.08);
    transform-style:preserve-3d;
    transition:transform .15s ease;
}

.card::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:28px;
    padding:1px;
    background:linear-gradient(
        130deg,
        rgba(157,103,255,.6),
        transparent 35%,
        transparent 65%,
        rgba(70,100,255,.4)
    );
    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
}

.card-icon{
    width:65px;
    height:65px;
    margin-bottom:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:19px;
    background:
        linear-gradient(
            145deg,
            rgba(151,92,255,.35),
            rgba(56,74,190,.18)
        );
    border:1px solid rgba(180,140,255,.2);
    box-shadow:
        0 15px 40px rgba(100,60,255,.18),
        inset 0 1px 0 rgba(255,255,255,.15);
    transform:translateZ(35px);
}

.lock{
    width:25px;
    height:21px;
    position:relative;
    border:2px solid #c5adff;
    border-radius:5px;
}

.lock::before{
    content:"";
    position:absolute;
    width:13px;
    height:13px;
    left:4px;
    top:-12px;
    border:2px solid #c5adff;
    border-bottom:0;
    border-radius:9px 9px 0 0;
}

.lock::after{
    content:"";
    position:absolute;
    width:4px;
    height:8px;
    left:9px;
    top:5px;
    border-radius:5px;
    background:#c5adff;
}

h1{
    font-size:32px;
    line-height:1.1;
    margin-bottom:9px;
    transform:translateZ(25px);
}

.subtitle{
    color:#85858f;
    font-size:13px;
    margin-bottom:30px;
    transform:translateZ(20px);
}

/* INPUTS */

.field{
    margin-bottom:17px;
    transform:translateZ(18px);
}

label{
    display:block;
    margin-bottom:7px;
    color:#aaa;
    font-size:11px;
    letter-spacing:.5px;
}

input{
    width:100%;
    height:48px;
    padding:0 15px;
    outline:none;
    border-radius:12px;
    color:#fff;
    border:1px solid rgba(255,255,255,.09);
    background:rgba(0,0,0,.24);
    transition:.25s;
}

input::placeholder{
    color:#555;
}

input:focus{
    border-color:rgba(145,95,255,.7);
    box-shadow:
        0 0 0 3px rgba(120,70,255,.08),
        0 0 25px rgba(120,70,255,.08);
}

/* BUTTON */

.login-btn{
    width:100%;
    height:50px;
    margin-top:8px;
    border-radius:13px;
    color:#fff;
    font-weight:700;
    letter-spacing:.3px;
    background:
        linear-gradient(
            100deg,
            #7138d9,
            #4c5ce8
        );
    box-shadow:
        0 12px 30px rgba(91,61,220,.25),
        inset 0 1px 0 rgba(255,255,255,.18);
    transition:.25s;
    transform:translateZ(25px);
}

.login-btn:hover{
    transform:translateZ(35px) translateY(-2px);
    box-shadow:
        0 18px 40px rgba(91,61,220,.38);
}

.login-btn:active{
    transform:translateZ(20px);
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* ERROR */

.error{
    min-height:18px;
    margin-top:14px;
    color:#ff7d91;
    text-align:center;
    font-size:12px;
}

/* BACK */

.back{
    display:block;
    margin-top:22px;
    color:#777;
    text-align:center;
    text-decoration:none;
    font-size:12px;
    transition:.2s;
}

.back:hover{
    color:#bda5ff;
}

/* LOADING */

.loading{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    border-radius:28px;
    background:rgba(5,5,8,.82);
    backdrop-filter:blur(8px);
    z-index:20;
}

.loading.show{
    display:flex;
}

.spinner{
    width:30px;
    height:30px;
    border:3px solid rgba(255,255,255,.12);
    border-top-color:#9c70ff;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* MOBILE */

@media(max-width:600px){

    .header{
        top:20px;
        left:20px;
    }

    .wrapper{
        padding:20px;
    }

    .card{
        padding:32px 25px;
    }

    h1{
        font-size:28px;
    }

    .orb.one{
        width:150px;
        height:150px;
        left:-50px;
    }

    .orb.two{
        width:100px;
        height:100px;
        right:-30px;
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="grid"></div>

    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>

    <div id="particles" class="particles"></div>

</div>


<div class="header">

    <div class="brand">
        Talent <span>Exchange</span>
    </div>

    <div class="admin-label">
        ADMINISTRATOR ACCESS
    </div>

</div>


<div class="wrapper">

    <div id="card" class="card">

        <div id="loading" class="loading">
            <div class="spinner"></div>
        </div>

        <div class="card-icon">
            <div class="lock"></div>
        </div>

        <h1>Admin Access</h1>

        <p class="subtitle">
            Secure management portal for Talent Exchange
        </p>


        <form id="loginForm">

            <div class="field">

                <label for="email">
                    ADMIN EMAIL
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter admin email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    PASSWORD
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                id="loginBtn"
                class="login-btn"
                type="submit"
            >
                Enter Admin Dashboard
            </button>

            <div
                id="error"
                class="error"
            ></div>

        </form>


        <a
            class="back"
            href="login.html"
        >
            ← Back to User Login
        </a>

    </div>

</div>


<script type="module">

import {
    auth,
    db
} from "./js/firebase-config.js";

import {
    signInWithEmailAndPassword,
    setPersistence,
    browserLocalPersistence,
    signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* =========================
   PARTICLES
========================= */

const particleContainer =
    document.getElementById("particles");

for(let i = 0; i < 65; i++){

    const particle =
        document.createElement("div");

    particle.className =
        "particle";

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.top =
        Math.random() * 100 + "%";

    particle.style.animationDelay =
        Math.random() * 4 + "s";

    particle.style.animationDuration =
        (3 + Math.random() * 4) + "s";

    particleContainer.appendChild(
        particle
    );
}


/* =========================
   3D CARD MOUSE EFFECT
========================= */

const card =
    document.getElementById("card");


document.addEventListener(
    "mousemove",
    event => {

        const x =
            (event.clientX /
            window.innerWidth -
            .5);

        const y =
            (event.clientY /
            window.innerHeight -
            .5);

        const rotateX =
            y * -7;

        const rotateY =
            x * 9;

        card.style.transform =
            `
            rotateX(${rotateX}deg)
            rotateY(${rotateY}deg)
            translateZ(0)
            `;

    }
);


document.addEventListener(
    "mouseleave",
    () => {

        card.style.transform =
            "rotateX(0deg) rotateY(0deg)";

    }
);


/* =========================
   ELEMENTS
========================= */

const form =
    document.getElementById(
        "loginForm"
    );

const errorBox =
    document.getElementById(
        "error"
    );

const loading =
    document.getElementById(
        "loading"
    );

const loginBtn =
    document.getElementById(
        "loginBtn"
    );


/* =========================
   LOGIN
========================= */

form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        errorBox.textContent =
            "";

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;


        if(!email || !password){

            errorBox.textContent =
                "Enter your admin email and password.";

            return;

        }


        loading.classList.add(
            "show"
        );

        loginBtn.disabled =
            true;


        try{

            await setPersistence(
                auth,
                browserLocalPersistence
            );


            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const uid =
                credential.user.uid;


            const userRef =
                doc(
                    db,
                    "users",
                    uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if(!userSnap.exists()){

                await signOut(auth);

                throw new Error(
                    "Admin profile not found in Firestore."
                );

            }


            const userData =
                userSnap.data();


            if(
                userData.role !==
                "admin"
            ){

                await signOut(auth);

                throw new Error(
                    "This account does not have administrator access."
                );

            }


            if(
                userData.status ===
                "disabled"
            ){

                await signOut(auth);

                throw new Error(
                    "This administrator account is disabled."
                );

            }


            localStorage.setItem(
                "adminLoggedIn",
                "true"
            );


            localStorage.setItem(
                "adminUser",
                JSON.stringify({
                    uid,
                    email:
                        credential.user.email,
                    name:
                        userData.name ||
                        "Administrator",
                    role:
                        userData.role,
                    status:
                        userData.status ||
                        "approved"
                })
            );


            window.location.href =
                "admin-dashboard.html";

        }
        catch(error){

            console.error(
                "ADMIN LOGIN ERROR:",
                error
            );


            let message =
                "Unable to sign in.";


            if(
                error.code ===
                "auth/invalid-credential"
            ){

                message =
                    "Invalid email or password.";

            }
            else if(
                error.code ===
                "auth/user-not-found"
            ){

                message =
                    "Admin account was not found.";

            }
            else if(
                error.code ===
                "auth/wrong-password"
            ){

                message =
                    "Incorrect password.";

            }
            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                message =
                    "Too many attempts. Try again later.";

            }
            else if(
                error.message
            ){

                message =
                    error.message;

            }


            errorBox.textContent =
                message;

        }
        finally{

            loading.classList.remove(
                "show"
            );

            loginBtn.disabled =
                false;

        }

    }
);

</script>

</body>
</html>
```
