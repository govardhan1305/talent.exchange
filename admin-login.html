<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Talent Exchange</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;

    background:
        radial-gradient(
            circle at top left,
            rgba(124,58,237,.18),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            rgba(91,33,182,.16),
            transparent 35%
        ),
        #07070b;

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.brand{
    text-align:center;
    margin-bottom:28px;
}

.brand h1{
    font-size:30px;
    letter-spacing:.5px;
}

.brand p{
    margin-top:7px;
    color:#999;
    font-size:14px;
}

.card{
    background:rgba(18,18,25,.94);

    border:1px solid rgba(255,255,255,.08);

    border-radius:20px;

    padding:32px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.45);

    backdrop-filter:blur(15px);
}

.admin-badge{
    width:58px;
    height:58px;

    margin:0 auto 20px;

    border-radius:16px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(124,58,237,.15);

    border:1px solid rgba(124,58,237,.35);

    font-size:24px;
    font-weight:bold;
}

h2{
    text-align:center;
    font-size:24px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#8e8e98;
    font-size:14px;
    margin-bottom:28px;
}

.field{
    margin-bottom:18px;
}

label{
    display:block;
    font-size:13px;
    color:#c8c8d0;
    margin-bottom:8px;
}

input{
    width:100%;

    padding:14px 15px;

    border-radius:11px;

    border:1px solid #292934;

    background:#101017;

    color:#fff;

    outline:none;

    font-size:14px;

    transition:.2s;
}

input:focus{
    border-color:#7c3aed;

    box-shadow:
        0 0 0 3px rgba(124,58,237,.12);
}

.password-wrap{
    position:relative;
}

.password-wrap input{
    padding-right:70px;
}

.show-btn{
    position:absolute;

    right:10px;
    top:50%;

    transform:translateY(-50%);

    background:none;
    border:none;

    color:#9b7bea;

    cursor:pointer;

    font-size:12px;
}

.login-btn{
    width:100%;

    border:none;

    border-radius:11px;

    padding:14px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #5b21b6
        );

    color:white;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    margin-top:5px;

    transition:.2s;
}

.login-btn:hover{
    transform:translateY(-1px);

    box-shadow:
        0 10px 25px rgba(124,58,237,.25);
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.message{
    display:none;

    margin-top:16px;

    padding:12px;

    border-radius:10px;

    font-size:13px;

    text-align:center;

    line-height:1.5;
}

.message.error{
    display:block;

    background:
        rgba(220,38,38,.12);

    border:
        1px solid rgba(220,38,38,.25);

    color:#fca5a5;
}

.message.success{
    display:block;

    background:
        rgba(34,197,94,.12);

    border:
        1px solid rgba(34,197,94,.25);

    color:#86efac;
}

.back{
    display:block;

    text-align:center;

    margin-top:22px;

    color:#8e8e98;

    text-decoration:none;

    font-size:13px;
}

.back:hover{
    color:#b18cff;
}

.security-note{
    margin-top:20px;

    padding:12px;

    border-radius:10px;

    background:#0d0d13;

    border:1px solid #20202a;

    color:#777783;

    font-size:11px;

    line-height:1.5;

    text-align:center;
}

@media(max-width:480px){

    .card{
        padding:25px 20px;
    }

    .brand h1{
        font-size:26px;
    }

}

</style>

</head>


<body>


<div class="container">


    <div class="brand">

        <h1>Talent Exchange</h1>

        <p>
            Skill sharing platform
        </p>

    </div>


    <div class="card">


        <div class="admin-badge">
            A
        </div>


        <h2>
            Admin Login
        </h2>


        <p class="subtitle">
            Sign in to manage the Talent Exchange platform
        </p>


        <form id="adminLoginForm">


            <div class="field">

                <label for="email">
                    Admin Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>


                <div class="password-wrap">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter admin password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-btn"
                        id="showPassword"
                    >
                        Show
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                Sign In as Admin
            </button>


            <div
                id="message"
                class="message"
            ></div>


        </form>


        <div class="security-note">

            Admin access is restricted to authorized
            administrators. Your account must have
            an admin role.

        </div>


        <a
            href="login.html"
            class="back"
        >
            ← Back to User Login
        </a>


    </div>


</div>



<!-- ==========================================
     FIREBASE ADMIN LOGIN
========================================== -->

<script type="module">


/* ==========================================
   FIREBASE IMPORTS
========================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



/* ==========================================
   FIREBASE CONFIG
========================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyArReAuSxobQHOprk87Fte6NmJSVAKcND0",

    authDomain:
        "talent-exchange-4456e.firebaseapp.com",

    projectId:
        "talent-exchange-4456e",

    storageBucket:
        "talent-exchange-4456e.firebasestorage.app",

    messagingSenderId:
        "617029447041",

    appId:
        "1:617029447041:web:35beb28f9949e2fb594c80"

};



/* ==========================================
   INITIALIZE FIREBASE
========================================== */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);



/* ==========================================
   ELEMENTS
========================================== */

const form =
    document.getElementById("adminLoginForm");


const emailInput =
    document.getElementById("email");


const passwordInput =
    document.getElementById("password");


const showPassword =
    document.getElementById("showPassword");


const message =
    document.getElementById("message");


const loginButton =
    document.getElementById("loginButton");



/* ==========================================
   SHOW / HIDE PASSWORD
========================================== */

showPassword.addEventListener(
    "click",
    function(){

        if(
            passwordInput.type ===
            "password"
        ){

            passwordInput.type =
                "text";

            showPassword.textContent =
                "Hide";

        }
        else{

            passwordInput.type =
                "password";

            showPassword.textContent =
                "Show";

        }

    }
);



/* ==========================================
   MESSAGE FUNCTION
========================================== */

function showMessage(
    text,
    type
){

    message.className =
        "message " + type;

    message.textContent =
        text;

}



/* ==========================================
   ADMIN LOGIN
========================================== */

form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const email =
            emailInput.value
            .trim()
            .toLowerCase();


        const password =
            passwordInput.value;


        if(
            email === "" ||
            password === ""
        ){

            showMessage(
                "Please enter email and password.",
                "error"
            );

            return;

        }


        loginButton.disabled =
            true;

        loginButton.textContent =
            "Checking...";


        try{

            /* ==================================
               FIREBASE AUTHENTICATION
            ================================== */

            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const uid =
                credential.user.uid;



            /* ==================================
               GET USER PROFILE
            ================================== */

            const userRef =
                doc(
                    db,
                    "users",
                    uid
                );


            const userSnap =
                await getDoc(userRef);



            if(
                !userSnap.exists()
            ){

                await signOut(auth);

                showMessage(
                    "Admin profile not found in Firestore.",
                    "error"
                );

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Sign In as Admin";

                return;

            }



            const userData =
                userSnap.data();



            /* ==================================
               CHECK ADMIN ROLE
            ================================== */

            if(
                userData.role !==
                "admin"
            ){

                await signOut(auth);

                showMessage(
                    "Access denied. This account is not an administrator.",
                    "error"
                );

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Sign In as Admin";

                return;

            }



            /* ==================================
               CHECK ACCOUNT STATUS
            ================================== */

            if(
                userData.status ===
                "disabled"
            ){

                await signOut(auth);

                showMessage(
                    "This admin account has been disabled.",
                    "error"
                );

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Sign In as Admin";

                return;

            }



            /* ==================================
               SAVE ADMIN SESSION
            ================================== */

            const adminProfile = {

                uid:
                    uid,

                name:
                    userData.name ||
                    "Talent Exchange Admin",

                email:
                    userData.email ||
                    credential.user.email,

                role:
                    "admin"

            };


            localStorage.setItem(
                "adminProfile",
                JSON.stringify(adminProfile)
            );


            localStorage.setItem(
                "adminLoggedIn",
                "true"
            );



            /* ==================================
               SUCCESS
            ================================== */

            showMessage(
                "Login successful. Opening admin dashboard...",
                "success"
            );


            setTimeout(
                function(){

                    window.location.href =
                        "admin-dashboard.html";

                },
                700
            );


        }
        catch(error){

            console.error(
                "Admin login error:",
                error
            );


            let errorMessage =
    error.code + " — " + error.message;


            if(
                error.code ===
                "auth/invalid-credential"
            ){

                errorMessage.textContent = error.code + " — " + error.message;
console.error(error);
            }
            else if(
                error.code ===
                "auth/user-not-found"
            ){

                errorMessage =
                    "No account found with this email.";

            }
            else if(
                error.code ===
                "auth/wrong-password"
            ){

                errorMessage =
                    "Incorrect password.";

            }
            else if(
                error.code ===
                "auth/invalid-email"
            ){

                errorMessage =
                    "Please enter a valid email address.";

            }
            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                errorMessage =
                    "Too many attempts. Please try again later.";

            }
            else if(
                error.code ===
                "permission-denied"
            ){

                errorMessage =
                    "Firestore permission denied. Check your Firestore rules.";

            }


            showMessage(
                errorMessage,
                "error"
            );


            loginButton.disabled =
                false;

            loginButton.textContent =
                "Sign In as Admin";

        }

    }
);



/* ==========================================
   CHECK EXISTING AUTH SESSION
========================================== */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){
            return;
        }


        /*
         If a user is already logged in,
         check whether they are actually admin.
        */

        try{

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(userRef);


            if(
                userSnap.exists()
            ){

                const data =
                    userSnap.data();


                if(
                    data.role ===
                    "admin"
                ){

                    localStorage.setItem(
                        "adminProfile",
                        JSON.stringify({

                            uid:
                                user.uid,

                            name:
                                data.name ||
                                "Talent Exchange Admin",

                            email:
                                data.email ||
                                user.email,

                            role:
                                "admin"

                        })
                    );


                    localStorage.setItem(
                        "adminLoggedIn",
                        "true"
                    );

                }

            }

        }
        catch(error){

            console.log(
                "Session check:",
                error
            );

        }

    }
);


</script>

</body>

</html>
