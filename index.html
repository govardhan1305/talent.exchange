<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Talent Exchange</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#020207;
    color:white;
}

/* =========================
   SPLASH
========================= */

#splash{
    position:fixed;
    inset:0;
    z-index:9999;
    overflow:hidden;
    background:
        radial-gradient(circle at center,
        #17103a 0%,
        #08051b 28%,
        #020207 65%,
        #000 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    perspective:1200px;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* Stars */

.stars{
    position:absolute;
    inset:0;
    background-image:
        radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1px),
        radial-gradient(circle,rgba(130,80,255,.7) 1px,transparent 1px);
    background-size:90px 90px,140px 140px;
    animation:starMove 12s linear infinite;
    opacity:.35;
}

@keyframes starMove{
    from{
        transform:translateY(0) scale(1);
    }
    to{
        transform:translateY(-180px) scale(1.15);
    }
}

/* Energy glow */

.energy{
    position:absolute;
    width:20px;
    height:20px;
    border-radius:50%;
    background:white;
    box-shadow:
        0 0 20px #fff,
        0 0 60px #7c3cff,
        0 0 130px #5b21ff,
        0 0 250px #3210ff;
    animation:
        energyAppear 1s ease forwards,
        energyPulse 1.5s ease-in-out infinite 1s;
}

@keyframes energyAppear{
    from{
        transform:scale(0);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes energyPulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(2);
    }
}

/* Rings */

.ring{
    position:absolute;
    width:420px;
    height:420px;
    border-radius:50%;
    border:1px solid rgba(130,80,255,.5);
    box-shadow:
        0 0 25px rgba(100,50,255,.5),
        inset 0 0 25px rgba(100,50,255,.25);
    opacity:0;
    transform:rotateX(70deg) scale(.1);
}

.ring1{
    animation:ringIn 1.4s ease forwards 1s,
              ringRotate 8s linear infinite 2.4s;
}

.ring2{
    width:600px;
    height:600px;
    border-color:rgba(0,200,255,.25);
    animation:ringIn 1.6s ease forwards 1.2s,
              ringRotate2 12s linear infinite 2.8s;
}

@keyframes ringIn{
    to{
        opacity:1;
        transform:rotateX(70deg) scale(1);
    }
}

@keyframes ringRotate{
    to{
        transform:rotateX(70deg) rotateZ(360deg);
    }
}

@keyframes ringRotate2{
    to{
        transform:rotateX(70deg) rotateZ(-360deg);
    }
}

/* Main logo */

.logoScene{
    position:relative;
    z-index:10;
    text-align:center;
    transform-style:preserve-3d;
    animation:logoEntrance 1.2s cubic-bezier(.16,1,.3,1) forwards 1.5s;
    opacity:0;
}

@keyframes logoEntrance{
    0%{
        opacity:0;
        transform:
            translateZ(-800px)
            rotateX(35deg)
            scale(.2);
        filter:blur(20px);
    }

    70%{
        opacity:1;
        transform:
            translateZ(80px)
            rotateX(-5deg)
            scale(1.08);
        filter:blur(0);
    }

    100%{
        opacity:1;
        transform:
            translateZ(0)
            rotateX(0)
            scale(1);
    }
}

/* Logo symbol */

.symbol{
    width:80px;
    height:80px;
    margin:0 auto 25px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:50px;
    font-weight:900;

    color:white;

    border-radius:22px;

    background:
        linear-gradient(135deg,
        #7c3cff,
        #3210ff 50%,
        #00c8ff);

    box-shadow:
        0 0 20px #713cff,
        0 0 70px rgba(100,50,255,.8),
        inset 0 0 20px rgba(255,255,255,.3);

    transform:rotateX(15deg) rotateY(-15deg);

    animation:symbolFloat 3s ease-in-out infinite;
}

@keyframes symbolFloat{
    0%,100%{
        transform:
            rotateX(15deg)
            rotateY(-15deg)
            translateY(0);
    }

    50%{
        transform:
            rotateX(-15deg)
            rotateY(15deg)
            translateY(-10px);
    }
}

/* Main title */

.title{
    font-size:clamp(42px,7vw,92px);
    font-weight:900;
    letter-spacing:12px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #a78bfa,
            #60a5fa,
            #ffffff
        );

    background-size:300% auto;

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    text-shadow:
        0 0 25px rgba(124,58,237,.7),
        0 0 70px rgba(59,130,246,.35);

    animation:textShine 4s linear infinite;
}

@keyframes textShine{
    to{
        background-position:300% center;
    }
}

.subtitle{
    margin-top:14px;
    font-size:clamp(12px,1.5vw,18px);
    letter-spacing:8px;
    color:#c4b5fd;
    opacity:.9;
}

/* Signature */

.signature{
    margin-top:25px;
    font-size:13px;
    letter-spacing:4px;
    color:#aaa;
}

/* Portal */

.portal{
    position:absolute;
    width:900px;
    height:900px;
    border-radius:50%;

    border:2px solid rgba(124,58,237,.25);

    box-shadow:
        0 0 60px #4c1d95,
        inset 0 0 100px rgba(99,102,241,.2);

    animation:
        portalSpin 8s linear infinite,
        portalPulse 2s ease-in-out infinite;

    opacity:.7;
}

.portal:before,
.portal:after{
    content:"";
    position:absolute;
    inset:8%;
    border-radius:50%;
    border:1px solid rgba(96,165,250,.25);
}

.portal:after{
    inset:20%;
    border-color:rgba(168,85,247,.35);
}

@keyframes portalSpin{
    to{
        transform:rotateZ(360deg);
    }
}

@keyframes portalPulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.04);
    }
}

/* Bottom text */

.loading{
    position:absolute;
    bottom:35px;
    left:50%;
    transform:translateX(-50%);
    font-size:10px;
    letter-spacing:5px;
    color:#777;
}

/* =========================
   MAIN PAGE
========================= */

#main{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(circle at 20% 20%,#21104a,transparent 35%),
        radial-gradient(circle at 80% 80%,#101d4a,transparent 35%),
        #050509;

    opacity:0;
    transform:scale(1.08);
    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}

#main.show{
    opacity:1;
    transform:scale(1);
}

.loginBox{
    width:min(430px,90%);
    padding:45px;
    border-radius:28px;

    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(25px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.6),
        0 0 50px rgba(99,50,255,.18);

    text-align:center;
}

.loginBox h1{
    font-size:32px;
    margin-bottom:10px;
}

.loginBox p{
    color:#aaa;
    margin-bottom:30px;
}

.btn{
    width:100%;
    padding:16px;
    margin-top:12px;

    border-radius:14px;
    border:1px solid rgba(255,255,255,.15);

    background:linear-gradient(
        135deg,
        #7c3cff,
        #4f21d8
    );

    color:white;
    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    transition:.3s;
}

.btn:hover{
    transform:translateY(-4px) scale(1.02);

    box-shadow:
        0 15px 40px rgba(124,58,237,.4);
}

.btn.secondary{
    background:rgba(255,255,255,.05);
}

/* Mobile */

@media(max-width:600px){

    .title{
        letter-spacing:5px;
        font-size:42px;
    }

    .subtitle{
        letter-spacing:4px;
    }

    .ring{
        width:300px;
        height:300px;
    }

    .portal{
        width:500px;
        height:500px;
    }

    .loginBox{
        padding:30px 22px;
    }
}
</style>
</head>

<body>

<!-- =========================
     SPLASH SCREEN
========================= -->

<section id="splash">

    <div class="stars"></div>

    <canvas id="particles"></canvas>

    <div class="portal"></div>

    <div class="ring ring1"></div>
    <div class="ring ring2"></div>

    <div class="energy"></div>

    <div class="logoScene">

        <div class="symbol">TX</div>

        <div class="title">
            TALENT
        </div>

        <div class="title">
            EXCHANGE
        </div>

        <div class="subtitle">
            CONNECT • SHARE • LEARN
        </div>

        <div class="signature">
            MADE BY GOVARDHAN
        </div>

    </div>

    <div class="loading">
        ENTERING THE TALENT UNIVERSE
    </div>

</section>


<!-- =========================
     MAIN PAGE
========================= -->

<section id="main">

    <div class="loginBox">

        <div style="
            font-size:50px;
            margin-bottom:15px;
            filter:drop-shadow(0 0 20px #7c3cff);
        ">
            TX
        </div>

        <h1>
            Talent Exchange
        </h1>

        <p>
            Connect. Share. Learn.
        </p>

        <button
            class="btn"
            onclick="location.href='login.html'">
            Login
        </button>

        <button
            class="btn secondary"
            onclick="location.href='register.html'">
            Create Account
        </button>

    </div>

</section>


<script>

/* ==================================
   PARTICLE UNIVERSE
================================== */

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let particles = [];

function resize(){

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

resize();

window.addEventListener("resize",resize);


/* Create particles */

for(let i=0;i<900;i++){

    particles.push({

        x:(Math.random()-.5)*window.innerWidth*2,

        y:(Math.random()-.5)*window.innerHeight*2,

        z:Math.random()*2000,

        size:Math.random()*2+0.5,

        speed:Math.random()*2+0.5

    });

}


/* Mouse */

let mouseX=0;
let mouseY=0;

window.addEventListener("mousemove",e=>{

    mouseX=(e.clientX-window.innerWidth/2)*0.0005;
    mouseY=(e.clientY-window.innerHeight/2)*0.0005;

});


/* Animation */

function animate(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const cx=canvas.width/2;
    const cy=canvas.height/2;

    for(const p of particles){

        p.z-=p.speed*8;

        if(p.z<1){

            p.z=2000;

            p.x=(Math.random()-.5)*
                window.innerWidth*2;

            p.y=(Math.random()-.5)*
                window.innerHeight*2;

        }

        const scale=500/p.z;

        const x=
            cx+
            p.x*scale+
            mouseX*p.z;

        const y=
            cy+
            p.y*scale+
            mouseY*p.z;

        const size=
            Math.max(.2,p.size*scale*2);

        const opacity=
            Math.min(1,(2000-p.z)/900);

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            size,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
            `rgba(140,100,255,${opacity})`;

        ctx.fill();

    }

    requestAnimationFrame(animate);

}

animate();


/* ==================================
   SPLASH → MAIN TRANSITION
================================== */

setTimeout(()=>{

    document.getElementById("splash")
        .style.transition="opacity 1.2s ease, transform 1.2s ease";

    document.getElementById("splash")
        .style.opacity="0";

    document.getElementById("splash")
        .style.transform="scale(1.8)";

    document.getElementById("main")
        .classList.add("show");

    setTimeout(()=>{

        document.getElementById("splash")
            .remove();

        document.body.style.overflow="auto";

    },1300);

},4500);

</script>

</body>
</html>
