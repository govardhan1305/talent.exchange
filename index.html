<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#000000">

<title>Talent Exchange</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
}

/* =========================
   SPLASH SCREEN
========================= */

.splash {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(110, 60, 255, 0.13),
            transparent 38%
        ),
        #000;

    perspective: 900px;
}

/* Purple ambient glow */

.splash::before {
    content: "";

    position: absolute;

    width: 55vw;
    height: 55vw;

    max-width: 280px;
    max-height: 280px;

    border-radius: 50%;

    background: rgba(115, 60, 255, 0.08);

    filter: blur(55px);

    animation:
        ambientGlow 4s ease-in-out infinite;
}


/* =========================
   CONTENT
========================= */

.content {
    position: relative;

    z-index: 2;

    text-align: center;

    transform-style: preserve-3d;

    opacity: 0;

    animation:
        contentEnter
        1.2s
        cubic-bezier(.16,1,.3,1)
        forwards
        0.25s;
}


/* =========================
   TITLE
========================= */

.title {
    position: relative;

    color: #ffffff;

    font-size: clamp(34px, 9vw, 58px);

    font-weight: 700;

    letter-spacing: -1.8px;

    line-height: 1.05;

    white-space: nowrap;

    text-shadow:
        0 1px 0 rgba(255,255,255,.15),
        0 8px 25px rgba(120,60,255,.18);

    transform: translateZ(45px);

    animation:
        titleFloat
        3s
        ease-in-out
        infinite
        1.4s;
}


/* 3D depth */

.title::before {
    content: "Talent Exchange";

    position: absolute;

    inset: 0;

    color: rgba(120, 70, 255, 0.18);

    transform:
        translate3d(0, 7px, -15px)
        scale(1.01);

    filter: blur(1px);

    z-index: -1;
}


/* =========================
   CREDIT
========================= */

.credit {
    margin-top: 13px;

    color: #777777;

    font-size: clamp(12px, 3.2vw, 14px);

    font-weight: 400;

    letter-spacing: 0.4px;

    transform: translateZ(25px);

    opacity: 0;

    animation:
        creditEnter
        0.9s
        ease
        forwards
        0.9s;
}


/* =========================
   ACCENT LINE
========================= */

.line {
    width: 0;

    height: 1px;

    margin: 15px auto 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(150,100,255,.8),
            transparent
        );

    animation:
        lineEnter
        0.8s
        ease
        forwards
        1.35s;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes contentEnter {

    0% {
        opacity: 0;

        transform:
            translateY(18px)
            rotateX(14deg)
            scale(.94);
    }

    60% {
        opacity: 1;
    }

    100% {
        opacity: 1;

        transform:
            translateY(0)
            rotateX(0)
            scale(1);
    }
}


@keyframes titleFloat {

    0%,
    100% {
        transform:
            translateZ(45px)
            translateY(0);
    }

    50% {
        transform:
            translateZ(45px)
            translateY(-3px);
    }
}


@keyframes creditEnter {

    from {
        opacity: 0;

        transform:
            translateZ(25px)
            translateY(8px);
    }

    to {
        opacity: 1;

        transform:
            translateZ(25px)
            translateY(0);
    }
}


@keyframes lineEnter {

    to {
        width: 90px;
    }
}


@keyframes ambientGlow {

    0%,
    100% {
        transform: scale(.9);

        opacity: .5;
    }

    50% {
        transform: scale(1.15);

        opacity: 1;
    }
}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 380px) {

    .title {
        font-size: 31px;

        letter-spacing: -1.3px;
    }

    .credit {
        font-size: 12px;
    }

    .line {
        margin-top: 12px;
    }
}


/* =========================
   NORMAL PHONES
========================= */

@media (min-width: 381px) and (max-width: 600px) {

    .title {
        font-size: 38px;
    }
}


/* =========================
   DESKTOP
========================= */

@media (min-width: 601px) {

    .title {
        font-size: 54px;
    }
}

</style>
</head>


<body>


<!-- =========================
     SPLASH
========================= -->

<div class="splash">

    <div class="content">

        <div class="title">
            Talent Exchange
        </div>

        <div class="credit">
            Made by Govardhan
        </div>

        <div class="line"></div>

    </div>

</div>


</body>
</html>
