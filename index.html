<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talent Exchange</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        .splash {
            position: fixed;
            inset: 0;
            background: #000;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            color: white;

            animation: fadeOut 0.8s ease forwards;
            animation-delay: 2.2s;
        }

        .title {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .creator {
            margin-top: 10px;
            font-size: 13px;
            color: #777;
            letter-spacing: 0.5px;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
                visibility: hidden;
            }
        }
    </style>
</head>

<body>

    <div class="splash">
        <div class="title">Talent Exchange</div>
        <div class="creator">Made by Govardhan</div>
    </div>

    <script>
        setTimeout(() => {
            window.location.replace("login.html");
        }, 2800);
    </script>

</body>
</html>
