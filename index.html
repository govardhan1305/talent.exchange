
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Talent Exchange</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #07070b;
            color: #ffffff;
            overflow: hidden;
        }

        /* =========================================
           SPLASH SCREEN
        ========================================= */

        .splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;

            background: #07070b;

            display: flex;
            align-items: center;
            justify-content: center;

            animation: hideSplash 0.8s ease forwards;
            animation-delay: 2.5s;
        }

        .splash-title {
            font-size: clamp(42px, 7vw, 78px);
            font-weight: 600;
            letter-spacing: -2px;
            text-align: center;

            animation: titleAppear 1.2s ease;
        }

        .made-by {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;

            text-align: center;

            color: #77777f;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* =========================================
           MAIN SCREEN
        ========================================= */

        .main-screen {
            min-height: 100vh;
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(124, 58, 237, 0.10),
                    transparent 45%
                ),
                #07070b;

            opacity: 0;

            animation: showMain 0.8s ease forwards;
            animation-delay: 2.8s;
        }

        .main-content {
            width: 100%;
            max-width: 600px;

            padding: 30px;

            text-align: center;
        }

        .main-title {
            font-size: clamp(38px, 6vw, 62px);
            font-weight: 600;
            letter-spacing: -2px;

            margin-bottom: 14px;
        }

        .description {
            max-width: 470px;

            margin: 0 auto 38px;

            color: #85858f;
            font-size: 14px;
            line-height: 1.7;
        }

        /* =========================================
           BUTTONS
        ========================================= */

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .button {
            width: 150px;

            padding: 13px 20px;

            border-radius: 9px;

            text-decoration: none;

            font-size: 13px;
            font-weight: 600;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .login-button {
            background: #7c3aed;
            color: #ffffff;

            border: 1px solid #7c3aed;
        }

        .login-button:hover {
            background: #6d28d9;
            transform: translateY(-2px);
        }

        .register-button {
            background: transparent;
            color: #ffffff;

            border: 1px solid #363640;
        }

        .register-button:hover {
            background: #15151d;
            border-color: #555560;

            transform: translateY(-2px);
        }

        /* =========================================
           ANIMATIONS
        ========================================= */

        @keyframes titleAppear {

            0% {
                opacity: 0;
                transform: scale(0.96);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes hideSplash {

            0% {
                opacity: 1;
                visibility: visible;
            }

            100% {
                opacity: 0;
                visibility: hidden;
            }
        }

        @keyframes showMain {

            0% {
                opacity: 0;
                transform: translateY(8px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .splash-title {
                font-size: 42px;
                letter-spacing: -1.5px;
                padding: 20px;
            }

            .made-by {
                bottom: 24px;
            }

            .main-content {
                padding: 25px;
            }

            .main-title {
                font-size: 38px;
            }

            .description {
                font-size: 13px;
                margin-bottom: 30px;
            }

            .buttons {
                flex-direction: column;
            }

            .button {
                width: 210px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================
         SPLASH SCREEN
    ========================================= -->

    <div class="splash-screen">

        <div class="splash-title">
            Talent Exchange
        </div>

        <div class="made-by">
            Made by Govardhan
        </div>

    </div>


    <!-- =========================================
         MAIN SCREEN
    ========================================= -->

    <main class="main-screen">

        <div class="main-content">

            <h1 class="main-title">
                Talent Exchange
            </h1>

            <p class="description">
                Share your skills, learn from others,
                and build meaningful connections.
            </p>


            <div class="buttons">

                <a
                    href="login.html"
                    class="button login-button">
                    Login
                </a>

                <a
                    href="register.html"
                    class="button register-button">
                    Register
                </a>

            </div>

        </div>

    </main>


</body>
</html>
```
