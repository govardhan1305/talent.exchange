<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Talent Exchange</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .splash {
            width: 100%;
            height: 100vh;
            background: #000;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        .title {
            color: white;
            font-size: clamp(32px, 7vw, 58px);
            font-weight: 600;
            letter-spacing: -1px;

            opacity: 0;
            transform: translateY(10px);

            animation:
                titleAppear 1s ease forwards,
                titleDisappear 0.8s ease forwards 3s;
        }

        .credit {
            position: absolute;
            bottom: 45px;

            color: #777;
            font-size: 14px;
            letter-spacing: 0.3px;

            opacity: 0;
            transform: translateY(8px);

            animation:
                creditAppear 1s ease forwards 0.5s,
                creditDisappear 0.8s ease forwards 3s;
        }

        @keyframes titleAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes titleDisappear {
            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        @keyframes creditAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes creditDisappear {
            to {
                opacity: 0;
                transform: translateY(8px);
            }
        }
    </style>
</head>

<body>

    <div class="splash">

        <div class="title">
            Talent Exchange
        </div>

        <div class="credit">
            Made by Govardhan
        </div>

    </div>

    <script>
        setTimeout(() => {
            window.location.href = "login.html";
        }, 3800);
    </script>

</body>
</html>
