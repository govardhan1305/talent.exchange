<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talent Exchange</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#03030a;
    color:white;
}

body{
    perspective:1400px;
}

/* BACKGROUND */

.scene{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 42%,rgba(101,45,255,.20),transparent 30%),
        radial-gradient(circle at 15% 80%,rgba(0,140,255,.12),transparent 30%),
        radial-gradient(circle at 85% 20%,rgba(168,65,255,.13),transparent 30%),
        #03030a;
}

/* STARS */

.stars{
    position:absolute;
    inset:0;
    background-image:
        radial-gradient(circle,rgba(255,255,255,.7) 1px,transparent 1px),
        radial-gradient(circle,rgba(140,110,255,.6) 1px,transparent 1px);
    background-size:90px 90px,140px 140px;
    background-position:0 0,40px 30px;
    opacity:.35;
    animation:starsMove 30s linear infinite;
}

@keyframes starsMove{
    from{transform:translateY(0)}
    to{transform:translateY(90px)}
}

/* GLOW */

.glow{
    position:absolute;
    width:700px;
    height:700px;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,
        rgba(108,54,255,.20),
        rgba(54,105,255,.08) 35%,
        transparent 70%);
    filter:blur(20px);
}

/* FLOOR */

.floor{
    position:absolute;
    left:50%;
    bottom:-30%;
    width:150%;
    height:70%;
    transform:
        translateX(-50%)
        perspective(700px)
        rotateX(65deg);

    background:
        linear-gradient(rgba(92,66,255,.18) 1px,transparent 1px),
        linear-gradient(90deg,rgba(92,66,255,.18) 1px,transparent 1px);

    background-size:70px 70px;

    mask-image:linear-gradient(
        to top,
        black,
        transparent
    );

    animation:gridMove 8s linear infinite;
}

@keyframes gridMove{
    from{background-position:0 0,0 0}
    to{background-position:0 70px,70px 0}
}

/* MAIN */

.main{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transform-style:preserve-3d;
}

/* FLOATING OBJECTS */

.float{
    position:absolute;
    width:110px;
    height:70px;
    border:1px solid rgba(160,130,255,.35);
    background:rgba(255,255,255,.025);
    backdrop-filter:blur(12px);
    border-radius:16px;
    box-shadow:
        0 0 30px rgba(98,62,255,.10),
        inset 0 0 20px rgba(255,255,255,.025);
    transform-style:preserve-3d;
    animation:float 5s ease-in-out infinite;
}

.float.one{
    left:9%;
    top:24%;
    transform:rotateY(20deg) rotateX(10deg);
}

.float.two{
    right:9%;
    top:30%;
    animation-delay:1s;
    transform:rotateY(-20deg) rotateX(10deg);
}

.float.three{
    left:15%;
    bottom:20%;
    animation-delay:2s;
}

.float.four{
    right:14%;
    bottom:18%;
    animation-delay:3s;
}

@keyframes float{
    0%,100%{
        translate:0 0;
    }
    50%{
        translate:0 -18px;
    }
}

/* MAIN GLASS CARD */

.card{
    position:relative;
    width:min(680px,88vw);
    min-height:560px;
    padding:55px 45px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.018)
        );

    border:1px solid rgba(190,170,255,.24);

    border-radius:32px;

    backdrop-filter:blur(25px);

    box-shadow:
        0 50px 100px rgba(0,0,0,.6),
        0 0 100px rgba(95,45,255,.18),
        inset 0 1px rgba(255,255,255,.12);

    transform-style:preserve-3d;

    transition:transform .2s ease;
}

/* CARD EDGE */

.card::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:32px;
    padding:1px;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(152,108,255,.6),
            transparent,
            rgba(62,153,255,.4),
            transparent
        );

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

/* ORBITS */

.orbit{
    position:absolute;
    border:1px solid rgba(135,98,255,.45);
    border-radius:50%;
    pointer-events:none;
}

.orbit.one{
    width:820px;
    height:250px;
    transform:rotateX(68deg) rotateZ(-15deg);
    animation:orbitSpin 14s linear infinite;
}

.orbit.two{
    width:720px;
    height:210px;
    transform:rotateX(68deg) rotateZ(35deg);
    animation:orbitSpinReverse 18s linear infinite;
}

@keyframes orbitSpin{
    from{rotate:0deg}
    to{rotate:360deg}
}

@keyframes orbitSpinReverse{
    from{rotate:360deg}
    to{rotate:0deg}
}

/* LOGO */

.logo{
    position:relative;
    transform:translateZ(80px);
    text-align:center;
}

.tx{
    font-size:clamp(90px,15vw,150px);
    font-weight:1000;
    letter-spacing:-14px;

    background:
        linear-gradient(
            135deg,
            #ffffff 0%,
            #bda9ff 35%,
            #7048ff 65%,
            #42aaff 100%
        );

    -webkit-background-clip:text;
    color:transparent;

    filter:
        drop-shadow(0 15px 20px rgba(0,0,0,.6))
        drop-shadow(0 0 35px rgba(111,67,255,.45));

    transform:
        rotateX(8deg)
        rotateY(-8deg);

    animation:logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,100%{
        transform:rotateX(8deg) rotateY(-8deg) translateY(0);
    }
    50%{
        transform:rotateX(8deg) rotateY(-8deg) translateY(-10px);
    }
}

.title{
    margin-top:8px;
    font-size:clamp(30px,5vw,52px);
    font-weight:700;
    letter-spacing:-1px;
    text-shadow:0 0 25px rgba(124,78,255,.35);
}

.tagline{
    margin-top:14px;
    color:#a8a4b9;
    font-size:15px;
    letter-spacing:2px;
}

/* BUTTONS */

.buttons{
    display:flex;
    gap:18px;
    margin-top:42px;
    transform:translateZ(70px);
}

button{
    position:relative;
    border:none;
    cursor:pointer;

    min-width:160px;
    padding:15px 28px;

    border-radius:14px;

    color:white;
    font-size:15px;
    font-weight:700;

    background:
        linear-gradient(
            135deg,
            rgba(116,67,255,.9),
            rgba(55,108,255,.8)
        );

    box-shadow:
        0 15px 35px rgba(75,47,255,.25),
        inset 0 1px rgba(255,255,255,.25);

    transition:.25s;
}

button:hover{
    transform:translateY(-5px) scale(1.04);
    box-shadow:
        0 20px 45px rgba(91,57,255,.4),
        0 0 30px rgba(92,103,255,.2);
}

button.secondary{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(180,160,255,.22);
}

button:active{
    transform:scale(.97);
}

/* MADE BY */

.creator{
    position:absolute;
    bottom:18px;
    font-size:11px;
    color:#686577;
    letter-spacing:2px;
}

/* RESPONSIVE */

@media(max-width:700px){

    .card{
        min-height:520px;
        padding:35px 20px;
        border-radius:25px;
    }

    .orbit.one{
        width:600px;
        height:190px;
    }

    .orbit.two{
        width:520px;
        height:160px;
    }

    .buttons{
        width:100%;
        flex-direction:column;
        gap:12px;
    }

    button{
        width:100%;
    }

    .float{
        opacity:.35;
        transform:scale(.7);
    }

    .float.one{
        left:-20px;
    }

    .float.two{
        right:-20px;
    }

    .float.three,
    .float.four{
        display:none;
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="stars"></div>
    <div class="glow"></div>
    <div class="floor"></div>

    <div class="float one"></div>
    <div class="float two"></div>
    <div class="float three"></div>
    <div class="float four"></div>

    <div class="main">

        <div class="orbit one"></div>
        <div class="orbit two"></div>

        <div class="card" id="card">

            <div class="logo">
                <div class="tx">TX</div>
                <div class="title">Talent Exchange</div>
                <div class="tagline">
                    CONNECT · SHARE · LEARN
                </div>
            </div>

            <div class="buttons">

                <button onclick="goLogin()">
                    Login
                </button>

                <button
                    class="secondary"
                    onclick="goRegister()">
                    Create Account
                </button>

            </div>

            <div class="creator">
                MADE BY GOVARDHAN
            </div>

        </div>

    </div>

</div>

<script>

function goLogin(){
    window.location.href="login.html";
}

function goRegister(){
    window.location.href="register.html";
}


/* 3D MOUSE EFFECT */

const card=document.getElementById("card");

document.addEventListener("mousemove",(e)=>{

    if(window.innerWidth < 700) return;

    const x=(e.clientX/window.innerWidth-.5);
    const y=(e.clientY/window.innerHeight-.5);

    card.style.transform=
        `rotateX(${-y*7}deg) rotateY(${x*9}deg)`;

});


/* TOUCH PARALLAX */

let startX=0;
let startY=0;

document.addEventListener("touchstart",(e)=>{

    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;

},{passive:true});


document.addEventListener("touchmove",(e)=>{

    if(!e.touches.length) return;

    const x=e.touches[0].clientX;
    const y=e.touches[0].clientY;

    const dx=(x-startX)/window.innerWidth;
    const dy=(y-startY)/window.innerHeight;

    card.style.transform=
        `rotateX(${-dy*10}deg) rotateY(${dx*10}deg)`;

},{passive:true});


document.addEventListener("touchend",()=>{

    card.style.transform=
        "rotateX(0deg) rotateY(0deg)";

});

</script>

</body>
</html>
