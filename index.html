<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Talent Exchange</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#020207;
    color:#fff;
}

/* =========================================
   SPLASH
========================================= */

#splash{
    position:fixed;
    inset:0;
    z-index:99999;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            #211052 0%,
            #0b0620 28%,
            #03030b 65%,
            #000 100%
        );

    perspective:1400px;

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}

#particles{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

.stars{
    position:absolute;
    inset:-20%;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.8) 1px,
            transparent 1px
        ),
        radial-gradient(
            circle,
            rgba(120,70,255,.7) 1px,
            transparent 1px
        );

    background-size:
        85px 85px,
        145px 145px;

    opacity:.3;

    animation:starsMove 14s linear infinite;
}

@keyframes starsMove{
    to{
        transform:translate3d(-30px,-160px,0) scale(1.1);
    }
}


/* =========================================
   ENERGY
========================================= */

.energy{
    position:absolute;

    width:18px;
    height:18px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 15px #fff,
        0 0 50px #8b5cf6,
        0 0 100px #7c3aed,
        0 0 220px #4c1d95;

    animation:
        energyAppear 1s ease forwards,
        energyPulse 2s ease-in-out infinite 1s;
}

@keyframes energyAppear{
    from{
        transform:scale(0);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes energyPulse{
    50%{
        transform:scale(2.5);
    }
}


/* =========================================
   RINGS
========================================= */

.ring{
    position:absolute;
    border-radius:50%;

    border:1px solid rgba(139,92,246,.5);

    box-shadow:
        0 0 25px rgba(124,58,237,.5),
        inset 0 0 25px rgba(124,58,237,.2);

    opacity:0;

    transform:
        rotateX(70deg)
        scale(.1);
}

.ring1{
    width:420px;
    height:420px;

    animation:
        ringAppear 1.4s ease forwards 1s,
        ringRotate 8s linear infinite 2.5s;
}

.ring2{
    width:620px;
    height:620px;

    border-color:rgba(0,200,255,.3);

    animation:
        ringAppear 1.6s ease forwards 1.2s,
        ringRotateReverse 12s linear infinite 2.8s;
}

.ring3{
    width:820px;
    height:820px;

    border-color:rgba(255,255,255,.08);

    animation:
        ringAppear 1.8s ease forwards 1.4s,
        ringRotate 18s linear infinite 3s;
}

@keyframes ringAppear{
    to{
        opacity:1;
        transform:
            rotateX(70deg)
            scale(1);
    }
}

@keyframes ringRotate{
    to{
        transform:
            rotateX(70deg)
            rotateZ(360deg);
    }
}

@keyframes ringRotateReverse{
    to{
        transform:
            rotateX(70deg)
            rotateZ(-360deg);
    }
}


/* =========================================
   PORTAL
========================================= */

.portal{
    position:absolute;

    width:900px;
    height:900px;

    border-radius:50%;

    border:2px solid rgba(124,58,237,.25);

    box-shadow:
        0 0 60px #4c1d95,
        0 0 150px rgba(76,29,149,.3),
        inset 0 0 120px rgba(99,102,241,.25);

    opacity:.75;

    animation:
        portalSpin 12s linear infinite,
        portalPulse 3s ease-in-out infinite;
}

.portal:before,
.portal:after{
    content:"";

    position:absolute;

    border-radius:50%;

    border:1px solid rgba(96,165,250,.3);
}

.portal:before{
    inset:8%;
}

.portal:after{
    inset:20%;
    border-color:rgba(168,85,247,.4);
}

@keyframes portalSpin{
    to{
        transform:rotateZ(360deg);
    }
}

@keyframes portalPulse{
    50%{
        scale:1.05;
    }
}


/* =========================================
   SPLASH LOGO
========================================= */

.logoScene{
    position:relative;
    z-index:20;

    text-align:center;

    opacity:0;

    transform-style:preserve-3d;

    animation:
        logoEntrance
        1.4s
        cubic-bezier(.16,1,.3,1)
        forwards
        1.5s;

    transition:transform .25s ease-out;
}

@keyframes logoEntrance{
    0%{
        opacity:0;

        transform:
            translateZ(-900px)
            rotateX(40deg)
            scale(.15);

        filter:blur(30px);
    }

    60%{
        opacity:1;

        transform:
            translateZ(100px)
            rotateX(-8deg)
            scale(1.08);

        filter:blur(0);
    }

    100%{
        opacity:1;

        transform:
            translateZ(0)
            rotateX(0)
            scale(1);
    }
}

.symbol{
    width:82px;
    height:82px;

    margin:0 auto 25px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:22px;

    font-size:44px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #4f21d8 50%,
            #06b6d4
        );

    box-shadow:
        0 0 20px #7c3aed,
        0 0 60px rgba(124,58,237,.7),
        0 0 120px rgba(6,182,212,.3),
        inset 0 0 25px rgba(255,255,255,.3);

    animation:symbolFloat 3s ease-in-out infinite;
}

@keyframes symbolFloat{
    50%{
        transform:
            rotateX(-15deg)
            rotateY(15deg)
            translateY(-12px);
    }
}

.title{
    font-size:clamp(42px,7vw,92px);

    font-weight:900;

    letter-spacing:12px;

    line-height:1.05;

    background:
        linear-gradient(
            90deg,
            #fff,
            #a78bfa,
            #60a5fa,
            #fff
        );

    background-size:300% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    text-shadow:
        0 0 25px rgba(124,58,237,.7),
        0 0 70px rgba(59,130,246,.35);

    animation:textShine 4s linear infinite;
}

@keyframes textShine{
    to{
        background-position:300% center;
    }
}

.subtitle{
    margin-top:18px;

    font-size:clamp(11px,1.5vw,18px);

    letter-spacing:8px;

    color:#c4b5fd;
}

.signature{
    margin-top:25px;

    font-size:12px;

    letter-spacing:4px;

    color:#999;
}

.loading{
    position:absolute;

    bottom:30px;
    left:50%;

    transform:translateX(-50%);

    font-size:9px;

    letter-spacing:5px;

    color:#777;

    white-space:nowrap;
}


/* =========================================
   MAIN 3D UNIVERSE
========================================= */

#main{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    opacity:0;

    transform:scale(1.12);

    background:
        radial-gradient(
            circle at 50% 50%,
            #18103d 0%,
            #09051b 30%,
            #03030a 70%,
            #000 100%
        );

    transition:
        opacity 1.3s ease,
        transform 1.3s ease;
}

#main.show{
    opacity:1;
    transform:scale(1);
}


/* =========================================
   3D BACKGROUND ORBS
========================================= */

.orb{
    position:absolute;

    border-radius:50%;

    filter:blur(2px);

    pointer-events:none;
}

.orb1{
    width:420px;
    height:420px;

    background:
        radial-gradient(
            circle,
            rgba(124,58,237,.3),
            transparent 70%
        );

    top:-100px;
    left:-100px;

    animation:orbFloat1 8s ease-in-out infinite;
}

.orb2{
    width:500px;
    height:500px;

    background:
        radial-gradient(
            circle,
            rgba(37,99,235,.22),
            transparent 70%
        );

    bottom:-180px;
    right:-100px;

    animation:orbFloat2 10s ease-in-out infinite;
}

@keyframes orbFloat1{
    50%{
        transform:translate(80px,60px) scale(1.15);
    }
}

@keyframes orbFloat2{
    50%{
        transform:translate(-80px,-60px) scale(1.2);
    }
}


/* =========================================
   FLOATING HOLOGRAPHIC PANELS
========================================= */

.holo{
    position:absolute;

    width:170px;
    height:110px;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            rgba(124,58,237,.14),
            rgba(37,99,235,.06)
        );

    border:
        1px solid rgba(139,92,246,.28);

    backdrop-filter:blur(10px);

    box-shadow:
        0 0 30px rgba(124,58,237,.12),
        inset 0 0 30px rgba(255,255,255,.03);

    opacity:.5;

    transform-style:preserve-3d;
}

.holo:before{
    content:"";

    position:absolute;

    inset:15px;

    border-radius:10px;

    border:
        1px solid rgba(255,255,255,.08);
}

.holo1{
    left:8%;
    top:25%;

    transform:
        rotateY(30deg)
        rotateX(10deg);

    animation:holoFloat1 7s ease-in-out infinite;
}

.holo2{
    right:7%;
    top:18%;

    transform:
        rotateY(-30deg)
        rotateX(15deg);

    animation:holoFloat2 8s ease-in-out infinite;
}

.holo3{
    left:10%;
    bottom:16%;

    transform:
        rotateY(35deg)
        rotateX(-10deg);

    animation:holoFloat2 9s ease-in-out infinite;
}

.holo4{
    right:10%;
    bottom:20%;

    transform:
        rotateY(-35deg)
        rotateX(-10deg);

    animation:holoFloat1 8s ease-in-out infinite;
}

@keyframes holoFloat1{
    50%{
        translate:0 -25px;
        rotate:2deg;
    }
}

@keyframes holoFloat2{
    50%{
        translate:0 25px;
        rotate:-2deg;
    }
}


/* =========================================
   FLOOR
========================================= */

.floor{
    position:absolute;

    width:900px;
    height:400px;

    bottom:-260px;

    border-radius:50%;

    background:
        repeating-radial-gradient(
            ellipse,
            rgba(124,58,237,.25) 0 1px,
            transparent 2px 45px
        );

    transform:
        perspective(500px)
        rotateX(70deg);

    filter:blur(.5px);

    opacity:.5;
}


/* =========================================
   3D LOGIN CARD
========================================= */

.loginWrap{
    position:relative;

    z-index:30;

    width:min(460px,90%);

    perspective:1200px;
}

.loginBox{

    position:relative;

    padding:48px 42px;

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.035)
        );

    border:
        1px solid rgba(255,255,255,.18);

    backdrop-filter:blur(30px);

    box-shadow:

        0 40px 100px rgba(0,0,0,.65),

        0 0 50px rgba(124,58,237,.25),

        0 0 120px rgba(59,130,246,.08),

        inset 0 1px 0 rgba(255,255,255,.18);

    text-align:center;

    transform-style:preserve-3d;

    animation:
        cardEntrance 1.2s
        cubic-bezier(.16,1,.3,1)
        forwards .2s;

    transition:
        transform .25s ease-out;
}

@keyframes cardEntrance{

    from{
        opacity:0;

        transform:
            translateY(80px)
            rotateX(25deg)
            scale(.8);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            rotateX(0)
            scale(1);
    }
}


/* glass shine */

.loginBox:before{

    content:"";

    position:absolute;

    inset:0;

    border-radius:30px;

    background:
        linear-gradient(
            120deg,
            transparent 25%,
            rgba(255,255,255,.08),
            transparent 60%
        );

    transform:
        translateX(-100%);

    animation:
        glassSweep 5s ease-in-out infinite;

    pointer-events:none;
}

@keyframes glassSweep{

    40%,
    100%{
        transform:translateX(100%);
    }
}


/* =========================================
   3D TX LOGO
========================================= */

.mainLogo{

    width:90px;
    height:90px;

    margin:0 auto 22px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:25px;

    font-size:48px;

    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #4f21d8 48%,
            #06b6d4
        );

    box-shadow:

        0 12px 0 #32148f,

        0 18px 25px rgba(0,0,0,.5),

        0 0 30px rgba(124,58,237,.8),

        0 0 80px rgba(6,182,212,.2);

    transform:
        translateZ(50px)
        rotateX(8deg)
        rotateY(-8deg);

    animation:
        mainLogoFloat 4s ease-in-out infinite;
}

@keyframes mainLogoFloat{

    50%{
        transform:
            translateZ(65px)
            rotateX(-8deg)
            rotateY(8deg)
            translateY(-8px);
    }
}


/* =========================================
   MAIN TEXT
========================================= */

.loginBox h1{

    font-size:38px;

    font-weight:800;

    letter-spacing:-1px;

    text-shadow:
        0 0 20px rgba(167,139,250,.35);

    transform:translateZ(35px);
}

.loginBox p{

    margin-top:10px;

    margin-bottom:32px;

    color:#b8b8c7;

    letter-spacing:3px;

    font-size:13px;

    transform:translateZ(25px);
}


/* =========================================
   3D BUTTONS
========================================= */

.btn{

    position:relative;

    width:100%;

    padding:17px;

    margin-top:13px;

    border-radius:16px;

    border:
        1px solid rgba(255,255,255,.18);

    color:#fff;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    overflow:hidden;

    transform:
        translateZ(30px);

    transition:
        transform .25s ease,
        box-shadow .25s ease;

}

.btn:before{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            100deg,
            transparent,
            rgba(255,255,255,.25),
            transparent
        );

    transform:translateX(-120%);

    transition:.6s;
}

.btn:hover:before{
    transform:translateX(120%);
}

.btn:hover{

    transform:
        translateZ(55px)
        translateY(-5px);

}

.btn.primary{

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #4f21d8
        );

    box-shadow:

        0 7px 0 #32148f,

        0 15px 35px rgba(124,58,237,.45),

        0 0 30px rgba(124,58,237,.3);
}

.btn.primary:hover{

    box-shadow:

        0 10px 0 #32148f,

        0 25px 50px rgba(124,58,237,.55);

}

.btn.secondary{

    background:
        rgba(255,255,255,.045);

    box-shadow:
        0 6px 0 rgba(20,15,45,.8),
        0 10px 25px rgba(0,0,0,.25);
}


/* =========================================
   FOOTER
========================================= */

.madeBy{

    margin-top:27px;

    font-size:10px;

    letter-spacing:3px;

    color:#777;

    transform:translateZ(20px);
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .title{
        font-size:42px;
        letter-spacing:5px;
    }

    .subtitle{
        font-size:9px;
        letter-spacing:3px;
    }

    .signature{
        font-size:9px;
        letter-spacing:2px;
    }

    .symbol{
        width:68px;
        height:68px;
        font-size:35px;
    }

    .ring1{
        width:280px;
        height:280px;
    }

    .ring2{
        width:410px;
        height:410px;
    }

    .ring3{
        width:540px;
        height:540px;
    }

    .portal{
        width:500px;
        height:500px;
    }

    .holo{
        width:100px;
        height:70px;
        opacity:.3;
    }

    .holo1{
        left:-30px;
    }

    .holo2{
        right:-30px;
    }

    .holo3,
    .holo4{
        display:none;
    }

    .loginWrap{
        width:88%;
    }

    .loginBox{
        padding:38px 24px;
        border-radius:25px;
    }

    .mainLogo{
        width:72px;
        height:72px;
        font-size:38px;
        border-radius:20px;
    }

    .loginBox h1{
        font-size:28px;
    }

    .loginBox p{
        font-size:10px;
        letter-spacing:2px;
    }

    .btn{
        padding:15px;
    }

    .madeBy{
        font-size:8px;
    }
}
</style>
</head>


<body>


<!-- =========================================
     SPLASH
========================================= -->

<section id="splash">

    <div class="stars"></div>

    <canvas id="particles"></canvas>

    <div class="portal"></div>

    <div class="ring ring1"></div>
    <div class="ring ring2"></div>
    <div class="ring ring3"></div>

    <div class="energy"></div>

    <div
        class="logoScene"
        id="logoScene"
    >

        <div class="symbol">
            TX
        </div>

        <div class="title">
            TALENT
        </div>

        <div class="title">
            EXCHANGE
        </div>

        <div class="subtitle">
            CONNECT • SHARE • LEARN
        </div>

        <div class="signature">
            MADE BY GOVARDHAN
        </div>

    </div>

    <div class="loading">
        ENTERING THE TALENT UNIVERSE
    </div>

</section>



<!-- =========================================
     MAIN 3D LOGIN
========================================= -->

<section id="main">

    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <div class="holo holo1"></div>
    <div class="holo holo2"></div>
    <div class="holo holo3"></div>
    <div class="holo holo4"></div>

    <div class="floor"></div>


    <div
        class="loginWrap"
        id="loginWrap"
    >

        <div
            class="loginBox"
            id="loginBox"
        >

            <div class="mainLogo">
                TX
            </div>

            <h1>
                Talent Exchange
            </h1>

            <p>
                CONNECT • SHARE • LEARN
            </p>


            <button
                class="btn primary"
                onclick="location.href='login.html'"
            >
                Login
            </button>


            <button
                class="btn secondary"
                onclick="location.href='register.html'"
            >
                Create Account
            </button>


            <div class="madeBy">
                MADE BY GOVARDHAN
            </div>

        </div>

    </div>

</section>



<script>

/* =========================================
   PARTICLES
========================================= */

const canvas =
    document.getElementById("particles");

const ctx =
    canvas.getContext("2d");

let particles=[];

const mobile =
    window.matchMedia(
        "(max-width:600px)"
    ).matches;


function resize(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


const count =
    mobile ? 420 : 850;


for(let i=0;i<count;i++){

    particles.push({

        x:
            (Math.random()-.5)
            *
            window.innerWidth
            *2,

        y:
            (Math.random()-.5)
            *
            window.innerHeight
            *2,

        z:
            Math.random()*2000,

        size:
            Math.random()*2+.5,

        speed:
            Math.random()*2+.5

    });

}


/* =========================================
   PARALLAX
========================================= */

let targetX=0;
let targetY=0;

let currentX=0;
let currentY=0;


window.addEventListener(
    "mousemove",
    e=>{

        targetX=
            (
                e.clientX-
                window.innerWidth/2
            )*.0004;

        targetY=
            (
                e.clientY-
                window.innerHeight/2
            )*.0004;

    }
);


window.addEventListener(
    "touchmove",
    e=>{

        if(!e.touches.length)
            return;

        const t=e.touches[0];

        targetX=
            (
                t.clientX-
                window.innerWidth/2
            )*.0006;

        targetY=
            (
                t.clientY-
                window.innerHeight/2
            )*.0006;

    },
    {passive:true}
);


/* =========================================
   GYROSCOPE
========================================= */

function orientation(e){

    if(
        typeof e.gamma !== "number" ||
        typeof e.beta !== "number"
    ) return;

    targetX=
        Math.max(
            -.07,
            Math.min(
                .07,
                e.gamma/250
            )
        );

    targetY=
        Math.max(
            -.07,
            Math.min(
                .07,
                e.beta/250
            )
        );

}


function enableMotion(){

    try{

        if(
            typeof DeviceOrientationEvent !==
            "undefined" &&

            typeof DeviceOrientationEvent
                .requestPermission ===
                "function"
        ){

            DeviceOrientationEvent
                .requestPermission()
                .then(permission=>{

                    if(
                        permission==="granted"
                    ){

                        window.addEventListener(
                            "deviceorientation",
                            orientation
                        );

                    }

                })
                .catch(()=>{});

        }else{

            window.addEventListener(
                "deviceorientation",
                orientation
            );

        }

    }catch(e){}

}


window.addEventListener(
    "touchstart",
    enableMotion,
    {once:true}
);


/* =========================================
   PARTICLE ANIMATION
========================================= */

function animate(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    currentX +=
        (targetX-currentX)*.05;

    currentY +=
        (targetY-currentY)*.05;


    for(const p of particles){

        p.z -=
            p.speed*
            (mobile?5:8);


        if(p.z<1){

            p.z=2000;

            p.x=
                (Math.random()-.5)
                *
                window.innerWidth
                *2;

            p.y=
                (Math.random()-.5)
                *
                window.innerHeight
                *2;

        }


        const scale=
            500/p.z;


        const x=
            canvas.width/2+
            p.x*scale+
            currentX*p.z;


        const y=
            canvas.height/2+
            p.y*scale+
            currentY*p.z;


        const size=
            Math.max(
                .2,
                p.size*scale*2
            );


        const opacity=
            Math.min(
                1,
                (2000-p.z)/900
            );


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            size,
            0,
            Math.PI*2
        );


        ctx.fillStyle=
            `rgba(
                ${110+Math.random()*50},
                ${80+Math.random()*50},
                255,
                ${opacity}
            )`;

        ctx.fill();

    }


    requestAnimationFrame(animate);

}

animate();


/* =========================================
   3D LOGIN CARD MOVEMENT
========================================= */

const card =
    document.getElementById("loginBox");


function cardAnimation(){

    const rx=
        currentY*-10;

    const ry=
        currentX*10;


    card.style.transform=
        `
        translateZ(20px)
        rotateX(${rx}deg)
        rotateY(${ry}deg)
        `;


    requestAnimationFrame(
        cardAnimation
    );

}

cardAnimation();

    document
        .getElementById("main")
        .classList
        .add("show");


    setTimeout(()=>{

        splash.remove();

        document.body.style
            .overflow="auto";

    },1300);

},4500);

</script>
