<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Talent Exchange</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .splash {
            width: 100%;
            height: 100vh;
            background: #000;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            position: relative;

            animation: fadeIn 0.8s ease forwards;
        }

        .title {
            color: #fff;
            font-size: clamp(32px, 7vw, 58px);
            font-weight: 600;
            letter-spacing: -1px;
            text-align: center;
        }

        .credit {
            position: absolute;
            bottom: 45px;

            color: #777;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.3px;

            animation: creditFade 1.2s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes creditFade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="splash">

        <div class="title">
            Talent Exchange
        </div>

        <div class="credit">
            Made by Govardhan
        </div>

    </div>

    <script>
        setTimeout(() => {
            window.location.href = "login.html";
        }, 2500);
    </script>

</body>
</html>
