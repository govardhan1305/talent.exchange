<style>

<script type="module">

import {
    auth,
    db
} from "./js/firebase-config.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    collection,
    getDocs,
    addDoc,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* =========================
   ELEMENTS
========================= */

const loading =
    document.getElementById("loading");

const usersGrid =
    document.getElementById("usersGrid");

const searchInput =
    document.getElementById("searchInput");

const searchBtn =
    document.getElementById("searchBtn");

const profileModal =
    document.getElementById("profileModal");

const modalContent =
    document.getElementById("modalContent");

let currentUser = null;
let allUsers = [];


/* =========================
   DEFAULT AVATAR
========================= */

function defaultAvatar(){

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             width="300"
             height="300"
             viewBox="0 0 300 300">

            <rect width="300"
                  height="300"
                  fill="#11111a"/>

            <circle
                cx="150"
                cy="110"
                r="55"
                fill="#29243a"/>

            <path
                d="M50 285
                   C60 205 105 170 150 170
                   C195 170 240 205 250 285"
                fill="#29243a"/>

        </svg>
        `);

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================
   NORMALIZE SKILLS
========================= */

function normalizeSkills(value){

    if(Array.isArray(value)){
        return value.filter(Boolean);
    }

    if(typeof value === "string"){

        return value
            .split(",")
            .map(x => x.trim())
            .filter(Boolean);

    }

    return [];

}


/* =========================
   LOAD USERS
========================= */

async function loadUsers(){

    usersGrid.innerHTML = `
        <div class="empty">
            <h3>Loading talents...</h3>
            <p>Searching the Talent Exchange network.</p>
        </div>
    `;

    try{

        const usersSnapshot =
            await getDocs(
                collection(db,"users")
            );

        allUsers = [];

        usersSnapshot.forEach(docSnap => {

            const data = docSnap.data();

            if(
                data.uid === currentUser.uid ||
                docSnap.id === currentUser.uid
            ){
                return;
            }

            /*
             Only show approved users.
             This prevents pending accounts from
             appearing in Find Skills.
            */

            if(
                data.status &&
                data.status !== "approved"
            ){
                return;
            }

            allUsers.push({

                id:docSnap.id,

                ...data,

                offeredSkills:
                    normalizeSkills(
                        data.offeredSkills
                    ),

                learningSkills:
                    normalizeSkills(
                        data.learningSkills ||
                        data.learningSkill
                    )

            });

        });

        renderUsers(allUsers);

    }catch(error){

        console.error(
            "LOAD USERS ERROR:",
            error
        );

        usersGrid.innerHTML = `
            <div class="empty">
                <h3>Unable to load users</h3>
                <p>${escapeHtml(error.message)}</p>
            </div>
        `;

    }finally{

        setTimeout(() => {

            loading.classList.add("hide");

        },300);

    }

}


/* =========================
   RENDER USERS
========================= */

function renderUsers(users){

    usersGrid.innerHTML = "";

    if(users.length === 0){

        usersGrid.innerHTML = `
            <div class="empty"
                 style="grid-column:1/-1">

                <h3>No talents found</h3>

                <p>
                    Try searching for another skill.
                </p>

            </div>
        `;

        return;
    }


    users.forEach(user => {

        const card =
            document.createElement("article");

        card.className = "user-card";

        const avatar =
            user.profilePhoto ||
            defaultAvatar();

        const offered =
            user.offeredSkills
                .slice(0,6);

        const learning =
            user.learningSkills
                .slice(0,4);


        const offeredHTML =
            offered.length

            ? offered.map(skill => `
                <span class="skill">
                    ${escapeHtml(skill)}
                </span>
            `).join("")

            : `
                <span class="skill">
                    No skills added
                </span>
            `;


        const learningHTML =
            learning.length

            ? learning.map(skill => `
                <span class="skill learn">
                    ${escapeHtml(skill)}
                </span>
            `).join("")

            : "";


        card.innerHTML = `

            <div class="profile-row">

                <img
                    class="avatar"
                    src="${escapeHtml(avatar)}"
                    alt="Profile"
                >

                <div>

                    <div class="user-name">
                        ${escapeHtml(
                            user.name ||
                            "Talent Exchange Member"
                        )}
                    </div>

                    <div class="user-email">
                        ${escapeHtml(
                            user.email || ""
                        )}
                    </div>

                </div>

            </div>


            <div class="bio">

                ${escapeHtml(
                    user.bio ||
                    "This member has not added a bio yet."
                )}

            </div>


            <div class="section-label">
                Offers
            </div>

            <div class="skills">
                ${offeredHTML}
            </div>


            ${
                learningHTML

                ? `
                    <div class="section-label">
                        Wants To Learn
                    </div>

                    <div class="skills">
                        ${learningHTML}
                    </div>
                `

                : ""
            }


            <div class="actions">

                <button
                    class="view-btn"
                    data-view="${escapeHtml(user.id)}"
                >
                    View Profile
                </button>

                <button
                    class="request-btn"
                    data-request="${escapeHtml(user.id)}"
                >
                    Send Request
                </button>

            </div>

        `;


        card
            .querySelector("[data-view]")
            .addEventListener(
                "click",
                () => showProfile(user)
            );


        card
            .querySelector("[data-request]")
            .addEventListener(
                "click",
                event => sendRequest(
                    user,
                    event.currentTarget
                )
            );


        usersGrid.appendChild(card);

    });

}


/* =========================
   SEARCH
========================= */

function searchUsers(){

    const term =
        searchInput.value
            .trim()
            .toLowerCase();

    if(!term){

        renderUsers(allUsers);

        return;
    }


    const results =
        allUsers.filter(user => {

            const name =
                String(
                    user.name || ""
                ).toLowerCase();

            const bio =
                String(
                    user.bio || ""
                ).toLowerCase();

            const email =
                String(
                    user.email || ""
                ).toLowerCase();

            const offered =
                user.offeredSkills
                    .join(" ")
                    .toLowerCase();

            const learning =
                user.learningSkills
                    .join(" ")
                    .toLowerCase();


            return (
                name.includes(term) ||
                bio.includes(term) ||
                email.includes(term) ||
                offered.includes(term) ||
                learning.includes(term)
            );

        });


    renderUsers(results);

}


searchBtn.addEventListener(
    "click",
    searchUsers
);


searchInput.addEventListener(
    "input",
    searchUsers
);


searchInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){
            searchUsers();
        }

    }
);


/* =========================
   SEND REQUEST
========================= */

async function sendRequest(
    targetUser,
    button
){

    if(!currentUser){
        return;
    }


    button.disabled = true;

    button.textContent = "Sending...";


    try{

        /*
         Check whether a pending request
         already exists.
        */

        const sentQuery =
            query(
                collection(db,"Requests"),
                where(
                    "senderId",
                    "==",
                    currentUser.uid
                ),
                where(
                    "receiverId",
                    "==",
                    targetUser.id
                )
            );


        const receivedQuery =
            query(
                collection(db,"Requests"),
                where(
                    "senderId",
                    "==",
                    targetUser.id
                ),
                where(
                    "receiverId",
                    "==",
                    currentUser.uid
                )
            );


        const [
            sentSnapshot,
            receivedSnapshot
        ] = await Promise.all([

            getDocs(sentQuery),

            getDocs(receivedQuery)

        ]);


        const alreadySent =
            sentSnapshot.docs.some(
                docSnap =>
                    docSnap.data().status === "pending"
            );


        const alreadyReceived =
            receivedSnapshot.docs.some(
                docSnap =>
                    docSnap.data().status === "pending"
            );


        if(alreadySent){

            button.textContent =
                "Request Sent";

            return;
        }


        if(alreadyReceived){

            button.textContent =
                "Check Requests";

            return;
        }


        await addDoc(
            collection(db,"Requests"),
            {

                senderId:
                    currentUser.uid,

                receiverId:
                    targetUser.id,

                senderName:
                    currentUser.displayName ||
                    JSON.parse(
                        localStorage.getItem(
                            "userProfile"
                        ) || "{}"
                    ).name ||
                    currentUser.email ||
                    "Talent Exchange Member",

                receiverName:
                    targetUser.name ||
                    "Talent Exchange Member",

                skill:
                    targetUser.offeredSkills[0] ||
                    "",

                status:"pending",

                createdAt:
                    serverTimestamp()

            }
        );


        button.textContent =
            "Request Sent";

    }catch(error){

        console.error(
            "SEND REQUEST ERROR:",
            error
        );

        button.disabled = false;

        button.textContent =
            "Send Request";

        alert(
            "Unable to send request.\n\n" +
            error.message
        );

    }

}

function showProfile(user){

    const avatar =
        user.profilePhoto ||
        defaultAvatar();


    const offered =
        user.offeredSkills.length

        ? user.offeredSkills.map(skill => `
            <span class="skill">
                ${escapeHtml(skill)}
            </span>
        `).join("")

        : `<span class="skill">
            No skills added
           </span>`;


    const learning =
        user.learningSkills.length

        ? user.learningSkills.map(skill => `
            <span class="skill learn">
                ${escapeHtml(skill)}
            </span>
        `).join("")

        : `<span class="skill learn">
            No learning goals added
           </span>`;


    const evidence =
        Array.isArray(user.evidence) &&
        user.evidence.length

        ? user.evidence.map(item => {

            const name =
                typeof item === "string"
                    ? item
                    : item.fileName || "Evidence";

            return `
                <div class="evidence-item">
                    ${escapeHtml(name)}
                </div>
            `;

        }).join("")

        : `
            <div class="evidence-item">
                No skill evidence uploaded.
            </div>
        `;


    const videos =
        Array.isArray(user.videos) &&
        user.videos.length

        ? user.videos.map(url => `
            <div class="evidence-item">
                <a
                    href="${escapeHtml(url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                    style="color:#a78bfa;text-decoration:none"
                >
                    View skill demonstration
                </a>
            </div>
        `).join("")

        : "";


    modalContent.innerHTML = `

        <div class="modal-profile">

            <img
                src="${escapeHtml(avatar)}"
                class="modal-avatar"
                alt="Profile"
            >

            <h2>
                ${escapeHtml(
                    user.name ||
                    "Talent Exchange Member"
                )}
            </h2>

            <p>
                ${escapeHtml(
                    user.email || ""
                )}
            </p>

        </div>


        <div class="modal-section">

            <h4>About</h4>

            <div class="modal-bio">

                ${escapeHtml(
                    user.bio ||
                    "No bio added yet."
                )}

            </div>

        </div>


        <div class="modal-section">

            <h4>Skills Offered</h4>

            <div class="skills">
                ${offered}
            </div>

        </div>


        <div class="modal-section">

            <h4>Skills Wanted</h4>

            <div class="skills">
                ${learning}
            </div>

        </div>


        <div class="modal-section">

            <h4>Skill Evidence</h4>

            <div class="evidence">
                ${evidence}
            </div>

        </div>


        ${
            videos

            ? `
                <div class="modal-section">

                    <h4>Skill Demonstrations</h4>

                    <div class="evidence">
                        ${videos}
                    </div>

                </div>
            `

            : ""
        }

    `;


    profileModal.classList.add("show");

}
